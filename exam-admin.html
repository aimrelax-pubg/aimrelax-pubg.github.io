/* =========================================================

function getRank(score) {

  if (score <= 5)
    return "🤖 ԲՈՏ";

  if (score <= 10)
    return "🎮 ՍԿՍՆԱԿ";

  if (score <= 14)
    return "🔥 ՄԱՐՏԻԿ";

  if (score <= 17)
    return "💀 ՍՊԱՆԻՉ";

  if (score <= 19)
    return "👑 ԷԼԻՏԱ";

  return "☠️ AIMRELAX ԱՍՏՎԱԾ";
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  if (value === null ||
      value === undefined) {

    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function login() {

    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.textContent = "";

  if (!email || !password) {

    errorBox.textContent =
      "Լրացրու email-ը և գաղտնաբառը։";

    return;
  }

  const {
    error
  } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {

    errorBox.textContent =
      error.message;

    return;
  }

  await checkAdmin();
}

/* =========================================================
   LOAD RESULTS
========================================================= */

async function loadResults() {

  const container =
    document.getElementById("resultsContainer");

  container.innerHTML = `
    <div class="loading">
      ⏳ Բեռնվում է...
    </div>
  `;

  const {
    data,
    error
  } = await supabaseClient
    .from("pubg_exam_results")
    .select("*")
    .order("completed_at", {
      ascending: false
    });

  if (error) {

    container.innerHTML = `
      <div class="card error">
        ❌ Չհաջողվեց կարդալ արդյունքները։
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }

  allResults = data || [];

  updateStats();

  renderResults();
}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

  const total =
    allResults.length;

  const average =
    total
      ? Math.round(
          allResults.reduce(
            (sum, item) =>
              sum + Number(item.percentage || 0),
            0
          ) / total
        )
      : 0;

  const perfect =
    allResults.filter(
      item =>
        Number(item.correct_answers) === 20
    ).length;

  document.getElementById("totalUsers")
    .textContent = total;

  document.getElementById("averageScore")
    .textContent = average + "%";

  document.getElementById("perfectScores")
    .textContent = perfect;
}


/* =========================================================
   RENDER
========================================================= */

function renderResults() {

  const container =
    document.getElementById("resultsContainer");

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const filtered =
    allResults.filter(item => {

      const email =
        String(item.user_email || "")
          .toLowerCase();

      return email.includes(search);
    });

  if (!filtered.length) {

    container.innerHTML = `
      <div class="card empty">
        📭 Արդյունքներ չեն գտնվել։
      </div>
    `;

    return;
  }

  container.innerHTML =
    filtered
      .map(renderResultCard)
      .join("");
}


/* =========================================================
   RESULT CARD
========================================================= */

function renderResultCard(result) {

  const score =
    Number(result.correct_answers || 0);

  const total =
    Number(result.total_questions || 20);

  const percentage =
    Number(result.percentage || 0);

  const rank =
    getRank(score);

  const email =
    result.user_email ||
    "Email-ը պահպանված չէ";

  const date =
    result.completed_at
      ? new Date(result.completed_at)
          .toLocaleString("hy-AM")
      : "—";

  let answers = [];

  /*
    answers-ը կարող է գալ JSON array
    կամ string տեսքով։
  */

  if (Array.isArray(result.answers)) {

    answers = result.answers;

  } else if (typeof result.answers === "string") {

    try {
      answers =
        JSON.parse(result.answers);
    } catch (e) {
      answers = [];
    }

  }

  return `
    <div class="result-card">

      <div class="result-header">

        <div class="email">
          👤 ${escapeHtml(email)}
        </div>

        <div class="result-info">

          <span class="badge gold">
            🏆 ${score}/${total}
          </span>

          <span class="badge">
            📊 ${percentage}%
          </span>

          <span class="badge">
            ${escapeHtml(rank)}
          </span>

          <span class="badge">
            🕒 ${escapeHtml(date)}
          </span>

        </div>

      </div>

      <div class="questions">

        ${renderQuestions(answers)}

      </div>

    </div>
  `;
}


/* =========================================================
   RENDER QUESTIONS
========================================================= */

function renderQuestions(answers) {

  return questions
    .map((question, index) => {

      const selected =
        Number.isInteger(
          Number(answers[index])
        )
          ? Number(answers[index])
          : -1;

      const correct =
        question.correct;

      const selectedText =
        selected >= 0 &&
        selected < question.options.length
          ? question.options[selected]
          : "Պատասխան չկա";

      const correctText =
        question.options[correct];

      const isCorrect =
        selected === correct;

      return `
        <div class="question">

          <div class="question-title">
            ${index + 1}. ${escapeHtml(question.q)}
          </div>

          <div class="
            answer
            user-answer
            ${isCorrect ? "correct" : "wrong"}
          ">

            <span class="label">
              👤 Մասնակցի պատասխանը
            </span>

            <span class="${
              isCorrect
                ? "correct-text"
                : "wrong-text"
            }">

              ${isCorrect ? "✅" : "❌"}
              ${escapeHtml(selectedText)}

            </span>

          </div>

          <div class="answer correct-answer">

            <span class="label">
              🟢 Ճիշտ պատասխանը
            </span>

            <span class="correct-text">
              ${escapeHtml(correctText)}
            </span>

          </div>

        </div>
      `;

    })
    .join("");
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  showLogin();
}


function showLogin() {

  document.getElementById("adminScreen")
    .classList.add("hidden");

  document.getElementById("loginScreen")
    .classList.remove("hidden");

  document.getElementById("loginError")
    .textContent = "";
}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (session) {

      setTimeout(() => {
        checkAdmin();
      }, 0);

    } else {

      showLogin();

    }

  }
);


/* =========================================================
   INITIAL
========================================================= */

(async function () {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if (session) {

    await checkAdmin();

  } else {

    showLogin();

  }

})();

</script>
