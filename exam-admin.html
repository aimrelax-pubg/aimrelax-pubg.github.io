    return "👑 ԷԼԻՏԱ";

  if (score >= 15)
    return "💀 ՍՊԱՆԻՉ";

  if (score >= 11)
    return "🔥 ՄԱՐՏԻԿ";

  if (score >= 6)
    return "🎮 ՍԿՍՆԱԿ";

  return "🤖 ԲՈՏ";
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   ACCESS
========================================================= */

function showAccessDenied() {

  document
    .getElementById("adminScreen")
    .classList.add("hidden");

  document
    .getElementById("accessDenied")
    .classList.remove("hidden");

}


function showAdmin() {

  document
    .getElementById("accessDenied")
    .classList.add("hidden");

  document
    .getElementById("adminScreen")
    .classList.remove("hidden");

}


/* =========================================================
   ANSWERS
========================================================= */

function buildAnswersHtml(answers) {

  if (!Array.isArray(answers)) {

    return `
      <div class="no-answers">
        Պատասխանները պահպանված չեն։
      </div>
    `;

  }


  let html = "";


  questions.forEach((question, index) => {

    const selected =
      Number(answers[index]);

    const correct =
      Number(question.answer);

    const isCorrect =
      selected === correct;

    let selectedText =
      "Պատասխան չի ընտրվել";

    if (
      Number.isInteger(selected) &&
      selected >= 0 &&
      selected < question.options.length
    ) {

      selectedText =
        question.options[selected];

    } else if (
      Number.isInteger(selected) &&
      selected >= 0
    ) {

      selectedText =
        "Տարբերակ " + (selected + 1);

    }


    const correctText =
      question.options[correct];


    html += `

      <div class="answer-item ${isCorrect ? "answer-correct" : "answer-wrong"}">

        <div
          class="answer-summary"
          onclick="toggleAnswer(this)"
        >

          <span>
            ${isCorrect ? "✅" : "❌"}
          </span>

          <span>
            ${index + 1}. ${isCorrect ? "Ճիշտ" : "Սխալ"}
          </span>

          <span style="margin-left:auto;color:#555;">
            ▾
          </span>

        </div>


        <div class="answer-details">

          <div>
            <b style="color:#777;">
              Հարց՝
            </b>
            ${escapeHtml(question.q)}
          </div>

          <div
            class="selected-answer"
            style="margin-top:6px;"
          >
            👤 Ընտրած պատասխան՝
            ${escapeHtml(selectedText)}
          </div>

          <div
            class="correct-answer"
            style="margin-top:3px;"
          >
            ✅ Ճիշտ պատասխան՝
            ${escapeHtml(correctText)}
          </div>

        </div>

      </div>

    `;

  });


  return html;

}


function toggleAnswer(element) {

  const details =
    element.nextElementSibling;

  if (!details)
    return;

  details.classList.toggle("open");

}


/* =========================================================
   LOAD RESULTS
========================================================= */

async function loadResults() {

  const message =
    document.getElementById("resultsMessage");

  const list =
    document.getElementById("playerList");


  message.className = "loading";
  message.textContent = "Բեռնվում է...";

  message.classList.remove("hidden");

  list.classList.add("hidden");

  list.innerHTML = "";


  try {

    /* ROLE CHECK */

    const {
      data: role,
      error: roleError
    } = await supabaseClient.rpc(
      "get_my_site_role"
    );


    const siteRole =
      String(role || "")
        .toLowerCase()
        .trim();


    if (
      roleError ||
      !["owner", "admin"].includes(siteRole)
    ) {

      showAccessDenied();
      return;

    }


    /* GET RESULTS */

    const {
      data,
      error
    } = await supabaseClient

      .from("pubg_exam_results")

      .select(`
        id,
        user_id,
        user_email,
        correct_answers,
        total_questions,
        percentage,
        completed_at,
        created_at,
        answers
      `)

      .order(
        "completed_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(
        "Results load error:",
        error
      );

      message.className = "error";

      message.textContent =
        "❌ Չհաջողվեց բեռնել արդյունքները։";

      return;

    }


    const results =
      Array.isArray(data)
        ? data
        : [];


    /* =====================================================
       DEDUPLICATE USERS
       Նույն մարդը ցուցադրվում է միայն մեկ անգամ։
       Քանի որ արդյունքները newest-first են,
       պահում ենք վերջին արդյունքը։
    ===================================================== */

    const uniqueUsers =
      new Map();


    results.forEach(item => {

      const key =
        item.user_id ||
        String(item.user_email || "")
          .toLowerCase()
          .trim();


      if (!uniqueUsers.has(key)) {

        uniqueUsers.set(
          key,
          item
        );

      }

    });


    const uniqueResults =
      Array.from(
        uniqueUsers.values()
      );


    /* =====================================================
       STATS
    ===================================================== */

    const total =
      uniqueResults.length;


    const average =
      total > 0

        ? Math.round(
            uniqueResults.reduce(
              (sum, item) =>
                sum +
                Number(
                  item.percentage || 0
                ),
              0
            ) / total
          )

        : 0;


    const perfect =
      uniqueResults.filter(
        item =>
          Number(
            item.correct_answers || 0
          ) === 20
      ).length;


    document
      .getElementById("totalStudents")
      .textContent = total;


    document
      .getElementById("averageScore")
      .textContent =
        average + "%";


    document
      .getElementById("perfectScores")
      .textContent =
        perfect;


    /* EMPTY */

    if (uniqueResults.length === 0) {

      message.className = "empty";

      message.textContent =
        "Դեռ ոչ ոք քննություն չի հանձնել։";

      return;

    }


    /* =====================================================
       CARDS
    ===================================================== */

    uniqueResults.forEach(
      (item, index) => {

        const score =
          Number(
            item.correct_answers || 0
          );


        const totalQuestions =
          Number(
            item.total_questions || 20
          );


        const percentage =
          Number(
            item.percentage ??
            Math.round(
              score /
              totalQuestions *
              100
            )
          );


        const rank =
          getRank(score);


        const email =
          item.user_email ||
          "Email-ը պահպանված չէ";


        const date =
          item.completed_at ||
          item.created_at;


        const formattedDate =
          date

            ? new Date(date)
                .toLocaleString(
                  "hy-AM",
                  {
                    dateStyle: "short",
                    timeStyle: "short"
                  }
                )

            : "—";


        const card =
          document.createElement("div");


        card.className =
          "player-card";


        card.innerHTML = `

          <div class="player-main">

            <div class="player-top">

              <div class="player-name">

                👤
                ${escapeHtml(email)}

              </div>

              <div class="player-number">
                #${index + 1}
              </div>

            </div>


            <div class="player-result">

              <span class="score-badge">
                ${score}/${totalQuestions}
              </span>

              <span class="percent-badge">
                ${percentage}%
              </span>

              <span class="rank-badge">
                ${escapeHtml(rank)}
              </span>

            </div>


            <div class="player-date">
              🕒 ${escapeHtml(formattedDate)}
            </div>

          </div>


          <div class="answers-box">

            <button
              class="answers-toggle"
              onclick="toggleAnswers(this)"
            >
              📋 Պատասխաններ
              <span style="float:right;">
                ▾
              </span>
            </button>


            <div class="answers-content">

              ${buildAnswersHtml(item.answers)}

            </div>

          </div>

        `;


        list.appendChild(card);

      }
    );


    message.classList.add("hidden");

    list.classList.remove("hidden");


  } catch (error) {

    console.error(
      "Unexpected results error:",
      error
    );

    message.className = "error";

    message.textContent =
      "❌ Տեղի ունեցավ անսպասելի սխալ։";

  }

}


/* =========================================================
   OPEN / CLOSE ANSWERS
========================================================= */

function toggleAnswers(button) {

  const content =
    button.nextElementSibling;


  if (!content)
    return;


  content.classList.toggle("open");


  const arrow =
    button.querySelector("span");


  if (arrow) {

    arrow.textContent =
      content.classList.contains("open")
        ? "▴"
        : "▾";

  }

}


/* =========================================================
   CHECK ADMIN
========================================================= */

async function checkAdmin() {

  try {

    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (
      userError ||
      !user
    ) {

      showAccessDenied();
      return;

    }


    const {
      data: role,
      error: roleError
    } =
      await supabaseClient.rpc(
        "get_my_site_role"
      );


    if (roleError) {

      console.error(
        "Role error:",
        roleError
      );

      showAccessDenied();
      return;

    }


    const siteRole =
      String(role || "")
        .toLowerCase()
        .trim();


    if (
      siteRole !== "owner" &&
      siteRole !== "admin"
    ) {

      showAccessDenied();
      return;

    }


    showAdmin();


    document
      .getElementById("adminEmail")
      .textContent =
        "Մուտք՝ " +
        (user.email || "") +
        " • " +
        siteRole.toUpperCase();


    await loadResults();


  } catch (error) {

    console.error(
      "Admin check error:",
      error
    );

    showAccessDenied();

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    setTimeout(
      () => {

        if (session) {

          checkAdmin();

        } else {

          showAccessDenied();

        }

      },
      0
    );

  }
);


/* =========================================================
   INITIAL
========================================================= */

(async function () {

  const {
    data: {
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if (session) {

    await checkAdmin();

  } else {

    showAccessDenied();

  }

})();

</script>
