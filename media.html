<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIMRELAX | Media</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f4f4f4;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:22px;font-weight:900;color:#ff7a00}a{text-decoration:none;color:#fff}.btn{border:1px solid #333;background:#151515;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.btn.primary{background:#ff7a00;color:#111;border-color:#ff7a00}.btn.ok{background:#102818;border-color:#2c6b3e;color:#82e5a4}.btn.danger{background:#2a1010;border-color:#6b2424;color:#ff9999}.card{background:#121212;border:1px solid #2b2b2b;border-radius:16px;padding:18px;margin:18px 0}.hero{text-align:center;padding:20px}.hero h1{font-size:31px;margin:0 0 8px}.muted,.hint{color:#999;font-size:13px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#bbb;font-size:13px;margin-bottom:6px}input,textarea{width:100%;background:#090909;color:#fff;border:1px solid #333;border-radius:10px;padding:11px;font:inherit}textarea{min-height:85px}.full{grid-column:1/-1}.status{margin-top:10px;min-height:22px}.oktxt{color:#69df94}.errtxt{color:#ff7777}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.active{border-color:#ff7a00;color:#ff7a00}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.media{background:#0c0c0c;border:1px solid #292929;border-radius:14px;overflow:hidden}.media img,.media video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#000}.body{padding:12px}.body h3{margin:0 0 6px}.body p{color:#aaa;white-space:pre-wrap}.empty{text-align:center;color:#888;padding:25px}.admin-row{display:grid;grid-template-columns:140px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid #292929;padding:12px 0}.admin-row img,.admin-row video{width:140px;height:85px;object-fit:cover;background:#000;border-radius:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.admin-row{grid-template-columns:90px 1fr}.admin-row img,.admin-row video{width:90px;height:65px}.actions{grid-column:2}}@media(max-width:500px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head><body><div class="wrap"><div class="top"><a class="btn" href="index.html">← AIMRELAX</a><div class="brand">AIMRELAX MEDIA</div><div id="auth-state" class="hint">Ստուգվում է…</div></div><section class="hero"><h1>🎬 Վիդեոներ և նկարներ</h1><div class="muted">Նյութերը հրապարակվում են միայն Owner/Admin-ի հաստատումից հետո։</div></section>
<section id="upload-card" class="card" style="display:none"><h2>➕ Ավելացնել նյութ</h2><div class="form"><div><label>Վերնագիր</label><input id="title" maxlength="120"></div><div><label>Նկար կամ վիդեո</label><input id="file" type="file" accept="image/*,video/*"><div class="hint">Առավելագույնը 50 MB</div></div><div class="full"><label>Նկարագրություն</label><textarea id="description" maxlength="1000"></textarea></div><div class="full"><button class="btn primary" id="upload">📤 Ուղարկել հաստատման</button></div></div><div id="upload-status" class="status"></div></section>
<section class="card"><div class="filters"><button class="btn active" data-filter="all">Բոլորը</button><button class="btn" data-filter="image">🖼️ Նկարներ</button><button class="btn" data-filter="video">🎥 Վիդեոներ</button></div><div id="grid" class="grid"><div class="empty">Բեռնվում է…</div></div></section>
<section id="mine-card" class="card" style="display:none"><h2>⏳ Իմ ուղարկածները</h2><div id="mine"></div></section><section id="admin-card" class="card" style="display:none"><h2>🛡️ Ադմինի հաստատումներ</h2><div class="hint">Սպասող նյութերը այստեղ են։</div><div id="admin"><div class="empty">Բեռնվում է…</div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://hvhlrbfjloiahbqmnrly.supabase.co",SUPABASE_ANON_KEY="sb_publishable_EcZUkLdUCVv3qWDD7jlvhg_OjTYu1jA",OWNER_ID="5f1c951f-1e76-4f82-9849-46becf038b55",BUCKET="aimrelax-media";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=x=>document.getElementById(x);let currentUser=null,role=null,filter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const manager=()=>role==='owner'||role==='admin';const type=m=>String(m.mime_type||'').startsWith('video/')?'video':'image';
async function getRole(){if(!currentUser){role=null;return}if(currentUser.id===OWNER_ID){role='owner';return}try{let r=await sb.rpc('get_my_site_role');role=!r.error&&r.data?String(r.data).toLowerCase():null}catch(e){role=null}}
async function url(path){let r=await sb.storage.from(BUCKET).createSignedUrl(path,3600);return r.error?null:r.data?.signedUrl}
async function load(){let r=await sb.from('aimrelax_media').select('id,title,description,storage_path,mime_type,nickname,created_at').eq('status','approved').order('created_at',{ascending:false});if(r.error){$('grid').innerHTML='<div class="empty">Չհաջողվեց բեռնել նյութերը։</div>';return}let a=(r.data||[]).filter(x=>filter==='all'||type(x)===filter),u=await Promise.all(a.map(x=>url(x.storage_path)));$('grid').innerHTML=a.length?a.map((m,i)=>{if(!u[i])return'';return `<article class="media">${type(m)==='video'?`<video controls preload="metadata" src="${u[i]}"></video>`:`<img loading="lazy" src="${u[i]}" alt="${esc(m.title)}">`}<div class="body"><h3>${esc(m.title)}</h3>${m.description?`<p>${esc(m.description)}</p>`:''}<div class="hint">👤 ${esc(m.nickname)} • ${new Date(m.created_at).toLocaleDateString('hy-AM')}</div></div></article>`}).join(''):'<div class="empty">Հաստատված նյութ դեռ չկա։</div>'}
async function mine(){if(!currentUser)return;let r=await sb.from('aimrelax_media').select('title,status,rejection_reason,created_at').eq('user_id',currentUser.id).neq('status','approved').order('created_at',{ascending:false});if(r.error||!r.data?.length){$('mine-card').style.display='none';return}$('mine-card').style.display='block';$('mine').innerHTML=r.data.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #292929"><b>${esc(x.title)}</b> — ${x.status==='pending'?'⏳ Սպասում է':'❌ Մերժված'}${x.rejection_reason?` — ${esc(x.rejection_reason)}`:''}</div>`).join('')}
async function adminLoad(){if(!manager()){$('admin-card').style.display='none';return}$('admin-card').style.display='block';let r=await sb.rpc('admin_list_media');if(r.error){$('admin').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}let a=(r.data||[]).filter(x=>x.status==='pending'),u=await Promise.all(a.map(x=>url(x.storage_path)));$('admin').innerHTML=a.length?a.map((m,i)=>`<div class="admin-row">${u[i]?(type(m)==='video'?`<video controls src="${u[i]}"></video>`:`<img src="${u[i]}" alt="">`):'<div>—</div>'}<div><b>${esc(m.title)}</b><div class="hint">👤 ${esc(m.nickname)} • ${new Date(m.created_at).toLocaleString('hy-AM')}</div>${m.description?`<div class="hint">${esc(m.description)}</div>`:''}</div><div class="actions"><button class="btn ok" data-ok="${m.id}">✅ Հաստատել</button><button class="btn danger" data-no="${m.id}">❌ Մերժել</button></div></div>`).join(''):'<div class="empty">Սպասող նյութ չկա։</div>';document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>moderate(b.dataset.ok,'approved'));document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>moderate(b.dataset.no,'rejected'))}
async function moderate(id,status){let reason=status==='rejected'?(prompt('Մերժման պատճառը՝')||null):null;let r=await sb.rpc('moderate_media',{p_media_id:id,p_status:status,p_reason:reason});if(r.error){alert(r.error.message);return}await adminLoad();await load()}
async function upload(){if(!currentUser)return alert('Նախ մուտք գործեք։');let f=$('file').files[0],t=$('title').value.trim(),d=$('description').value.trim();if(!f)return alert('Ընտրեք ֆայլ։');if(!f.type.startsWith('image/')&&!f.type.startsWith('video/'))return alert('Միայն նկար կամ վիդեո։');if(f.size>52428800)return alert('Ֆայլը 50 MB-ից մեծ է։');if(!t)return alert('Գրեք վերնագիր։');let ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin',path=`${currentUser.id}/${crypto.randomUUID()}.${ext}`;$('upload').disabled=true;$('upload-status').textContent='⏳ Վերբեռնում…';try{let u=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(u.error)throw u.error;let q=await sb.from('aimrelax_media').insert({user_id:currentUser.id,nickname:currentUser.user_metadata?.nickname||currentUser.email?.split('@')[0]||'Օգտատեր',title:t,description:d,storage_path:path,mime_type:f.type,status:'pending'});if(q.error){await sb.storage.from(BUCKET).remove([path]);throw q.error}$('file').value='';$('title').value='';$('description').value='';$('upload-status').textContent='✅ Ուղարկվեց։ Ադմինի հաստատումից հետո կհայտնվի էջում.';$('upload-status').className='status oktxt';await mine()}catch(e){$('upload-status').textContent='❌ '+(e.message||e);$('upload-status').className='status errtxt'}finally{$('upload').disabled=false}}
$('upload').onclick=upload;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;load()});
async function init(){let s=await sb.auth.getSession();currentUser=s.data.session?.user||null;await getRole();$('auth-state').textContent=currentUser?'👤 Մուտք գործած օգտատեր':'🔒 Մուտք գործեք՝ նյութ ավելացնելու համար';$('upload-card').style.display=currentUser?'block':'none';await load();await mine();await adminLoad()}sb.auth.onAuthStateChange(()=>setTimeout(init,0));init();
</script><script src="language.js"></script></body></html>
