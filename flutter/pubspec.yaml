name: aimrelax_live
description: AIMRELAX LIVE - Android PUBG broadcaster
publish_to: 'none'
version: 2.1.2+5
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  google_sign_in: ^6.2.2
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.1
  shared_preferences: ^2.3.5
  permission_handler: ^12.0.1
  wakelock_plus: ^1.4.0
  webview_flutter: ^4.10.0

# shared_preferences_android 2.5.0 switches to a new JNI/Pigeon backend.
# Pin the stable 2.4.x implementation because 2.5.0 can throw
# SharedPreferencesApiRegistrar.getAll NoSuchMethodError at runtime.
dependency_overrides:
  shared_preferences_android: 2.4.21

flutter:
  uses-material-design: true
