name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. FLUTTER
      # =========================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          flutter --version

      # =========================================================
      # 3. BACKUP CUSTOM ANDROID FILES
      # =========================================================
      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p /tmp/aimrelax_backup

          cp \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
            /tmp/aimrelax_backup/MainActivity.kt

          cp \
            android/app/src/main/AndroidManifest.xml \
            /tmp/aimrelax_backup/AndroidManifest.xml

          echo "Custom Android files backed up."

      # =========================================================
      # 4. RECREATE CLEAN FLUTTER ANDROID PROJECT
      # =========================================================
      - name: Regenerate Android project
        working-directory: flutter
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Flutter Android project created."

      # =========================================================
      # 5. RESTORE MAIN ACTIVITY
      # =========================================================
      - name: Restore MainActivity
        working-directory: flutter
        run: |
          set -e

          mkdir -p \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp \
            /tmp/aimrelax_backup/MainActivity.kt \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "MainActivity restored."

      # =========================================================
      # 6. RESTORE MANIFEST
      # =========================================================
      - name: Restore AndroidManifest
        working-directory: flutter
        run: |
          set -e

          cp \
            /tmp/aimrelax_backup/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          echo "AndroidManifest restored."

      # =========================================================
      # 7. CONFIGURE LIVEKIT + JITPACK
      # =========================================================
      - name: Configure LiveKit and JitPack
        working-directory: flutter
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          # -------------------------------------------------
          # Add LiveKit dependency
          # -------------------------------------------------

          app_gradle = Path("android/app/build.gradle.kts")
          s = app_gradle.read_text()

          dependency = (
              'implementation("io.livekit:livekit-android:2.29.0")'
          )

          if dependency not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  s += (
                      "\n\n"
                      "dependencies {\n"
                      "    " + dependency + "\n"
                      "}\n"
                  )

          app_gradle.write_text(s)

          # -------------------------------------------------
          # Add JitPack repository
          # -------------------------------------------------

          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()

          jitpack = (
              'maven { url = uri("https://jitpack.io") }'
          )

          if jitpack not in s:

              # Prefer adding JitPack to dependencyResolutionManagement
              if "dependencyResolutionManagement" in s:

                  start = s.find(
                      "dependencyResolutionManagement"
                  )

                  end = s.find(
                      "}",
                      start
                  )

                  block = s[start:end]

                  if "repositories" in block:

                      s = s[:start] + s[start:end].replace(
                          "mavenCentral()",
                          "mavenCentral()\n"
                          "        " + jitpack,
                          1
                      ) + s[end:]

                  else:
                      raise SystemExit(
                          "Could not find repositories block "
                          "inside dependencyResolutionManagement"
                      )

              else:
                  raise SystemExit(
                      "Could not find dependencyResolutionManagement "
                      "in settings.gradle.kts"
                  )

          settings.write_text(s)

          print("")
          print("======================================")
          print("LiveKit configured")
          print("======================================")
          print(dependency)
          print("")
          print("JitPack configured")
          print("======================================")
          print(settings.read_text())
          print("======================================")
          PY

      # =========================================================
      # 8. VERIFY FLUTTER GRADLE
      # =========================================================
      - name: Verify Flutter Gradle integration
        working-directory: flutter
        run: |
          set -e

          echo "Checking Android project..."

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/gradlew
          test -f android/app/build.gradle.kts

          echo "Checking Flutter Gradle integration..."

          grep -q "flutter_tools/gradle" \
            android/settings.gradle.kts

          echo "Checking JitPack..."

          grep -q "https://jitpack.io" \
            android/settings.gradle.kts

          echo "Checking LiveKit..."

          grep -q \
            "io.livekit:livekit-android:2.29.0" \
            android/app/build.gradle.kts

          echo ""
          echo "======================================"
          echo "Flutter Gradle integration: OK"
          echo "JitPack repository: OK"
          echo "LiveKit dependency: OK"
          echo "======================================"

      # =========================================================
      # 9. VERIFY FLUTTER V2 EMBEDDING
      # =========================================================
      - name: Verify Flutter V2 embedding
        working-directory: flutter
        run: |
          set -e

          echo "Checking for old Flutter V1 embedding..."

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android/app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo ""
            echo "======================================"
            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            echo "======================================"

            exit 1
          fi

          echo "Checking Flutter embedding metadata..."

          grep -q \
            'android:value="2"' \
            android/app/src/main/AndroidManifest.xml

          echo "Checking MainActivity..."

          grep -q \
            "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          grep -q \
            "configureFlutterEngine" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo ""
          echo "======================================"
          echo "Flutter V2 embedding confirmed."
          echo "======================================"

      # =========================================================
      # 10. VERIFY LIVEKIT NATIVE CODE
      # =========================================================
      - name: Verify LiveKit native configuration
        working-directory: flutter
        run: |
          set -e

          echo "Checking LiveKit dependency..."

          grep -q \
            "io.livekit:livekit-android:2.29.0" \
            android/app/build.gradle.kts

          echo "Checking LiveKit imports..."

          grep -q \
            "io.livekit.android" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo ""
          echo "======================================"
          echo "LiveKit native configuration found."
          echo "======================================"

      # =========================================================
      # 11. VERIFY ANDROID PERMISSIONS
      # =========================================================
      - name: Verify Android permissions
        working-directory: flutter
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          echo "Checking Android permissions..."

          grep -q \
            'android.permission.INTERNET' \
            "$MANIFEST"

          grep -q \
            'android.permission.RECORD_AUDIO' \
            "$MANIFEST"

          grep -q \
            'android.permission.FOREGROUND_SERVICE' \
            "$MANIFEST"

          grep -q \
            'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' \
            "$MANIFEST"

          echo ""
          echo "======================================"
          echo "Android permissions confirmed."
          echo "======================================"

      # =========================================================
      # 12. SHOW PROJECT CONFIG
      # =========================================================
      - name: Show Android configuration
        working-directory: flutter
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "ANDROID SETTINGS"
          echo "======================================"

          cat android/settings.gradle.kts

          echo ""
          echo "======================================"
          echo "APP GRADLE"
          echo "======================================"

          cat android/app/build.gradle.kts

          echo ""
          echo "======================================"
          echo "MANIFEST"
          echo "======================================"

          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "======================================"
          echo "MAIN ACTIVITY"
          echo "======================================"

          cat \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

      # =========================================================
      # 13. FLUTTER CLEAN
      # =========================================================
      - name: Flutter clean
        working-directory: flutter
        run: |
          flutter clean

      # =========================================================
      # 14. PUB GET
      # =========================================================
      - name: Flutter pub get
        working-directory: flutter
        run: |
          flutter pub get

      # =========================================================
      # 15. BUILD APK
      # =========================================================
      - name: Build APK
        working-directory: flutter
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "BUILDING AIMRELAX LIVE APK"
          echo "======================================"

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --verbose

      # =========================================================
      # 16. VERIFY APK
      # =========================================================
      - name: Verify APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo ""
          echo "======================================"

          if [ ! -f "$APK" ]; then

            echo "APK WAS NOT CREATED"
            echo ""
            echo "APK files found:"
            find build \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "AIMRELAX LIVE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      # =========================================================
      # 17. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
