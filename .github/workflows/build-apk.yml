name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Check Flutter project
        working-directory: flutter
        run: |
          set -e
          echo "Project directory:"
          pwd
          echo ""
          echo "Project files:"
          ls -la
          echo ""
          test -f pubspec.yaml
          echo "pubspec.yaml OK"

      - name: Backup native Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p /tmp/aimrelax

          cp android/app/src/main/AndroidManifest.xml \
            /tmp/aimrelax/AndroidManifest.xml

          cp android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
            /tmp/aimrelax/MainActivity.kt

          echo "Native files backed up."

      - name: Remove old Android project
        working-directory: flutter
        run: |
          set -e
          rm -rf android
          echo "Old Android project removed."

      - name: Create fresh Android project
        working-directory: flutter
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Android project created."

      - name: Restore AIMRELAX native files
        working-directory: flutter
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp /tmp/aimrelax/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          cp /tmp/aimrelax/MainActivity.kt \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "Native AIMRELAX files restored."

      - name: Configure LiveKit
        working-directory: flutter
        run: |
          set -e

          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
from pathlib import Path

path = Path("android/app/build.gradle.kts")
text = path.read_text()

dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

if dependency not in text:
    text = text.replace(
        "dependencies {",
        "dependencies {\n    " + dependency,
        1
    )

text = text.replace(
    "minSdk = flutter.minSdkVersion",
    "minSdk = 26"
)

text = text.replace(
    "targetSdk = flutter.targetSdkVersion",
    "targetSdk = 36"
)

path.write_text(text)
PY

          elif [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
from pathlib import Path

path = Path("android/app/build.gradle")
text = path.read_text()

dependency = 'implementation "io.livekit:livekit-android:2.29.0"'

if dependency not in text:
    text = text.replace(
        "dependencies {",
        "dependencies {\n    " + dependency,
        1
    )

text = text.replace(
    "minSdkVersion flutter.minSdkVersion",
    "minSdkVersion 26"
)

text = text.replace(
    "targetSdkVersion flutter.targetSdkVersion",
    "targetSdkVersion 36"
)

path.write_text(text)
PY

          else
            echo "Android Gradle file not found."
            exit 1
          fi

          echo "LiveKit configured."

      - name: Verify Flutter Android embedding
        working-directory: flutter
        run: |
          set -e

          echo "Checking MainActivity..."

          grep -q "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "FlutterActivity OK."

          echo "Checking for old Flutter v1 embedding..."

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude="GeneratedPluginRegistrant.java"; then

            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            exit 1
          fi

          echo "No Flutter v1 embedding found."

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Flutter clean
        working-directory: flutter
        run: flutter clean

      - name: Flutter pub get again
        working-directory: flutter
        run: flutter pub get

      - name: Build APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Check APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created."
            find build -name "*.apk" -print
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
