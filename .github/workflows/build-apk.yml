name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # FLUTTER
      # ==========================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          set -e
          flutter --version


      # ==========================================
      # BACKUP ANDROID FILES
      # ==========================================

      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p /tmp/aimrelax_backup

          cp \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
            /tmp/aimrelax_backup/MainActivity.kt

          cp \
            android/app/src/main/AndroidManifest.xml \
            /tmp/aimrelax_backup/AndroidManifest.xml

          echo "Android files backed up."


      # ==========================================
      # REGENERATE FLUTTER ANDROID PROJECT
      # ==========================================

      - name: Regenerate Android project
        working-directory: flutter
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Flutter Android project created."


      # ==========================================
      # RESTORE MAIN ACTIVITY
      # ==========================================

      - name: Restore MainActivity
        working-directory: flutter
        run: |
          set -e

          mkdir -p \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp \
            /tmp/aimrelax_backup/MainActivity.kt \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "MainActivity restored."


      # ==========================================
      # RESTORE MANIFEST
      # ==========================================

      - name: Restore AndroidManifest
        working-directory: flutter
        run: |
          set -e

          cp \
            /tmp/aimrelax_backup/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          echo "AndroidManifest restored."


      # ==========================================
      # CONFIGURE LIVEKIT + JITPACK
      # ==========================================

      - name: Configure LiveKit and JitPack
        working-directory: flutter
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle.kts")
          settings = Path("android/settings.gradle.kts")

          # ==========================================
          # APP BUILD.GRADLE.KTS
          # ==========================================

          app_text = app.read_text()

          livekit_dependency = (
              'implementation("io.livekit:livekit-android:2.29.0")'
          )

          if livekit_dependency not in app_text:

              if "dependencies {" in app_text:

                  app_text = app_text.replace(
                      "dependencies {",
                      "dependencies {\n"
                      "    " + livekit_dependency,
                      1
                  )

              else:

                  app_text += (
                      "\n\n"
                      "dependencies {\n"
                      "    " + livekit_dependency + "\n"
                      "}\n"
                  )

          app.write_text(app_text)

          # ==========================================
          # SETTINGS.GRADLE.KTS
          # ==========================================

          settings_text = settings.read_text()

          # Flutter's generated Gradle integration
          # MUST remain present.
          if "flutter_tools/gradle" not in settings_text:

              raise SystemExit(
                  "ERROR: Flutter Gradle integration is missing."
              )

          # ==========================================
          # ENSURE RepositoriesMode IMPORT
          # ==========================================

          import_line = (
              "import org.gradle.api.initialization.resolve.RepositoriesMode"
          )

          if import_line not in settings_text:

              settings_text = (
                  import_line
                  + "\n"
                  + settings_text
              )

          # ==========================================
          # ENSURE dependencyResolutionManagement
          # ==========================================

          if "dependencyResolutionManagement" not in settings_text:

              block = """dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}

"""

              if "rootProject.name" in settings_text:

                  settings_text = settings_text.replace(
                      "rootProject.name",
                      block + "rootProject.name",
                      1
                  )

              else:

                  settings_text = (
                      block
                      + settings_text
                  )

          else:

              # ==========================================
              # FIND dependencyResolutionManagement
              # ==========================================

              drm_match = re.search(
                  r"dependencyResolutionManagement\s*\{",
                  settings_text
              )

              if not drm_match:

                  raise SystemExit(
                      "ERROR: Could not locate dependencyResolutionManagement."
                  )

              drm_start = drm_match.start()

              # ==========================================
              # FIND repositories BLOCK
              # ==========================================

              repo_match = re.search(
                  r"repositories\s*\{",
                  settings_text[drm_start:]
              )

              if not repo_match:

                  raise SystemExit(
                      "ERROR: Could not locate repositories block."
                  )

              repo_start = (
                  drm_start
                  + repo_match.start()
              )

              brace_start = settings_text.find(
                  "{",
                  repo_start
              )

              depth = 0
              repo_end = None

              for i in range(
                  brace_start,
                  len(settings_text)
              ):

                  char = settings_text[i]

                  if char == "{":
                      depth += 1

                  elif char == "}":

                      depth -= 1

                      if depth == 0:

                          repo_end = i
                          break

              if repo_end is None:

                  raise SystemExit(
                      "ERROR: Could not parse repositories block."
                  )

              repo_block = settings_text[
                  repo_start:repo_end
              ]

              # ==========================================
              # ADD JITPACK
              # ==========================================

              if "jitpack.io" not in repo_block:

                  jitpack_line = (
                      'maven { url = uri("https://jitpack.io") }'
                  )

                  if "mavenCentral()" in repo_block:

                      repo_block = repo_block.replace(
                          "mavenCentral()",
                          "mavenCentral()\n"
                          "        "
                          + jitpack_line,
                          1
                      )

                  else:

                      repo_block += (
                          "\n"
                          "        "
                          + jitpack_line
                          + "\n"
                      )

                  settings_text = (
                      settings_text[:repo_start]
                      + repo_block
                      + settings_text[repo_end:]
                  )

          settings.write_text(settings_text)

          # ==========================================
          # PRINT FINAL CONFIGURATION
          # ==========================================

          print("")
          print("==========================================")
          print("FINAL SETTINGS.GRADLE.KTS")
          print("==========================================")
          print(settings.read_text())

          print("")
          print("==========================================")
          print("FINAL APP BUILD.GRADLE.KTS")
          print("==========================================")
          print(app.read_text())

          print("")
          print("==========================================")
          print("LIVEKIT + JITPACK CONFIGURED")
          print("==========================================")
          PY


      # ==========================================
      # VERIFY FLUTTER GRADLE
      # ==========================================

      - name: Verify Flutter Gradle integration
        working-directory: flutter
        run: |
          set -e

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradlew

          grep -q "flutter_tools/gradle" \
            android/settings.gradle.kts

          echo "Flutter Gradle integration: OK"


      # ==========================================
      # VERIFY JITPACK
      # ==========================================

      - name: Verify JitPack repository
        working-directory: flutter
        run: |
          set -e

          grep -q "jitpack.io" \
            android/settings.gradle.kts

          echo ""
          echo "JitPack repository found:"
          grep -n -B4 -A6 \
            "jitpack.io" \
            android/settings.gradle.kts

          echo ""
          echo "JitPack verification: OK"


      # ==========================================
      # VERIFY LIVEKIT
      # ==========================================

      - name: Verify LiveKit dependency
        working-directory: flutter
        run: |
          set -e

          grep -q \
            "io.livekit:livekit-android:2.29.0" \
            android/app/build.gradle.kts

          echo "LiveKit 2.29.0 dependency: OK"


      # ==========================================
      # VERIFY V2 EMBEDDING
      # ==========================================

      - name: Verify Flutter V2 embedding
        working-directory: flutter
        run: |
          set -e

          echo "Checking old Flutter V1 embedding..."

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android/app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo ""
            echo "=========================================="
            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            echo "=========================================="

            exit 1
          fi

          echo "No Flutter V1 embedding found."

          grep -q \
            'android:value="2"' \
            android/app/src/main/AndroidManifest.xml

          echo "Flutter V2 embedding metadata: OK"

          grep -q \
            "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "MainActivity: OK"


      # ==========================================
      # VERIFY ANDROID PERMISSIONS
      # ==========================================

      - name: Verify Android permissions
        working-directory: flutter
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q \
            "android.permission.INTERNET" \
            "$MANIFEST"

          grep -q \
            "android.permission.RECORD_AUDIO" \
            "$MANIFEST"

          grep -q \
            "android.permission.FOREGROUND_SERVICE" \
            "$MANIFEST"

          grep -q \
            "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" \
            "$MANIFEST"

          echo "Android permissions: OK"


      # ==========================================
      # SHOW CONFIGURATION
      # ==========================================

      - name: Show Android configuration
        working-directory: flutter
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "SETTINGS.GRADLE.KTS"
          echo "=========================================="

          cat android/settings.gradle.kts

          echo ""
          echo "=========================================="
          echo "APP BUILD.GRADLE.KTS"
          echo "=========================================="

          cat android/app/build.gradle.kts

          echo ""
          echo "=========================================="
          echo "ANDROID MANIFEST"
          echo "=========================================="

          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "=========================================="
          echo "MAIN ACTIVITY"
          echo "=========================================="

          cat android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt


      # ==========================================
      # FLUTTER CLEAN
      # ==========================================

      - name: Flutter clean
        working-directory: flutter
        run: |
          set -e
          flutter clean


      # ==========================================
      # PUB GET
      # ==========================================

      - name: Flutter pub get
        working-directory: flutter
        run: |
          set -e
          flutter pub get


      # ==========================================
      # RESOLVE ANDROID DEPENDENCIES
      # ==========================================

      - name: Resolve Android dependencies
        working-directory: flutter
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "RESOLVING ANDROID DEPENDENCIES"
          echo "=========================================="

          cd android

          ./gradlew \
            :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "ANDROID DEPENDENCIES RESOLVED"
          echo "=========================================="


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        working-directory: flutter
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "BUILDING AIMRELAX LIVE APK"
          echo "=========================================="

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --verbose

          echo ""
          echo "APK BUILD COMMAND FINISHED."


      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo ""
          echo "=========================================="

          if [ ! -f "$APK" ]; then

            echo "APK WAS NOT CREATED."
            echo ""
            echo "APK files found:"

            find build \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "AIMRELAX LIVE APK BUILD SUCCESSFUL"
          echo ""
          ls -lh "$APK"

          echo "=========================================="


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
