name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Verify project
        working-directory: flutter
        run: |
          set -e

          echo "Checking Flutter project..."
          test -f pubspec.yaml
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "Project structure OK"

      - name: Verify LiveKit dependency
        working-directory: flutter
        run: |
          set -e

          grep -q 'io.livekit:livekit-android:2.29.0' \
            android/app/build.gradle.kts

          echo "LiveKit 2.29.0 dependency OK"

      - name: Verify Flutter Android embedding
        working-directory: flutter
        run: |
          set -e

          grep -q 'FlutterActivity' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          if grep -RInE \
            'io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication' \
            android \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude='GeneratedPluginRegistrant.java'; then

            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            exit 1
          fi

          echo "Flutter Android embedding OK"

      - name: Verify AIMRELAX MethodChannel
        working-directory: flutter
        run: |
          set -e

          grep -q 'aimrelax.live/livekit' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          grep -q '"startLive"' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          grep -q '"stopLive"' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "AIMRELAX MethodChannel OK"

      - name: Verify LiveKit Android code
        working-directory: flutter
        run: |
          set -e

          grep -q 'ScreenCaptureParams' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          grep -q 'ScreenAudioCapturer' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          grep -q 'setScreenShareEnabled' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          grep -q 'setAudioBufferCallback' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "LiveKit screen + audio code OK"

      - name: Verify Android permissions
        working-directory: flutter
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' "$MANIFEST"

          echo "Android permissions OK"

      - name: Flutter clean
        working-directory: flutter
        run: flutter clean

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created."
            echo "Available APK files:"
            find build -type f -name "*.apk" -print
            exit 1
          fi

          echo "========================================"
          echo "AIMRELAX LIVE APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
