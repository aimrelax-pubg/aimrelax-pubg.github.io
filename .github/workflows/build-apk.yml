name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: |
          set -e
          flutter --version

      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p /tmp/aimrelax_backup

          cp \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
            /tmp/aimrelax_backup/MainActivity.kt

          cp \
            android/app/src/main/AndroidManifest.xml \
            /tmp/aimrelax_backup/AndroidManifest.xml

          echo "Android files backed up."

      - name: Regenerate Android project
        working-directory: flutter
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Flutter Android project created."

      - name: Restore MainActivity
        working-directory: flutter
        run: |
          set -e

          mkdir -p \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp \
           
