name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version


      # ============================================================
      # CHECK ORIGINAL ANDROID FILES
      # ============================================================

      - name: Check Android source files
        working-directory: flutter
        run: |
          set -e

          MAIN_ACTIVITY="android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.kt not found:"
            echo "$MAIN_ACTIVITY"
            exit 1
          fi

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found:"
            echo "$MANIFEST"
            exit 1
          fi

          echo "MainActivity found."
          echo "Manifest found."


      # ============================================================
      # BACKUP AIMRELAX FILES
      # ============================================================

      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p /tmp/aimrelax_backup

          MAIN_ACTIVITY="android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          cp "$MAIN_ACTIVITY" "/tmp/aimrelax_backup/MainActivity.kt"
          cp "$MANIFEST" "/tmp/aimrelax_backup/AndroidManifest.xml"

          test -f /tmp/aimrelax_backup/MainActivity.kt
          test -f /tmp/aimrelax_backup/AndroidManifest.xml

          echo "Android files backed up successfully."


      # ============================================================
      # RECREATE ANDROID PROJECT WITH FLUTTER
      # ============================================================

      - name: Regenerate Android project
        working-directory: flutter
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Flutter Android project created."


      # ============================================================
      # RESTORE MAIN ACTIVITY
      # ============================================================

      - name: Restore MainActivity
        working-directory: flutter
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp "/tmp/aimrelax_backup/MainActivity.kt" \
            "android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt"

          test -f \
            "android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt"

          echo "MainActivity restored."


      # ============================================================
      # RESTORE MANIFEST
      # ============================================================

      - name: Restore AndroidManifest
        working-directory: flutter
        run: |
          set -e

          cp "/tmp/aimrelax_backup/AndroidManifest.xml" \
            "android/app/src/main/AndroidManifest.xml"

          test -f "android/app/src/main/AndroidManifest.xml"

          echo "AndroidManifest restored."


      # ============================================================
      # CONFIGURE LIVEKIT + JITPACK
      # ============================================================

      - name: Configure LiveKit and JitPack
        working-directory: flutter
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app/build.gradle.kts")
          settings = Path("android/settings.gradle.kts")

          # --------------------------------------------------------
          # LIVEKIT DEPENDENCY
          # --------------------------------------------------------

          app_text = app.read_text()

          dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

          if dependency not in app_text:

              if "dependencies {" in app_text:

                  app_text = app_text.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )

              else:

                  app_text += (
                      "\n\n"
                      "dependencies {\n"
                      "    " + dependency + "\n"
                      "}\n"
                  )

          app.write_text(app_text)


          # --------------------------------------------------------
          # SETTINGS.GRADLE.KTS
          # --------------------------------------------------------

          settings_text = settings.read_text()

          if "flutter_tools/gradle" not in settings_text:
              raise SystemExit(
                  "ERROR: Flutter Gradle integration is missing."
              )


          # --------------------------------------------------------
          # REMOVE INCORRECT REPOSITORIESMODE IMPORT
          # --------------------------------------------------------

          settings_text = re.sub(
              r'(?m)^import org\.gradle\.api\.initialization\.resolve\.RepositoriesMode\s*\n?',
              '',
              settings_text
          )


          # --------------------------------------------------------
          # REMOVE EXISTING DEPENDENCY RESOLUTION BLOCK
          # --------------------------------------------------------

          settings_text = re.sub(
              r'(?s)dependencyResolutionManagement\s*\{.*?\n\}\s*\n*',
              '',
              settings_text,
              count=1
          )


          # --------------------------------------------------------
          # ADD CLEAN DEPENDENCY REPOSITORIES
          # --------------------------------------------------------

          block = """dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }

          """


          if "rootProject.name" in settings_text:

              settings_text = settings_text.replace(
                  "rootProject.name",
                  block + "rootProject.name",
                  1
              )

          else:

              settings_text += "\n" + block


          settings.write_text(settings_text)


          # --------------------------------------------------------
          # DEBUG OUTPUT
          # --------------------------------------------------------

          print("========================================")
          print("FINAL settings.gradle.kts")
          print("========================================")
          print(settings_text)

          print("========================================")
          print("FINAL app/build.gradle.kts")
          print("========================================")
          print(app_text)

          PY


      # ============================================================
      # VERIFY FLUTTER GRADLE
      # ============================================================

      - name: Verify Flutter Gradle
        working-directory: flutter
        run: |
          set -e

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradlew

          grep -q "flutter_tools/gradle" \
            android/settings.gradle.kts

          echo "Flutter Gradle integration OK."


      # ============================================================
      # VERIFY JITPACK
      # ============================================================

      - name: Verify JitPack
        working-directory: flutter
        run: |
          set -e

          grep -q "jitpack.io" \
            android/settings.gradle.kts

          echo "JitPack repository OK."


      # ============================================================
      # VERIFY LIVEKIT
      # ============================================================

      - name: Verify LiveKit
        working-directory: flutter
        run: |
          set -e

          grep -q \
            "io.livekit:livekit-android:2.29.0" \
            android/app/build.gradle.kts

          echo "LiveKit 2.29.0 OK."


      # ============================================================
      # VERIFY FLUTTER V2 EMBEDDING
      # ============================================================

      - name: Verify Flutter V2 embedding
        working-directory: flutter
        run: |
          set -e

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android/app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            exit 1
          fi

          grep -q \
            'android:value="2"' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "Flutter V2 embedding OK."


      # ============================================================
      # VERIFY ANDROID PERMISSIONS
      # ============================================================

      - name: Verify Android permissions
        working-directory: flutter
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q \
            "android.permission.INTERNET" \
            "$MANIFEST"

          grep -q \
            "android.permission.RECORD_AUDIO" \
            "$MANIFEST"

          grep -q \
            "android.permission.FOREGROUND_SERVICE" \
            "$MANIFEST"

          grep -q \
            "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" \
            "$MANIFEST"

          echo "Android permissions OK."


      # ============================================================
      # FLUTTER CLEAN
      # ============================================================

      - name: Flutter clean
        working-directory: flutter
        run: |
          set -e

          flutter clean


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Flutter pub get
        working-directory: flutter
        run: |
          set -e

          flutter pub get


      # ============================================================
      # RESOLVE ANDROID DEPENDENCIES
      # ============================================================

      - name: Resolve Android dependencies
        working-directory: flutter
        run: |
          set -e

          cd android

          ./gradlew \
            :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace

          echo "Android dependencies resolved."


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build APK
        working-directory: flutter
        run: |
          set -e

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --verbose

          echo "APK build finished."


      # ============================================================
      # VERIFY APK
      # ============================================================

      - name: Verify APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then

            echo "========================================"
            echo "APK WAS NOT CREATED"
            echo "========================================"

            find build \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "========================================"
          echo "AIMRELAX LIVE APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
