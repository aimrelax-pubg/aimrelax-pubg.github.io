name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # ---------------------------------------------------------
      # Backup custom AIMRELAX Android files
      # ---------------------------------------------------------
      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p /tmp/aimrelax_backup

          cp android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
             /tmp/aimrelax_backup/MainActivity.kt

          cp android/app/src/main/AndroidManifest.xml \
             /tmp/aimrelax_backup/AndroidManifest.xml

          echo "Custom Android files backed up."

      # ---------------------------------------------------------
      # Create clean modern Flutter Android project
      # ---------------------------------------------------------
      - name: Regenerate Android project
        working-directory: flutter
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Flutter Android project created."

      # ---------------------------------------------------------
      # Restore MainActivity
      # ---------------------------------------------------------
      - name: Restore MainActivity
        working-directory: flutter
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp /tmp/aimrelax_backup/MainActivity.kt \
             android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "MainActivity restored."

      # ---------------------------------------------------------
      # Restore manifest
      # ---------------------------------------------------------
      - name: Restore AndroidManifest
        working-directory: flutter
        run: |
          set -e

          cp /tmp/aimrelax_backup/AndroidManifest.xml \
             android/app/src/main/AndroidManifest.xml

          echo "AndroidManifest restored."

      # ---------------------------------------------------------
      # Add LiveKit dependency to freshly generated Gradle file
      # ---------------------------------------------------------
      - name: Configure LiveKit dependency
        working-directory: flutter
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

          if dependency not in s:
              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency
                  )
              else:
                  s += "\n\ndependencies {\n    " + dependency + "\n}\n"

          p.write_text(s)
          print(p.read_text())
          PY

          echo "LiveKit dependency configured."

      # ---------------------------------------------------------
      # DO NOT replace Flutter's generated settings.gradle.kts
      # Flutter's includeBuild() must remain intact.
      # ---------------------------------------------------------
      - name: Verify Flutter Gradle integration
        working-directory: flutter
        run: |
          set -e

          echo "Checking Flutter Gradle settings..."

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/gradlew
          test -f android/app/build.gradle.kts

          grep -q "flutter_tools/gradle" android/settings.gradle.kts

          echo "Flutter Gradle integration is present."

      # ---------------------------------------------------------
      # Verify no Flutter V1 embedding
      # ---------------------------------------------------------
      - name: Verify Flutter V2 embedding
        working-directory: flutter
        run: |
          set -e

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android/app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo "=========================================="
            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            echo "=========================================="

            exit 1
          fi

          grep -q 'android:value="2"' \
            android/app/src/main/AndroidManifest.xml

          grep -q "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          grep -q "configureFlutterEngine" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "Flutter V2 embedding confirmed."

      # ---------------------------------------------------------
      # Verify LiveKit
      # ---------------------------------------------------------
      - name: Verify LiveKit
        working-directory: flutter
        run: |
          set -e

          grep -q \
            'io.livekit:livekit-android:2.29.0' \
            android/app/build.gradle.kts

          grep -q \
            'io.livekit.android' \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "LiveKit configuration confirmed."

      # ---------------------------------------------------------
      # Verify Android permissions
      # ---------------------------------------------------------
      - name: Verify Android permissions
        working-directory: flutter
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE' "$MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' "$MANIFEST"

          echo "Android permissions confirmed."

      # ---------------------------------------------------------
      # Flutter dependencies
      # ---------------------------------------------------------
      - name: Flutter clean
        working-directory: flutter
        run: |
          flutter clean

      - name: Flutter pub get
        working-directory: flutter
        run: |
          flutter pub get

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------
      - name: Build APK
        working-directory: flutter
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --verbose

      # ---------------------------------------------------------
      # Verify APK
      # ---------------------------------------------------------
      - name: Verify APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created."

            echo "APK files found:"
            find build -type f -name "*.apk" -print

            exit 1
          fi

          echo "=========================================="
          echo "AIMRELAX LIVE APK BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh "$APK"

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
