name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e
          mkdir -p /tmp/aimrelax_backup

          cp android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
            /tmp/aimrelax_backup/MainActivity.kt

          cp android/app/src/main/AndroidManifest.xml \
            /tmp/aimrelax_backup/AndroidManifest.xml

      - name: Regenerate Android project
        working-directory: flutter
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

      - name: Restore MainActivity
        working-directory: flutter
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp /tmp/aimrelax_backup/MainActivity.kt \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

      - name: Restore AndroidManifest
        working-directory: flutter
        run: |
          set -e

          cp /tmp/aimrelax_backup/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

      - name: Configure LiveKit
        working-directory: flutter
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          app = Path("android/app/build.gradle.kts")
          settings = Path("android/settings.gradle.kts")

          app_text = app.read_text()
          settings_text = settings.read_text()

          dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

          if dependency not in app_text:
              marker = "dependencies {"
              if marker in app_text:
                  app_text = app_text.replace(
                      marker,
                      marker + "\n    " + dependency,
                      1
                  )
              else:
                  app_text += (
                      "\n\ndependencies {\n"
                      "    " + dependency + "\n"
                      "}\n"
                  )

          app.write_text(app_text)

          if "https://jitpack.io" not in settings_text:
              settings_text = settings_text.replace(
                  "mavenCentral()",
                  "mavenCentral()\n        maven { url = uri(\"https://jitpack.io\") }",
                  1
              )

          settings.write_text(settings_text)

          print("LiveKit configured.")
          print("JitPack configured.")
          PY

      - name: Verify Flutter Gradle integration
        working-directory: flutter
        run: |
          set -e

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradlew

          grep -q "flutter_tools/gradle" \
            android/settings.gradle.kts

          echo "Flutter Gradle integration OK."

      - name: Verify JitPack
        working-directory: flutter
        run: |
          set -e

          grep -q "jitpack.io" \
            android/settings.gradle.kts

          echo "JitPack repository OK."

      - name: Verify LiveKit
        working-directory: flutter
        run: |
          set -e

          grep -q "io.livekit:livekit-android:2.29.0" \
            android/app/build.gradle.kts

          grep -q "io.livekit.android" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "LiveKit configuration OK."

      - name: Verify Flutter V2 embedding
        working-directory: flutter
        run: |
          set -e

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android/app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo "Old Flutter V1 embedding found."
            exit 1
          fi

          grep -q 'android:value="2"' \
            android/app/src/main/AndroidManifest.xml

          grep -q "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "Flutter V2 embedding OK."

      - name: Verify Android permissions
        working-directory: flutter
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q "android.permission.INTERNET" "$MANIFEST"
          grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"
          grep -q "android.permission.FOREGROUND_SERVICE" "$MANIFEST"
          grep -q "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" "$MANIFEST"

          echo "Android permissions OK."

      - name: Show configuration
        working-directory: flutter
        run: |
          echo "===== SETTINGS ====="
          cat android/settings.gradle.kts

          echo "===== APP GRADLE ====="
          cat android/app/build.gradle.kts

          echo "===== MAIN ACTIVITY ====="
          cat android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

      - name: Flutter clean
        working-directory: flutter
        run: flutter clean

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Resolve Android dependencies
        working-directory: flutter
        run: |
          set -e

          cd android

          ./gradlew :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace

      - name: Build APK
        working-directory: flutter
        run: |
          set -e

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --verbose

      - name: Verify APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK WAS NOT CREATED."
            echo ""
            echo "Available APK files:"
            find build -type f -name "*.apk" -print
            exit 1
          fi

          echo "======================================"
          echo "AIMRELAX LIVE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
