name: Build AIMRELAX LIVE APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true

  - name: Check Flutter project
    working-directory: flutter
    run: |
      set -e
      echo "Project: $(pwd)"
      test -f pubspec.yaml
      echo "pubspec.yaml OK"

  - name: Backup Android files
    working-directory: flutter
    run: |
      set -e
      mkdir -p /tmp/aimrelax

      cp android/app/src/main/AndroidManifest.xml \
        /tmp/aimrelax/AndroidManifest.xml

      cp android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
        /tmp/aimrelax/MainActivity.kt

      echo "Android files backed up."

  - name: Create fresh Android project
    working-directory: flutter
    run: |
      set -e
      rm -rf android

      flutter create \
        --platforms=android \
        --org com.aimrelax \
        --project-name aimrelax_live \
        .

      echo "Fresh Android project created."

  - name: Restore Android files
    working-directory: flutter
    run: |
      set -e

      mkdir -p android/app/src/main/kotlin/com/aimrelax/aimrelax_live

      cp /tmp/aimrelax/AndroidManifest.xml \
        android/app/src/main/AndroidManifest.xml

      cp /tmp/aimrelax/MainActivity.kt \
        android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

      echo "AIMRELAX Android files restored."

  - name: Configure LiveKit
    working-directory: flutter
    run: |
      set -e

      if [ -f android/app/build.gradle.kts ]; then
        sed -i '/dependencies {/a\    implementation("io.livekit:livekit-android:2.29.0")' android/app/build.gradle.kts
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
        sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts
      elif [ -f android/app/build.gradle ]; then
        sed -i '/dependencies {/a\    implementation "io.livekit:livekit-android:2.29.0"' android/app/build.gradle
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle
        sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle
      else
        echo "ERROR: Android Gradle file not found."
        exit 1
      fi

      echo "LiveKit configured."

  - name: Check Flutter embedding
    working-directory: flutter
    run: |
      set -e

      grep -q "FlutterActivity" \
        android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

      if grep -RInE \
        "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
        android \
        --exclude-dir=build \
        --exclude-dir=.gradle \
        --exclude="GeneratedPluginRegistrant.java"; then
        echo "ERROR: Flutter v1 embedding found."
        exit 1
      fi

      echo "Flutter v2 embedding OK."

  - name: Flutter pub get
    working-directory: flutter
    run: flutter pub get

  - name: Flutter clean
    working-directory: flutter
    run: flutter clean

  - name: Flutter pub get again
    working-directory: flutter
    run: flutter pub get

  - name: Build APK
    working-directory: flutter
    run: flutter build apk --release

  - name: Verify APK
    working-directory: flutter
    run: |
      set -e

      APK="build/app/outputs/flutter-apk/app-release.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: APK was not created."
        find build -name "*.apk" -print
        exit 1
      fi

      echo "======================================"
      echo "APK BUILD SUCCESSFUL"
      echo "======================================"
      ls -lh "$APK"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: AIMRELAX-LIVE-APK
      path: flutter/build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
