name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p /tmp/aimrelax_backup

          cp android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
             /tmp/aimrelax_backup/MainActivity.kt

          cp android/app/src/main/AndroidManifest.xml \
             /tmp/aimrelax_backup/AndroidManifest.xml

          echo "Android files backed up."

      - name: Regenerate Android project
        working-directory: flutter
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Flutter Android project created."

      - name: Restore MainActivity
        working-directory: flutter
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp /tmp/aimrelax_backup/MainActivity.kt \
             android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "MainActivity restored."

      - name: Restore AndroidManifest
        working-directory: flutter
        run: |
          set -e

          cp /tmp/aimrelax_backup/AndroidManifest.xml \
             android/app/src/main/AndroidManifest.xml

          echo "AndroidManifest restored."

      - name: Configure LiveKit dependency
        working-directory: flutter
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          # -------------------------------------------------
          # APP GRADLE
          # -------------------------------------------------

          app = Path("android/app/build.gradle.kts")
          s = app.read_text()

          dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

          if dependency not in s:

              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )

              else:
                  s += (
                      "\n\n"
                      "dependencies {\n"
                      "    " + dependency + "\n"
                      "}\n"
                  )

          app.write_text(s)

          # -------------------------------------------------
          # SETTINGS GRADLE
          # -------------------------------------------------

          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()

          jitpack = 'maven { url = uri("https://jitpack.io") }'

          if jitpack not in s:

              # Case 1:
              # dependencyResolutionManagement exists
              match = re.search(
                  r'dependencyResolutionManagement\s*\{',
                  s
              )

              if match:

                  start = match.start()

                  repo_match = re.search(
                      r'repositories\s*\{',
                      s[start:]
                  )

                  if not repo_match:
                      raise SystemExit(
                          "dependencyResolutionManagement exists, "
                          "but repositories block was not found."
                      )

                  repo_start = start + repo_match.start()

                  # Find matching braces for repositories block
                  brace_start = s.find("{", repo_start)

                  depth = 0
                  repo_end = None

                  for i in range(brace_start, len(s)):
                      if s[i] == "{":
                          depth += 1
                      elif s[i] == "}":
                          depth -= 1
                          if depth == 0:
                              repo_end = i
                              break

                  if repo_end is None:
                      raise SystemExit(
                          "Could not determine repositories block."
                      )

                  repo_block = s[repo_start:repo_end]

                  if jitpack not in repo_block:
                      if "mavenCentral()" in repo_block:
                          repo_block = repo_block.replace(
                              "mavenCentral()",
                              "mavenCentral()\n        " + jitpack,
                              1
                          )
                      else:
                          repo_block += (
                              "\n        " + jitpack + "\n"
                          )

                      s = (
                          s[:repo_start]
                          + repo_block
                          + s[repo_end:]
                      )

              # Case 2:
              # Older/simple generated settings
              else:

                  if "repositories {" in s:

                      repo_pos = s.find("repositories {")

                      brace_start = s.find("{", repo_pos)

                      depth = 0
                      repo_end = None

                      for i in range(brace_start, len(s)):
                          if s[i] == "{":
                              depth += 1
                          elif s[i] == "}":
                              depth -= 1
                              if depth == 0:
                                  repo_end = i
                                  break

                      if repo_end is None:
                          raise SystemExit(
                              "Could not determine repositories block."
                          )

                      repo_block = s[repo_pos:repo_end]

                      if jitpack not in repo_block:

                          if "mavenCentral()" in repo_block:
                              repo_block = repo_block.replace(
                                  "mavenCentral()",
                                  "mavenCentral()\n        " + jitpack,
                                  1
                              )
                          else:
                              repo_block += (
                                  "\n        " + jitpack + "\n"
                              )

                          s = (
                              s[:repo_pos]
                              + repo_block
                              + s[repo_end:]
                          )

                  else:
                      raise SystemExit(
                          "Could not find any repositories block "
                          "in generated settings.gradle.kts"
                      )

          settings.write_text(s)

          print("")
          print("======================================")
          print("LIVEKIT CONFIGURATION")
          print("======================================")
          print("LiveKit: 2.29.0")
          print("JitPack: configured")
          print("")
          print("SETTINGS:")
          print(settings.read_text())
          print("")
          print("APP GRADLE:")
          print(app.read_text())
          print("======================================")
          PY

      - name: Verify Flutter Gradle integration
        working-directory: flutter
        run: |
          set -e

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/gradle.properties
          test -f android/gradlew
          test -f android/app/build.gradle.kts

          echo "Checking Flutter Gradle plugin..."

          grep -q "flutter_tools/gradle" \
            android/settings.gradle.kts

          echo "Flutter Gradle integration: OK"

      - name: Verify JitPack
        working-directory: flutter
        run: |
          set -e

          grep -q "jitpack.io" \
            android/settings.gradle.kts

          echo "JitPack repository: OK"

      - name: Verify LiveKit
        working-directory: flutter
        run: |
          set -e

          grep -q \
            "io.livekit:livekit-android:2.29.0" \
            android/app/build.gradle.kts

          echo "LiveKit dependency: OK"

      - name: Verify Flutter V2 embedding
        working-directory: flutter
        run: |
          set -e

          echo "Checking old Flutter V1 embedding..."

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android/app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo ""
            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            exit 1
          fi

          grep -q \
            'android:value="2"' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "Flutter V2 embedding: OK"

      - name: Verify Android permissions
        working-directory: flutter
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q \
            'android.permission.INTERNET' \
            "$MANIFEST"

          grep -q \
            'android.permission.RECORD_AUDIO' \
            "$MANIFEST"

          grep -q \
            'android.permission.FOREGROUND_SERVICE' \
            "$MANIFEST"

          grep -q \
            'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' \
            "$MANIFEST"

          echo "Android permissions: OK"

      - name: Flutter clean
        working-directory: flutter
        run: |
          flutter clean

      - name: Flutter pub get
        working-directory: flutter
        run: |
          flutter pub get

      - name: Build APK
        working-directory: flutter
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "BUILDING AIMRELAX LIVE APK"
          echo "======================================"

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --verbose

      - name: Verify APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo ""
          echo "======================================"

          if [ ! -f "$APK" ]; then
            echo "APK WAS NOT CREATED"
            echo ""
            find build -type f -name "*.apk" -print
            exit 1
          fi

          echo "AIMRELAX LIVE APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
