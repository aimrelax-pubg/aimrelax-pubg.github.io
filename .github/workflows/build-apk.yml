name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check Flutter project
        working-directory: flutter
        run: |
          set -e
          test -f pubspec.yaml
          echo "Flutter project OK"

      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p /tmp/aimrelax

          cp android/app/src/main/AndroidManifest.xml \
            /tmp/aimrelax/AndroidManifest.xml

          cp android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
            /tmp/aimrelax/MainActivity.kt

          echo "Android files backed up"

      - name: Remove old Android project
        working-directory: flutter
        run: |
          set -e
          rm -rf android
          echo "Old Android project removed"

      - name: Create fresh Android project
        working-directory: flutter
        run: |
          set -e

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Android project created"

      - name: Restore AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp /tmp/aimrelax/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml

          cp /tmp/aimrelax/MainActivity.kt \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "AIMRELAX Android files restored"

      - name: Add LiveKit dependency
        working-directory: flutter
        run: |
          set -e

          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/dependencies {/a\    implementation("io.livekit:livekit-android:2.29.0")' \
              android/app/build.gradle.kts

            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' \
              android/app/build.gradle.kts

            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
              android/app/build.gradle.kts

          elif [ -f android/app/build.gradle ]; then
            sed -i '/dependencies {/a\    implementation "io.livekit:livekit-android:2.29.0"' \
              android/app/build.gradle

            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' \
              android/app/build.gradle

            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' \
              android/app/build.gradle

          else
            echo "Android Gradle file not found"
            exit 1
          fi

          echo "LiveKit dependency added"

      - name: Verify Flutter embedding
        working-directory: flutter
        run: |
          set -e

          grep -q "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "FlutterActivity found"

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            --exclude="GeneratedPluginRegistrant.java"; then

            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            exit 1
          fi

          echo "Flutter v2 embedding OK"

      - name: Flutter clean
        working-directory: flutter
        run: flutter clean

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: flutter
        run: flutter build apk --release

      - name: Check APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created"
            echo "Searching for APK files:"
            find build -name "*.apk" -print
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
