name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Check Android files
        working-directory: flutter
        run: |
          set -e

          test -f android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android source files OK."

      - name: Backup AIMRELAX Android files
        working-directory: flutter
        run: |
          set -e

          rm -rf /tmp/aimrelax_backup
          mkdir -p /tmp/aimrelax_backup

          cp android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt \
             /tmp/aimrelax_backup/MainActivity.kt

          cp android/app/src/main/AndroidManifest.xml \
             /tmp/aimrelax_backup/AndroidManifest.xml

          test -f /tmp/aimrelax_backup/MainActivity.kt
          test -f /tmp/aimrelax_backup/AndroidManifest.xml

      - name: Regenerate Android project
        working-directory: flutter
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.aimrelax \
            --project-name aimrelax_live \
            .

          echo "Fresh Flutter Android project created."

      - name: Restore MainActivity
        working-directory: flutter
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/aimrelax/aimrelax_live

          cp /tmp/aimrelax_backup/MainActivity.kt \
             android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

      - name: Restore AndroidManifest
        working-directory: flutter
        run: |
          set -e

          cp /tmp/aimrelax_backup/AndroidManifest.xml \
             android/app/src/main/AndroidManifest.xml

      - name: Configure Gradle repositories
        working-directory: flutter
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          root_gradle = Path("android/build.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")

          settings_text = settings.read_text()
          root_text = root_gradle.read_text()
          app_text = app_gradle.read_text()

          # ---------------------------------------------------------
          # LIVEKIT
          # ---------------------------------------------------------

          livekit = 'implementation("io.livekit:livekit-android:2.29.0")'

          if livekit not in app_text:
              if "dependencies {" in app_text:
                  app_text = app_text.replace(
                      "dependencies {",
                      "dependencies {\n    " + livekit,
                      1
                  )
              else:
                  app_text += (
                      "\n\ndependencies {\n"
                      "    " + livekit + "\n"
                      "}\n"
                  )

          app_gradle.write_text(app_text)

          # ---------------------------------------------------------
          # SETTINGS.GRADLE.KTS
          # ---------------------------------------------------------

          if "flutter_tools/gradle" not in settings_text:
              raise SystemExit(
                  "Flutter Gradle integration missing."
              )

          # Remove old dependencyResolutionManagement blocks.
          start = settings_text.find(
              "dependencyResolutionManagement {"
          )

          if start != -1:
              depth = 0
              end = None

              for i in range(start, len(settings_text)):
                  if settings_text[i] == "{":
                      depth += 1
                  elif settings_text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end:
                  settings_text = (
                      settings_text[:start] +
                      settings_text[end:]
                  )

          # Add JitPack before rootProject.name.
          repository_block = """
          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.PREFER_SETTINGS
              )
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://jitpack.io")
                  }
              }
          }

          """

          # Import required by RepositoriesMode.
          if "RepositoriesMode" not in settings_text:
              settings_text = (
                  'import org.gradle.api.initialization.resolve.RepositoriesMode\n'
                  + settings_text
              )

          if "rootProject.name" in settings_text:
              settings_text = settings_text.replace(
                  "rootProject.name",
                  repository_block + "rootProject.name",
                  1
              )
          else:
              settings_text += "\n" + repository_block

          settings.write_text(settings_text)

          # ---------------------------------------------------------
          # ROOT BUILD.GRADLE.KTS
          # ---------------------------------------------------------

          root_repo_block = """
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://jitpack.io")
                  }
              }
          }
          """

          if "https://jitpack.io" not in root_text:
              root_text += "\n" + root_repo_block

          root_gradle.write_text(root_text)

          # ---------------------------------------------------------
          # PRINT FINAL FILES
          # ---------------------------------------------------------

          print("========================================")
          print("settings.gradle.kts")
          print("========================================")
          print(settings_text)

          print("========================================")
          print("build.gradle.kts")
          print("========================================")
          print(root_text)

          print("========================================")
          print("app/build.gradle.kts")
          print("========================================")
          print(app_text)
          PY

      - name: Verify Flutter Gradle
        working-directory: flutter
        run: |
          set -e

          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradlew

          grep -q "flutter_tools/gradle" \
            android/settings.gradle.kts

          echo "Flutter Gradle OK."

      - name: Verify JitPack everywhere
        working-directory: flutter
        run: |
          set -e

          grep -q "jitpack.io" \
            android/settings.gradle.kts

          grep -q "jitpack.io" \
            android/build.gradle.kts

          echo "JitPack configured."

      - name: Verify LiveKit
        working-directory: flutter
        run: |
          set -e

          grep -q \
            "io.livekit:livekit-android:2.29.0" \
            android/app/build.gradle.kts

          echo "LiveKit 2.29.0 configured."

      - name: Verify Flutter V2 embedding
        working-directory: flutter
        run: |
          set -e

          if grep -RInE \
            "io\.flutter\.app\.|PluginRegistry\.Registrar|FlutterActivityDelegate|FlutterApplication" \
            android/app/src/main \
            --include="*.kt" \
            --include="*.java"; then

            echo "OLD FLUTTER V1 EMBEDDING FOUND"
            exit 1
          fi

          grep -q \
            'android:value="2"' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            "FlutterActivity" \
            android/app/src/main/kotlin/com/aimrelax/aimrelax_live/MainActivity.kt

          echo "Flutter V2 embedding OK."

      - name: Verify Android permissions
        working-directory: flutter
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q "android.permission.INTERNET" "$MANIFEST"
          grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"
          grep -q "android.permission.FOREGROUND_SERVICE" "$MANIFEST"
          grep -q "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" "$MANIFEST"

          echo "Android permissions OK."

      - name: Flutter clean
        working-directory: flutter
        run: |
          set -e
          flutter clean

      - name: Flutter pub get
        working-directory: flutter
        run: |
          set -e
          flutter pub get

      - name: Check Gradle repositories
      

      - name: Resolve Android dependencies
        working-directory: flutter
        run: |
          set -e

          cd android

          ./gradlew \
            :app:dependencies \
            --configuration releaseRuntimeClasspath \
            --refresh-dependencies \
            --no-daemon \
            --stacktrace

      - name: Build APK
        working-directory: flutter
        run: |
          set -e

          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --verbose

      - name: Verify APK
        working-directory: flutter
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK WAS NOT CREATED"
            find build -type f -name "*.apk" -print
            exit 1
          fi

          echo "========================================"
          echo "AIMRELAX LIVE APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
