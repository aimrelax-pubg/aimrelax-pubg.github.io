name: Build AIMRELAX LIVE Sender

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -d "$ANDROID_HOME" ]; then
            echo "Android SDK found"
            ls -la "$ANDROID_HOME"
          fi

          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "Android API 35 found"
          else
            echo "Android API 35 is not preinstalled"
          fi

          if [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Build Tools 35.0.0 found"
          else
            echo "Build Tools 35.0.0 is not preinstalled"
          fi


      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p live-sender/app/src/main/java/com/aimrelax/livesender
          mkdir -p live-sender/app/src/main/res/values


          cat > live-sender/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AIMRELAX-LIVE-Sender"

          include(":app")
          EOF


          cat > live-sender/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


          cat > live-sender/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


          cat > live-sender/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aimrelax.livesender'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimrelax.livesender'

                  minSdk 23

                  targetSdk 35

                  versionCode 2

                  versionName '2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }

              kotlinOptions {
                  jvmTarget = '21'
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.15.0'

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'androidx.activity:activity-ktx:1.10.1'

              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

              implementation 'io.livekit:livekit-android:2.28.2'

              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
          }
          EOF


          cat > live-sender/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AIMRELAX LIVE Sender</string>
          </resources>
          EOF


          cat > live-sender/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:navigationBarColor">#070707</item>

                  <item name="android:statusBarColor">#070707</item>

                  <item name="android:colorAccent">#ff7a00</item>

              </style>

          </resources>
          EOF


          cat > live-sender/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />


              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">


                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service
                      android:name="io.livekit.android.room.track.screencapture.ScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />


              </application>

          </manifest>
          EOF


          cat > live-sender/app/src/main/java/com/aimrelax/livesender/MainActivity.kt <<'EOF'
          package com.aimrelax.livesender

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.lifecycle.lifecycleScope

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.ScreenCaptureParams

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          import org.json.JSONObject

          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.UUID
          import java.util.concurrent.CountDownLatch


          class MainActivity : ComponentActivity() {

              companion object {

                  private const val SITE_URL =
                      "https://aimrelax-pubg.github.io/"

                  private const val SUPABASE_URL =
                      "https://hvhlrbfjloiahbqmnrly.supabase.co"

                  private const val SUPABASE_ANON_KEY =
                      "sb_publishable_EcZUkLdUCvV3qWDD7jlvhg_OjTYu1jA"

                  private const val LIVE_TOKEN_URL =
                      "$SUPABASE_URL/functions/v1/live-token"

                  private const val LIVE_STREAMS_URL =
                      "$SUPABASE_URL/rest/v1/live_streams"
              }


              private lateinit var webView: WebView

              private lateinit var titleInput: EditText

              private lateinit var startButton: Button

              private lateinit var stopButton: Button

              private lateinit var statusText: TextView


              private var accessToken: String? = null

              private var userId: String? = null

              private var userName =
                  "AIMRELAX User"


              private var room: Room? = null

              private var liveStreamId: String? = null

              private var roomName: String? = null


              private val screenCaptureLauncher =

                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { result ->


                      if (
                          result.resultCode != Activity.RESULT_OK ||
                          result.data == null
                      ) {

                          lifecycleScope.launch {
                              cancelPreparedLive()
                          }

                          return@registerForActivityResult
                      }


                      startScreenShare(
                          result.data!!
                      )
                  }


              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(
                      savedInstanceState
                  )

                  buildUi()

                  setupWebView()
              }


              private fun buildUi() {

                  val root =
                      LinearLayout(this)


                  root.orientation =
                      LinearLayout.VERTICAL


                  root.setPadding(
                      28,
                      24,
                      28,
                      24
                  )


                  root.setBackgroundColor(
                      android.graphics.Color.rgb(
                          7,
                          7,
                          7
                      )
                  )


                  val title =
                      TextView(this)


                  title.text =
                      "AIMRELAX LIVE"


                  title.textSize =
                      26f


                  title.setTextColor(
                      android.graphics.Color.rgb(
                          255,
                          122,
                          0
                      )
                  )


                  title.setPadding(
                      0,
                      0,
                      0,
                      18
                  )


                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )


                  titleInput =
                      EditText(this)


                  titleInput.hint =
                      "LIVE-ի վերնագիր"


                  titleInput.setTextColor(
                      android.graphics.Color.WHITE
                  )


                  titleInput.setHintTextColor(
                      android.graphics.Color.GRAY
                  )


                  root.addView(
                      titleInput,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )


                  startButton =
                      Button(this)


                  startButton.text =
                      "ՍԿՍԵԼ LIVE"


                  startButton.setOnClickListener {
                      prepareLive()
                  }


                  root.addView(
                      startButton,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )


                  stopButton =
                      Button(this)


                  stopButton.text =
                      "ԴԱԴԱՐԵՑՆԵԼ LIVE"


                  stopButton.isEnabled =
                      false


                  stopButton.setOnClickListener {
                      stopLive()
                  }


                  root.addView(
                      stopButton,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )


                  statusText =
                      TextView(this)


                  statusText.text =
                      "Մուտք գործիր AIMRELAX կայք"


                  statusText.textSize =
                      15f


                  statusText.setTextColor(
                      android.graphics.Color.LTGRAY
                  )


                  statusText.setPadding(
                      0,
                      20,
                      0,
                      20
                  )


                  root.addView(
                      statusText,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )


                  webView =
                      WebView(this)


                  root.addView(
                      webView,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )


                  setContentView(root)
              }


              private fun setupWebView() {

                  webView.settings.javaScriptEnabled =
                      true

                  webView.settings.domStorageEnabled =
                      true

                  webView.settings.databaseEnabled =
                      true

                  webView.settings.mediaPlaybackRequiresUserGesture =
                      false


                  CookieManager
                      .getInstance()
                      .setAcceptCookie(true)


                  CookieManager
                      .getInstance()
                      .setAcceptThirdPartyCookies(
                          webView,
                          true
                      )


                  webView.webChromeClient =
                      WebChromeClient()


                  webView.webViewClient =
                      object : WebViewClient() {

                          override fun onPageFinished(
                              view: WebView?,
                              url: String?
                          ) {

                              super.onPageFinished(
                                  view,
                                  url
                              )

                              statusText.text =
                                  "AIMRELAX-ը բեռնված է։ Մուտք գործիր և սկսիր LIVE-ը։"
                          }
                      }


                  webView.loadUrl(
                      SITE_URL
                  )
              }


              private fun prepareLive() {

                  if (
                      titleInput.text
                          .toString()
                          .trim()
                          .isEmpty()
                  ) {

                      titleInput.setText(
                          "AIMRELAX PUBG LIVE"
                      )
                  }


                  statusText.text =
                      "Ստուգում ենք հաշիվը..."


                  lifecycleScope.launch {

                      try {

                          val token =
                              readSupabaseAccessToken()


                          if (
                              token.isNullOrBlank()
                          ) {

                              statusText.text =
                                  "Մուտք գործիր AIMRELAX կայք, հետո նորից փորձիր։"


                              Toast.makeText(
                                  this@MainActivity,
                                  "Մուտք գործելը պարտադիր է",
                                  Toast.LENGTH_LONG
                              ).show()


                              return@launch
                          }


                          accessToken =
                              token


                          loadCurrentUser(
                              token
                          )


                          val uid =
                              userId
                                  ?: throw Exception(
                                      "Օգտատերը չի գտնվել"
                                  )


                          roomName =
                              "aimrelax-live-$uid"


                          statusText.text =
                              "LIVE սենյակը պատրաստվում է..."


                          val tokenJson =
                              requestLiveToken(
                                  token,
                                  roomName!!,
                                  userName,
                                  "host"
                              )


                          val liveToken =
                              tokenJson.optString(
                                  "participant_token"
                              )


                          val serverUrl =
                              tokenJson.optString(
                                  "server_url"
                              )


                          if (
                              liveToken.isBlank() ||
                              serverUrl.isBlank()
                          ) {

                              throw Exception(
                                  tokenJson.optString(
                                      "error",
                                      "LiveKit token-ը չի ստացվել"
                                  )
                              )
                          }


                          createLiveStreamRow()


                          statusText.text =
                              "Թույլատրիր էկրանի փոխանցումը..."


                          val manager =
                              getSystemService(
                                  Context.MEDIA_PROJECTION_SERVICE
                              ) as MediaProjectionManager


                          screenCaptureLauncher.launch(
                              manager.createScreenCaptureIntent()
                          )


                      } catch (e: Exception) {

                          statusText.text =
                              "Սխալ․ ${
                                  e.message
                                      ?: "անհայտ սխալ"
                              }"


                          Toast.makeText(
                              this@MainActivity,
                              e.message
                                  ?: "Սխալ",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }
              }


              private fun startScreenShare(
                  permissionData: Intent
              ) {

                  val token =
                      accessToken


                  val currentRoomName =
                      roomName


                  if (
                      token.isNullOrBlank() ||
                      currentRoomName.isNullOrBlank()
                  ) {

                      statusText.text =
                          "LIVE session-ը կորել է։ Նորից փորձիր։"

                      return
                  }


                  lifecycleScope.launch {

                      try {

                          val tokenJson =
                              requestLiveToken(
                                  token,
                                  currentRoomName,
                                  userName,
                                  "host"
                              )


                          val liveToken =
                              tokenJson.optString(
                                  "participant_token"
                              )


                          val serverUrl =
                              tokenJson.optString(
                                  "server_url"
                              )


                          if (
                              liveToken.isBlank() ||
                              serverUrl.isBlank()
                          ) {

                              throw Exception(
                                  tokenJson.optString(
                                      "error",
                                      "LiveKit token-ը չի ստացվել"
                                  )
                              )
                          }


                          statusText.text =
                              "Միանում ենք LiveKit-ին..."


                          room =
                              LiveKit.create(
                                  applicationContext
                              )


                          room!!.connect(
                              serverUrl,
                              liveToken
                          )


                          statusText.text =
                              "LIVE-ը սկսվում է..."


                          room!!
                              .localParticipant
                              .setScreenShareEnabled(
                                  true,
                                  ScreenCaptureParams(
                                      mediaProjectionPermissionResultData =
                                          permissionData
                                  )
                              )


                          startButton.isEnabled =
                              false


                          stopButton.isEnabled =
                              true


                          statusText.text =
                              "🔴 LIVE — PUBG էկրանը փոխանցվում է"


                      } catch (e: Exception) {

                          statusText.text =
                              "LIVE սխալ․ ${
                                  e.message
                                      ?: "անհայտ սխալ"
                              }"


                          cancelPreparedLive()
                      }
                  }
              }


              private fun stopLive() {

                  lifecycleScope.launch {

                      try {

                          room
                              ?.localParticipant
                              ?.setScreenShareEnabled(
                                  false
                              )

                      } catch (_: Exception) {
                      }


                      try {

                          room?.disconnect()

                      } catch (_: Exception) {
                      }


                      room =
                          null


                      markLiveEnded()


                      startButton.isEnabled =
                          true


                      stopButton.isEnabled =
                          false


                      statusText.text =
                          "LIVE-ը դադարեցված է"
                  }
              }


              private suspend fun cancelPreparedLive() {

                  try {

                      markLiveEnded()

                  } catch (_: Exception) {
                  }


                  startButton.isEnabled =
                      true


                  stopButton.isEnabled =
                      false


                  statusText.text =
                      "LIVE-ը չեղարկվեց"
              }


              private fun readSupabaseAccessToken():
                      String? {

                  var result:
                      String? = null


                  val lock =
                      CountDownLatch(1)


                  runOnUiThread {

                      webView.evaluateJavascript(
                          """
                          (function() {
                              try {
                                  for (
                                      let i = 0;
                                      i < localStorage.length;
                                      i++
                                  ) {
                                      const key =
                                          localStorage.key(i);

                                      if (!key) continue;

                                      if (
                                          key.includes("auth-token") ||
                                          key.includes("supabase.auth")
                                      ) {
                                          const raw =
                                              localStorage.getItem(key);

                                          if (!raw) continue;

                                          try {
                                              const obj =
                                                  JSON.parse(raw);

                                              if (
                                                  obj.access_token
                                              ) {
                                                  return obj.access_token;
                                              }

                                              if (
                                                  obj.currentSession &&
                                                  obj.currentSession.access_token
                                              ) {
                                                  return obj.currentSession.access_token;
                                              }

                                              if (
                                                  obj.session &&
                                                  obj.session.access_token
                                              ) {
                                                  return obj.session.access_token;
                                              }
                                          } catch(e) {}
                                      }
                                  }

                                  return "";
                              } catch(e) {
                                  return "";
                              }
                          })();
                          """.trimIndent()
                      ) { value ->

                          result =
                              value
                                  ?.trim()
                                  ?.removeSurrounding("\"")
                                  ?.replace(
                                      "\\\"",
                                      "\""
                                  )

                          lock.countDown()
                      }
                  }


                  lock.await()


                  return result
              }


              private suspend fun loadCurrentUser(
                  token: String
              ) {

                  val response =
                      httpJson(
                          "GET",
                          "$SUPABASE_URL/auth/v1/user",
                          token
                      )


                  val obj =
                      JSONObject(response)


                  userId =
                      obj.optString("id")
                          .ifBlank {
                              null
                          }


                  val metadata =
                      obj.optJSONObject(
                          "user_metadata"
                      )


                  userName =
                      metadata
                          ?.optString("nickname")
                          ?.takeIf {
                              it.isNotBlank()
                          }
                          ?: metadata
                              ?.optString("name")
                              ?.takeIf {
                                  it.isNotBlank()
                              }
                          ?: obj
                              .optString("email")
                              .takeIf {
                                  it.isNotBlank()
                              }
                          ?: "AIMRELAX User"
              }


              private suspend fun requestLiveToken(
                  accessToken: String,
                  roomName: String,
                  participantName: String,
                  role: String
              ): JSONObject {

                  val body =
                      JSONObject().apply {

                          put(
                              "room_name",
                              roomName
                          )

                          put(
                              "participant_name",
                              participantName
                          )

                          put(
                              "role",
                              role
                          )
                      }


                  val response =
                      httpJson(
                          "POST",
                          LIVE_TOKEN_URL,
                          accessToken,
                          body.toString()
                      )


                  return JSONObject(response)
              }


              private suspend fun createLiveStreamRow() {

                  val uid =
                      userId
                          ?: throw Exception(
                              "user_id չկա"
                          )


                  val title =
                      titleInput.text
                          .toString()
                          .trim()
                          .ifBlank {
                              "AIMRELAX PUBG LIVE"
                          }


                  val streamId =
                      UUID.randomUUID()
                          .toString()


                  val body =
                      JSONObject().apply {

                          put(
                              "id",
                              streamId
                          )

                          put(
                              "streamer_id",
                              uid
                          )

                          put(
                              "streamer_name",
                              userName
                          )

                          put(
                              "title",
                              title
                          )

                          put(
                              "status",
                              "live"
                          )
                      }


                  httpJson(
                      "POST",
                      LIVE_STREAMS_URL,
                      accessToken
                          ?: throw Exception(
                              "access token չկա"
                          ),
                      body.toString(),
                      mapOf(
                          "Prefer" to
                              "return=minimal"
                      )
                  )


                  liveStreamId =
                      streamId
              }


              private suspend fun markLiveEnded() {

                  val id =
                      liveStreamId
                          ?: return


                  val token =
                      accessToken
                          ?: return


                  try {

                      httpJson(
                          "PATCH",
                          "$LIVE_STREAMS_URL?id=eq.$id",
                          token,
                          JSONObject()
                              .put(
                                  "status",
                                  "ended"
                              )
                              .toString()
                      )

                  } catch (_: Exception) {
                  }


                  liveStreamId =
                      null
              }


              private suspend fun httpJson(
                  method: String,
                  url: String,
                  accessToken: String,
                  body: String? = null,
                  extraHeaders:
                      Map<String, String> =
                          emptyMap()
              ): String {

                  return withContext(
                      Dispatchers.IO
                  ) {

                      val connection =
                          URL(url)
                              .openConnection()
                              as HttpURLConnection


                      try {

                          connection.requestMethod =
                              method


                          connection.connectTimeout =
                              20000


                          connection.readTimeout =
                              30000


                          connection.useCaches =
                              false


                          connection.setRequestProperty(
                              "Authorization",
                              "Bearer $accessToken"
                          )


                          connection.setRequestProperty(
                              "apikey",
                              SUPABASE_ANON_KEY
                          )


                          connection.setRequestProperty(
                              "Content-Type",
                              "application/json"
                          )


                          for (
                              (key, value)
                              in extraHeaders
                          ) {

                              connection.setRequestProperty(
                                  key,
                                  value
                              )
                          }


                          if (body != null) {

                              connection.doOutput =
                                  true


                              connection.outputStream
                                  .use { output ->

                                      output.write(
                                          body.toByteArray(
                                              Charsets.UTF_8
                                          )
                                      )
                                  }
                          }


                          val code =
                              connection.responseCode


                          val stream =
                              if (
                                  code in 200..299
                              ) {

                                  connection.inputStream

                              } else {

                                  connection.errorStream
                              }


                          val response =
                              stream
                                  ?.bufferedReader()
                                  ?.use {
                                      it.readText()
                                  }
                                  ?: ""


                          if (
                              code !in 200..299
                          ) {

                              throw Exception(
                                  "HTTP $code: $response"
                              )
                          }


                          response

                      } finally {

                          connection.disconnect()
                      }
                  }
              }


              override fun onDestroy() {

                  super.onDestroy()
              }
          }
          EOF


      - name: Generate Gradle wrapper
        working-directory: live-sender
        run: |
          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin


      - name: Build Release APK
        working-directory: live-sender
        run: |
          chmod +x gradlew

          ./gradlew clean assembleRelease --stacktrace


      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            live-sender/app/build/outputs/apk/release/app-release.apk \
            output/AIMRELAX-LIVE-Sender.apk


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-Sender
          path: output/AIMRELAX-LIVE-Sender.apk
          if-no-files-found: error
