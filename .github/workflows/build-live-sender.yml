    private fun setupWebView() {

        webView.settings.javaScriptEnabled =
            true

        webView.settings.domStorageEnabled =
            true

        webView.settings.databaseEnabled =
            true

        webView.webViewClient =
            WebViewClient()

        webView.loadUrl(
            WEBSITE_URL
        )
    }


    private fun startLive() {

        startButton.isEnabled =
            false

        setStatus(
            "Մուտքի ստուգում..."
        )


        lifecycleScope.launch {

            try {

                val token =
                    getAccessToken()


                if (
                    token.isNullOrBlank()
                ) {

                    throw Exception(
                        "Մուտք գործիր AIMRELAX կայքում"
                    )
                }


                accessToken =
                    token


                val user =
                    getUser(
                        token
                    )


                userId =
                    user.optString(
                        "id"
                    )


                val metadata =
                    user.optJSONObject(
                        "user_metadata"
                    )


                userName =
                    metadata
                        ?.optString(
                            "username"
                        )
                        ?.takeIf {
                            it.isNotBlank()
                        }
                        ?: metadata
                            ?.optString(
                                "name"
                            )
                            ?.takeIf {
                                it.isNotBlank()
                            }
                        ?: user.optString(
                            "email",
                            "AIMRELAX User"
                        )


                val roomName =
                    "aimrelax-live-$userId"


                setStatus(
                    "LiveKit token-ի ստացում..."
                )


                val tokenBody =
                    JSONObject()

                tokenBody.put(
                    "room_name",
                    roomName
                )

                tokenBody.put(
                    "participant_name",
                    userName
                )

                tokenBody.put(
                    "role",
                    "host"
                )


                val tokenResponse =
                    http(
                        "$SUPABASE_URL/functions/v1/live-token",
                        "POST",
                        token,
                        tokenBody.toString()
                    )


                if (
                    !tokenResponse.first
                ) {

                    throw Exception(
                        tokenResponse.second
                    )
                }


                val tokenJson =
                    JSONObject(
                        tokenResponse.second
                    )


                serverUrl =
                    tokenJson.optString(
                        "server_url"
                    ).ifBlank {
                        tokenJson.optString(
                            "serverUrl"
                        )
                    }


                participantToken =
                    tokenJson.optString(
                        "participant_token"
                    ).ifBlank {
                        tokenJson.optString(
                            "token"
                        )
                    }


                if (
                    serverUrl.isNullOrBlank()
                ) {

                    throw Exception(
                        "server_url չկա"
                    )
                }


                if (
                    participantToken.isNullOrBlank()
                ) {

                    throw Exception(
                        "participant_token չկա"
                    )
                }


                setStatus(
                    "LIVE-ի գրանցում..."
                )


                streamId =
                    UUID.randomUUID()
                        .toString()


                val stream =
                    JSONObject()

                stream.put(
                    "id",
                    streamId
                )

                stream.put(
                    "streamer_id",
                    userId
                )

                stream.put(
                    "streamer_name",
                    userName
                )

                stream.put(
                    "title",
                    titleInput.text
                        .toString()
                        .trim()
                        .ifBlank {
                            "AIMRELAX LIVE"
                        }
                )

                stream.put(
                    "status",
                    "live"
                )


                val insert =
                    http(
                        "$SUPABASE_URL/rest/v1/live_streams",
                        "POST",
                        token,
                        stream.toString()
                    )


                if (
                    !insert.first
                ) {

                    throw Exception(
                        "LIVE ցուցակում գրանցումը չստացվեց: ${insert.second}"
                    )
                }


                setStatus(
                    "Էկրանի թույլտվության սպասում..."
                )


                val manager =
                    getSystemService(
                        Context.MEDIA_PROJECTION_SERVICE
                    ) as MediaProjectionManager


                val captureIntent =
                    manager.createScreenCaptureIntent()


                startActivityForResult(
                    captureIntent,
                    SCREEN_REQUEST
                )


            } catch (e: Exception) {

                startButton.isEnabled =
                    true

                setStatus(
                    "Սխալ: ${e.message}"
                )
            }
        }
    }


    override fun onActivityResult(
        requestCode: Int,
        resultCode: Int,
        data: Intent?
    ) {

        super.onActivityResult(
            requestCode,
            resultCode,
            data
        )


        if (
            requestCode !=
            SCREEN_REQUEST
        ) {
            return
        }


        if (
            resultCode !=
            Activity.RESULT_OK ||
            data == null
        ) {

            startButton.isEnabled =
                true

            setStatus(
                "Էկրանի թույլտվությունը չտրվեց"
            )

            markEnded()

            return
        }


        publishScreen(
            data
        )
    }


    private fun publishScreen(
        permissionData: Intent
    ) {

        val url =
            serverUrl

        val token =
            participantToken


        if (
            url.isNullOrBlank() ||
            token.isNullOrBlank()
        ) {

            setStatus(
                "LiveKit տվյալները բացակայում են"
            )

            startButton.isEnabled =
                true

            markEnded()

            return
        }


        lifecycleScope.launch {

            try {

                setStatus(
                    "LiveKit-ին միացում..."
                )


                val liveRoom =
                    LiveKit.create(
                        applicationContext
                    )


                room =
                    liveRoom


                liveRoom.connect(
                    url,
                    token
                )


                setStatus(
                    "PUBG էկրանի հրապարակում..."
                )


                liveRoom.localParticipant
                    .setScreenShareEnabled(
                        true,
                        ScreenCaptureParams(
                            mediaProjectionPermissionResultData =
                                permissionData
                        )
                    )


                startButton.isEnabled =
                    false

                stopButton.isEnabled =
                    true


                setStatus(
                    "🔴 LIVE Է"
                )


            } catch (e: Exception) {

                room =
                    null

                startButton.isEnabled =
                    true

                stopButton.isEnabled =
                    false

                markEnded()

                setStatus(
                    "LiveKit սխալ: ${e.message}"
                )
            }
        }
    }


    private fun stopLive() {

        lifecycleScope.launch {

            try {

                room
                    ?.localParticipant
                    ?.setScreenShareEnabled(
                        false
                    )

            } catch (_: Exception) {
            }


            try {

                room?.disconnect()

            } catch (_: Exception) {
            }


            room =
                null


            markEnded()


            startButton.isEnabled =
                true

            stopButton.isEnabled =
                false


            setStatus(
                "LIVE-ը դադարեցվեց"
            )
        }
    }


    private fun markEnded() {

        val token =
            accessToken

        val id =
            streamId


        if (
            token.isNullOrBlank() ||
            id.isNullOrBlank()
        ) {
            return
        }


        lifecycleScope.launch(
            Dispatchers.IO
        ) {

            try {

                val body =
                    JSONObject()

                body.put(
                    "status",
                    "ended"
                )


                http(
                    "$SUPABASE_URL/rest/v1/live_streams?id=eq.$id",
                    "PATCH",
                    token,
                    body.toString()
                )

            } catch (_: Exception) {
            }
        }


        streamId =
            null
    }


    private suspend fun getAccessToken():
        String? {

        return withContext(
            Dispatchers.Main
        ) {

            suspendCancellableCoroutine { continuation ->

                webView.evaluateJavascript(
                    """
                    (function(){

                        try {

                            const keys =
                                Object.keys(localStorage);

                            for (
                                const key of keys
                            ) {

                                if (
                                    key.includes("auth-token")
                                ) {

                                    const raw =
                                        localStorage.getItem(key);

                                    if (!raw) {
                                        continue;
                                    }

                                    const data =
                                        JSON.parse(raw);

                                    const session =
                                        data.currentSession ||
                                        data.session ||
                                        data;

                                    if (
                                        session &&
                                        session.access_token
                                    ) {

                                        return JSON.stringify(
                                            session.access_token
                                        );
                                    }
                                }
                            }

                        } catch(e) {}

                        return null;

                    })();
                    """.trimIndent()
                ) { value ->

                    if (
                        value == null ||
                        value == "null" ||
                        value == "\"\""
                    ) {

                        continuation.resume(
                            null
                        )

                    } else {

                        val result =
                            value
                                .removePrefix("\"")
                                .removeSuffix("\"")
                                .replace(
                                    "\\\"",
                                    "\""
                                )


                        continuation.resume(
                            result
                        )
                    }
                }
            }
        }
    }


    private suspend fun getUser(
        token: String
    ): JSONObject {

        val result =
            withContext(
                Dispatchers.IO
            ) {

                http(
                    "$SUPABASE_URL/auth/v1/user",
                    "GET",
                    token,
                    null
                )
            }


        if (
            !result.first
        ) {

            throw Exception(
                "Supabase session-ը անվավեր է"
            )
        }


        return JSONObject(
            result.second
        )
    }


    private fun http(
        url: String,
        method: String,
        bearer: String?,
        body: String?
    ): Pair<Boolean, String> {

        val connection =
            URL(url)
                .openConnection()
                as HttpURLConnection


        return try {

            connection.requestMethod =
                method

            connection.connectTimeout =
                20000

            connection.readTimeout =
                20000

            connection.useCaches =
                false


            connection.setRequestProperty(
                "apikey",
                SUPABASE_KEY
            )

            connection.setRequestProperty(
                "Accept",
                "application/json"
            )

            connection.setRequestProperty(
                "Content-Type",
                "application/json"
            )


            if (
                !bearer.isNullOrBlank()
            ) {

                connection.setRequestProperty(
                    "Authorization",
                    "Bearer $bearer"
                )
            }


            if (
                method == "POST" ||
                method == "PATCH"
            ) {

                connection.doOutput =
                    true

                connection.outputStream
                    .use {
                        it.write(
                            (body ?: "")
                                .toByteArray(
                                    Charsets.UTF_8
                                )
                        )
                    }
            }


            val code =
                connection.responseCode


            val input =
                if (
                    code in 200..299
                ) {

                    connection.inputStream

                } else {

                    connection.errorStream
                }


            val response =
                input
                    ?.bufferedReader()
                    ?.use {
                        it.readText()
                    }
                    ?: ""


            Pair(
                code in 200..299,
                response
            )

        } finally {

            connection.disconnect()
        }
    }


    private fun setStatus(
        message: String
    ) {

        runOnUiThread {

            statusText.text =
                message
        }
    }


    override fun onDestroy() {

        /*
         * Do not disconnect LiveKit here.
         */

        super.onDestroy()
    }
}
