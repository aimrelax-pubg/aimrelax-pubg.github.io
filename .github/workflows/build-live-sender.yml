name: Build AIMRELAX LIVE Sender

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Java 21
      # =========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # =========================================================
      # 3. Gradle
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # =========================================================
      # 4. Android SDK check
      # =========================================================

      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -d "$ANDROID_HOME" ]; then
            echo "Android SDK found"
            ls -la "$ANDROID_HOME"
          else
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "Android API 35 found"
          else
            echo "ERROR: Android API 35 is not installed"
            exit 1
          fi

          if [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Build Tools 35.0.0 found"
          else
            echo "ERROR: Build Tools 35.0.0 not installed"
            exit 1
          fi


      # =========================================================
      # 5. Create Android project
      # =========================================================

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p live-sender/app/src/main/java/com/aimrelax/livesender
          mkdir -p live-sender/app/src/main/res/values


          # =====================================================
          # settings.gradle
          # =====================================================

          cat > live-sender/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()

                  // Required by LiveKit Android dependencies
                  maven { url = uri("https://jitpack.io") }
              }
          }

          rootProject.name = "AIMRELAX-LIVE-Sender"

          include(":app")
          EOF


          # =====================================================
          # Root build.gradle
          # =====================================================

          cat > live-sender/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


          # =====================================================
          # gradle.properties
          # =====================================================

          cat > live-sender/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


          # =====================================================
          # app/build.gradle
          # =====================================================

          cat > live-sender/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aimrelax.livesender'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimrelax.livesender'

                  minSdk 23
                  targetSdk 35

                  versionCode 2
                  versionName '2.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }

              kotlinOptions {
                  jvmTarget = '21'
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.15.0'

              implementation 'androidx.appcompat:appcompat:1.7.0'

              implementation 'androidx.activity:activity-ktx:1.10.1'

              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

              implementation 'io.livekit:livekit-android:2.28.2'

              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
          }
          EOF


          # =====================================================
          # strings.xml
          # =====================================================

          cat > live-sender/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AIMRELAX LIVE Sender</string>
          </resources>
          EOF


          # =====================================================
          # styles.xml
          # =====================================================

          cat > live-sender/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:navigationBarColor">
                      #070707
                  </item>

                  <item name="android:statusBarColor">
                      #070707
                  </item>

                  <item name="android:colorAccent">
                      #ff7a00
                  </item>

              </style>

          </resources>
          EOF


          # =====================================================
          # AndroidManifest.xml
          # =====================================================

          cat > live-sender/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />


              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">


                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>


                  <service
                      android:name="io.livekit.android.room.track.screencapture.ScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />

              </application>

          </manifest>
          EOF


          # =====================================================
          # MainActivity.kt
          # =====================================================

          cat > live-sender/app/src/main/java/com/aimrelax/livesender/MainActivity.kt <<'EOF'
          package com.aimrelax.livesender

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.graphics.Color

          import androidx.appcompat.app.AppCompatActivity

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.ScreenCaptureParams

          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          import org.json.JSONObject

          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.UUID


          class MainActivity : AppCompatActivity() {

              companion object {

                  private const val TAG = "AIMRELAX_LIVE"

                  private const val SUPABASE_URL =
                      "https://hvhlrbfjloiahbqmnrly.supabase.co"

                  private const val SUPABASE_ANON_KEY =
                      "sb_publishable_EcZUkLdUCvV3qWDD7jlvhg_OjTYu1jA"

                  private const val LIVE_TOKEN_URL =
                      "$SUPABASE_URL/functions/v1/live-token"

                  private const val LIVE_STREAMS_URL =
                      "$SUPABASE_URL/rest/v1/live_streams"

                  private const val WEBSITE_URL =
                      "https://aimrelax-pubg.github.io/"

                  private const val SCREEN_CAPTURE_REQUEST =
                      9001
              }


              private lateinit var titleInput: EditText
              private lateinit var startButton: Button
              private lateinit var stopButton: Button
              private lateinit var statusText: TextView
              private lateinit var webView: WebView

              private var room: Room? = null

              private var accessToken: String? = null

              private var currentUserId: String? = null

              private var currentUserName: String = "AIMRELAX User"

              private var currentStreamId: String? = null

              private var currentRoomName: String? = null


              override fun onCreate(savedInstanceState: Bundle?) {

                  super.onCreate(savedInstanceState)

                  createInterface()

                  setupWebView()

                  startButton.setOnClickListener {
                      startLive()
                  }

                  stopButton.setOnClickListener {
                      stopLive()
                  }
              }


              private fun createInterface() {

                  val root =
                      LinearLayout(this)

                  root.orientation =
                      LinearLayout.VERTICAL

                  root.setPadding(
                      24,
                      24,
                      24,
                      24
                  )

                  root.setBackgroundColor(
                      Color.rgb(7, 7, 7)
                  )


                  val title =
                      TextView(this)

                  title.text =
                      "AIMRELAX LIVE Sender"

                  title.textSize =
                      25f

                  title.setTextColor(
                      Color.rgb(255, 122, 0)
                  )

                  title.gravity =
                      Gravity.CENTER

                  root.addView(
                      title,
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )
                  )


                  val subtitle =
                      TextView(this)

                  subtitle.text =
                      "PUBG MOBILE LIVE STREAM"

                  subtitle.textSize =
                      14f

                  subtitle.setTextColor(
                      Color.WHITE
                  )

                  subtitle.gravity =
                      Gravity.CENTER

                  val subtitleParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  subtitleParams.topMargin =
                      8

                  root.addView(
                      subtitle,
                      subtitleParams
                  )


                  titleInput =
                      EditText(this)

                  titleInput.hint =
                      "LIVE-ի վերնագիրը"

                  titleInput.setHintTextColor(
                      Color.GRAY
                  )

                  titleInput.setTextColor(
                      Color.WHITE
                  )

                  titleInput.setSingleLine(
                      true
                  )

                  val inputParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  inputParams.topMargin =
                      30

                  root.addView(
                      titleInput,
                      inputParams
                  )


                  startButton =
                      Button(this)

                  startButton.text =
                      "ՍԿՍԵԼ LIVE"

                  val startParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  startParams.topMargin =
                      18

                  root.addView(
                      startButton,
                      startParams
                  )


                  stopButton =
                      Button(this)

                  stopButton.text =
                      "ԴԱԴԱՐԵՑՆԵԼ LIVE"

                  stopButton.isEnabled =
                      false

                  val stopParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  stopParams.topMargin =
                      10

                  root.addView(
                      stopButton,
                      stopParams
                  )


                  statusText =
                      TextView(this)

                  statusText.text =
                      "Պատրաստ է"

                  statusText.textSize =
                      15f

                  statusText.setTextColor(
                      Color.WHITE
                  )

                  statusText.gravity =
                      Gravity.CENTER

                  val statusParams =
                      LinearLayout.LayoutParams(
                          -1,
                          -2
                      )

                  statusParams.topMargin =
                      18

                  root.addView(
                      statusText,
                      statusParams
                  )


                  webView =
                      WebView(this)

                  webView.visibility =
                      View.GONE

                  root.addView(
                      webView,
                      LinearLayout.LayoutParams(
                          1,
                          1
                      )
                  )


                  setContentView(root)
              }


              private fun setupWebView() {

                  webView.settings.javaScriptEnabled =
                      true

                  webView.settings.domStorageEnabled =
                      true

                  webView.settings.databaseEnabled =
                      true

                  webView.webViewClient =
                      WebViewClient()

                  webView.loadUrl(
                      WEBSITE_URL
                  )
              }


              private fun startLive() {

                  if (room != null) {

                      setStatus(
                          "LIVE-ն արդեն աշխատում է"
                      )

                      return
                  }


                  val title =
                      titleInput.text
                          .toString()
                          .trim()
                          .ifEmpty {
                              "AIMRELAX LIVE"
                          }


                  startButton.isEnabled =
                      false

                  setStatus(
                      "Մուտքի տվյալների ստուգում..."
                  )


                  CoroutineScope(
                      Dispatchers.Main
                  ).launch {

                      try {

                          val token =
                              getSupabaseAccessToken()

                          if (
                              token.isNullOrBlank()
                          ) {

                              throw Exception(
                                  "Կայքի մուտքը չի գտնվել"
                              )
                          }


                          accessToken =
                              token


                          val user =
                              getSupabaseUser(
                                  token
                              )


                          currentUserId =
                              user.getString(
                                  "id"
                              )


                          val metadata =
                              user.optJSONObject(
                                  "user_metadata"
                              )


                          currentUserName =
                              metadata
                                  ?.optString(
                                      "username"
                                  )
                                  ?.takeIf {
                                      it.isNotBlank()
                                  }
                                  ?: metadata
                                      ?.optString(
                                          "name"
                                      )
                                      ?.takeIf {
                                          it.isNotBlank()
                                      }
                                      ?: user.optString(
                                          "email",
                                          "AIMRELAX User"
                                      )


                          currentRoomName =
                              "aimrelax-live-$currentUserId"


                          setStatus(
                              "LiveKit token-ի ստացում..."
                          )


                          val tokenBody =
                              JSONObject()

                          tokenBody.put(
                              "room_name",
                              currentRoomName
                          )

                          tokenBody.put(
                              "participant_name",
                              currentUserName
                          )

                          tokenBody.put(
                              "role",
                              "host"
                          )


                          val tokenResponse =
                              httpJson(
                                  LIVE_TOKEN_URL,
                                  "POST",
                                  token,
                                  tokenBody.toString()
                              )


                          if (
                              !tokenResponse.success
                          ) {

                              throw Exception(
                                  tokenResponse.body
                              )
                          }


                          val tokenJson =
                              JSONObject(
                                  tokenResponse.body
                              )


                          val serverUrl =
                              tokenJson.optString(
                                  "server_url"
                              ).ifBlank {
                                  tokenJson.optString(
                                      "serverUrl"
                                  )
                              }


                          val participantToken =
                              tokenJson.optString(
                                  "participant_token"
                              ).ifBlank {
                                  tokenJson.optString(
                                      "token"
                                  )
                              }


                          if (
                              serverUrl.isBlank()
                          ) {

                              throw Exception(
                                  "LiveKit server_url չկա"
                              )
                          }


                          if (
                              participantToken.isBlank()
                          ) {

                              throw Exception(
                                  "LiveKit participant_token չկա"
                              )
                          }


                          setStatus(
                              "LIVE-ի գրանցում..."
                          )


                          val streamId =
                              UUID.randomUUID()
                                  .toString()


                          currentStreamId =
                              streamId


                          val streamBody =
                              JSONObject()

                          streamBody.put(
                              "id",
                              streamId
                          )

                          streamBody.put(
                              "streamer_id",
                              currentUserId
                          )

                          streamBody.put(
                              "streamer_name",
                              currentUserName
                          )

                          streamBody.put(
                              "title",
                              title
                          )

                          streamBody.put(
                              "status",
                              "live"
                          )


                          val insertResponse =
                              httpJson(
                                  LIVE_STREAMS_URL,
                                  "POST",
                                  token,
                                  streamBody.toString()
                              )


                          if (
                              !insertResponse.success
                          ) {

                              throw Exception(
                                  "LIVE ցուցակում գրանցումը չստացվեց:\n${insertResponse.body}"
                              )
                          }


                          setStatus(
                              "Էկրանի թույլտվության սպասում..."
                          )


                          val manager =
                              getSystemService(
                                  Context.MEDIA_PROJECTION_SERVICE
                              ) as MediaProjectionManager


                          val intent =
                              manager.createScreenCaptureIntent()


                          startActivityForResult(
                              intent,
                              SCREEN_CAPTURE_REQUEST
                          )


                          pendingServerUrl =
                              serverUrl

                          pendingParticipantToken =
                              participantToken


                      } catch (e: Exception) {

                          startButton.isEnabled =
                              true

                          currentStreamId =
                              null

                          currentRoomName =
                              null

                          setStatus(
                              "Սխալ: ${e.message}"
                          )
                      }
                  }
              }


              private var pendingServerUrl:
                  String? = null

              private var pendingParticipantToken:
                  String? = null


              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )


                  if (
                      requestCode !=
                      SCREEN_CAPTURE_REQUEST
                  ) {

                      return
                  }


                  if (
                      resultCode != Activity.RESULT_OK ||
                      data == null
                  ) {

                      startButton.isEnabled =
                          true

                      setStatus(
                          "Էկրանի թույլտվությունը չտրվեց"
                      )

                      cleanupLiveRow()

                      return
                  }


                  val serverUrl =
                      pendingServerUrl

                  val participantToken =
                      pendingParticipantToken


                  if (
                      serverUrl.isNullOrBlank() ||
                      participantToken.isNullOrBlank()
                  ) {

                      startButton.isEnabled =
                          true

                      setStatus(
                          "LiveKit տվյալները կորել են"
                      )

                      cleanupLiveRow()

                      return
                  }


                  connectAndPublish(
                      serverUrl,
                      participantToken,
                      data
                  )
              }


              private fun connectAndPublish(
                  serverUrl: String,
                  participantToken: String,
                  permissionData: Intent
              ) {

                  setStatus(
                      "LiveKit-ին միացում..."
                  )


                  CoroutineScope(
                      Dispatchers.Main
                  ).launch {

                      try {

                          val liveRoom =
                              LiveKit.create(
                                  applicationContext
                              )


                          room =
                              liveRoom


                          liveRoom.connect(
                              serverUrl,
                              participantToken
                          )


                          setStatus(
                              "Էկրանի հրապարակում..."
                          )


                          liveRoom.localParticipant
                              .setScreenShareEnabled(
                                  true,
                                  ScreenCaptureParams(
                                      mediaProjectionPermissionResultData =
                                          permissionData
                                  )
                              )


                          startButton.isEnabled =
                              false

                          stopButton.isEnabled =
                              true

                          setStatus(
                              "🔴 LIVE Է — PUBG-ի էկրանը հեռարձակվում է"
                          )


                      } catch (e: Exception) {

                          room = null

                          startButton.isEnabled =
                              true

                          stopButton.isEnabled =
                              false

                          setStatus(
                              "LiveKit սխալ: ${e.message}"
                          )

                          cleanupLiveRow()
                      }
                  }
              }


              private fun stopLive() {

                  CoroutineScope(
                      Dispatchers.Main
                  ).launch {

                      try {

                          room
                              ?.localParticipant
                              ?.setScreenShareEnabled(
                                  false
                              )

                      } catch (_: Exception) {
                      }


                      try {

                          room?.disconnect()

                      } catch (_: Exception) {
                      }


                      room = null

                      pendingServerUrl =
                          null

                      pendingParticipantToken =
                          null


                      cleanupLiveRow()


                      startButton.isEnabled =
                          true

                      stopButton.isEnabled =
                          false


                      setStatus(
                          "LIVE-ը դադարեցված է"
                      )
                  }
              }


              private fun cleanupLiveRow() {

                  val token =
                      accessToken

                  val streamId =
                      currentStreamId


                  if (
                      token.isNullOrBlank() ||
                      streamId.isNullOrBlank()
                  ) {

                      return
                  }


                  CoroutineScope(
                      Dispatchers.IO
                  ).launch {

                      try {

                          val url =
                              "$LIVE_STREAMS_URL?id=eq.$streamId"


                          val body =
                              JSONObject()

                          body.put(
                              "status",
                              "ended"
                          )


                          httpJson(
                              url,
                              "PATCH",
                              token,
                              body.toString()
                          )

                      } catch (_: Exception) {
                      }
                  }


                  currentStreamId =
                      null

                  currentRoomName =
                      null
              }


              private suspend fun getSupabaseAccessToken():
                  String? {

                  return withContext(
                      Dispatchers.Main
                  ) {

                      val result =
                          kotlinx.coroutines.suspendCancellableCoroutine<String?> { continuation ->

                              webView.evaluateJavascript(
                                  """
                                  (function(){
                                      try {
                                          const keys = Object.keys(localStorage);

                                          for (const key of keys) {

                                              if (
                                                  key.includes('auth-token')
                                              ) {

                                                  const raw =
                                                      localStorage.getItem(key);

                                                  if (!raw) {
                                                      continue;
                                                  }

                                                  const data =
                                                      JSON.parse(raw);

                                                  const session =
                                                      data?.currentSession ||
                                                      data?.session ||
                                                      data;

                                                  const token =
                                                      session?.access_token;

                                                  if (token) {
                                                      return JSON.stringify(token);
                                                  }
                                              }
                                          }

                                          return "null";

                                      } catch(e) {
                                          return "null";
                                      }
                                  })();
                                  """.trimIndent()
                              ) { value ->

                                  try {

                                      val clean =
                                          value
                                              ?.removePrefix("\"")
                                              ?.removeSuffix("\"")
                                              ?.replace(
                                                  "\\\"",
                                                  "\""
                                              )


                                      if (
                                          clean.isNullOrBlank() ||
                                          clean == "null"
                                      ) {

                                          continuation.resume(
                                              null,
                                              null
                                          )

                                      } else {

                                          continuation.resume(
                                              clean,
                                              null
                                          )
                                      }

                                  } catch (_: Exception) {

                                      continuation.resume(
                                          null,
                                          null
                                      )
                                  }
                              }
                          }

                      result
                  }
              }


              private suspend fun getSupabaseUser(
                  token: String
              ): JSONObject {

                  val response =
                      withContext(
                          Dispatchers.IO
                      ) {

                          httpJson(
                              "$SUPABASE_URL/auth/v1/user",
                              "GET",
                              token,
                              null
                          )
                      }


                  if (
                      !response.success
                  ) {

                      throw Exception(
                          "Supabase user error: ${response.body}"
                      )
                  }


                  return JSONObject(
                      response.body
                  )
              }


              private data class HttpResult(
                  val success: Boolean,
                  val code: Int,
                  val body: String
              )


              private fun httpJson(
                  urlString: String,
                  method: String,
                  bearer: String?,
                  body: String?
              ): HttpResult {

                  val connection =
                      URL(urlString)
                          .openConnection()
                          as HttpURLConnection


                  try {

                      connection.requestMethod =
                          method

                      connection.connectTimeout =
                          20000

                      connection.readTimeout =
                          20000

                      connection.useCaches =
                          false

                      connection.setRequestProperty(
                          "apikey",
                          SUPABASE_ANON_KEY
                      )

                      if (
                          !bearer.isNullOrBlank()
                      ) {

                          connection.setRequestProperty(
                              "Authorization",
                              "Bearer $bearer"
                          )
                      }


                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json"
                      )

                      connection.setRequestProperty(
                          "Accept",
                          "application/json"
                      )


                      if (
                          method == "POST" ||
                          method == "PATCH" ||
                          method == "PUT"
                      ) {

                          connection.doOutput =
                              true

                          val bytes =
                              (body ?: "")
                                  .toByteArray(
                                      Charsets.UTF_8
                                  )

                          connection.outputStream.use {
                              it.write(bytes)
                          }
                      }


                      val code =
                          connection.responseCode


                      val stream =
                          if (
                              code in 200..299
                          ) {

                              connection.inputStream

                          } else {

                              connection.errorStream
                          }


                      val responseBody =
                          stream
                              ?.bufferedReader()
                              ?.use {
                                  it.readText()
                              }
                              ?: ""


                      return HttpResult(
                          code in 200..299,
                          code,
                          responseBody
                      )

                  } finally {

                      connection.disconnect()
                  }
              }


              private fun setStatus(
                  text: String
              ) {

                  runOnUiThread {

                      statusText.text =
                          text
                  }
              }


              override fun onDestroy() {

                  /*
                   * Intentionally do not stop LiveKit here.
                   *
                   * This prevents the stream from immediately
                   * stopping when Android temporarily recreates
                   * the Activity.
                   */

                  super.onDestroy()
              }
          }
          EOF


      # =========================================================
      # 6. Generate Gradle wrapper
      # =========================================================

      - name: Generate Gradle wrapper
        working-directory: live-sender
        run: |
          gradle wrapper \
            --gradle-version 8.10.2 \
            --distribution-type bin


      # =========================================================
      # 7. Build APK
      # =========================================================

      - name: Build Release APK
        working-directory: live-sender
        run: |
          chmod +x gradlew

          ./gradlew clean assembleRelease \
            --stacktrace \
            --info


      # =========================================================
      # 8. Prepare APK
      # =========================================================

      - name: Prepare APK
        run: |
          set -e

          mkdir -p output

          cp \
            live-sender/app/build/outputs/apk/release/app-release.apk \
            output/AIMRELAX-LIVE-Sender.apk

          ls -lh output/AIMRELAX-LIVE-Sender.apk


      # =========================================================
      # 9. Upload APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-Sender
          path: output/AIMRELAX-LIVE-Sender.apk
          if-no-files-found: error
