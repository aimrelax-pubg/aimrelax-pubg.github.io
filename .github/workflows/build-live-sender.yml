      - name: Prepare APK
        shell: bash
        run: |

          set -e

          mkdir -p output

          cp \
            live-sender/app/build/outputs/apk/release/app-release.apk \
            output/AIMRELAX-LIVE-Sender.apk

          echo "Final APK:"

          ls -lh output/AIMRELAX-LIVE-Sender.apk


      # =========================================================
      # 10. UPLOAD APK
      # =========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-Sender-APK
          path: output/AIMRELAX-LIVE-Sender.apk
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 11. UPLOAD LOG IF BUILD FAILS
      # =========================================================

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-Build-Log
          path: build.log
          if-no-files-found: warn
          retention-days: 7
