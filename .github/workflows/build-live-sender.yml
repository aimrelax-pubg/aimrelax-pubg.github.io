name: Build AIMRELAX LIVE Sender

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 21
      # =========================================================

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      # =========================================================
      # 3. GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # =========================================================
      # 4. CHECK ANDROID SDK
      # =========================================================

      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "ERROR: Android API 35 not found"
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "ERROR: Build Tools 35.0.0 not found"
            exit 1
          fi

          echo "Android SDK OK"
          echo "Android API 35 OK"
          echo "Build Tools 35.0.0 OK"


      # =========================================================
      # 5. CREATE PROJECT
      # =========================================================

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p live-sender/app/src/main/java/com/aimrelax/livesender
          mkdir -p live-sender/app/src/main/res/values


          # =====================================================
          # settings.gradle
          # =====================================================

          cat > live-sender/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://jitpack.io")
        }
    }
}

rootProject.name = "AIMRELAX-LIVE-Sender"

include(":app")
EOF


          # =====================================================
          # build.gradle
          # =====================================================

          cat > live-sender/build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
EOF


          # =====================================================
          # gradle.properties
          # =====================================================

          cat > live-sender/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
EOF


          # =====================================================
          # app/build.gradle
          # =====================================================

          cat > live-sender/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aimrelax.livesender'

    compileSdk 35

    defaultConfig {
        applicationId 'com.aimrelax.livesender'
        minSdk 23
        targetSdk 35

        versionCode 3
        versionName '3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    implementation 'io.livekit:livekit-android:2.28.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
EOF


          # =====================================================
          # strings.xml
          # =====================================================

          cat > live-sender/app/src/main/res/values/strings.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="app_name">AIMRELAX LIVE Sender</string>
</resources>
EOF


          # =====================================================
          # styles.xml
          # =====================================================

          cat > live-sender/app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:statusBarColor">#070707</item>
        <item name="android:navigationBarColor">#070707</item>
        <item name="android:colorAccent">#ff7a00</item>
    </style>
</resources>
EOF


          # =====================================================
          # AndroidManifest.xml
          # =====================================================

          cat > live-sender/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <uses-permission
        android:name="android.permission.FOREGROUND_SERVICE" />

    <uses-permission
        android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

    <uses-permission
        android:name="android.permission.POST_NOTIFICATIONS" />

    <application
        android:allowBackup="true"
        android:label="@string/app_name"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="false">

