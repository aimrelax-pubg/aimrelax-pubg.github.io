          # =====================================================
          # MainActivity.kt
          # =====================================================

          cat > live-sender/app/src/main/java/com/aimrelax/livesender/MainActivity.kt <<'EOF'
package com.aimrelax.livesender

import android.app.Activity
import android.content.Context
import android.content.Intent
import android.graphics.Color
import android.media.projection.MediaProjectionManager
import android.os.Bundle
import android.view.Gravity
import android.webkit.WebView
import android.webkit.WebViewClient
import android.widget.Button
import android.widget.EditText
import android.widget.LinearLayout
import android.widget.TextView

import androidx.appcompat.app.AppCompatActivity
import androidx.lifecycle.lifecycleScope

import io.livekit.android.LiveKit
import io.livekit.android.room.Room
import io.livekit.android.room.track.ScreenCaptureParams

import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.launch
import kotlinx.coroutines.suspendCancellableCoroutine
import kotlinx.coroutines.withContext

import org.json.JSONObject

import java.net.HttpURLConnection
import java.net.URL
import java.util.UUID
import kotlin.coroutines.resume


class MainActivity : AppCompatActivity() {

    companion object {

        private const val SUPABASE_URL =
            "https://hvhlrbfjloiahbqmnrly.supabase.co"

        private const val SUPABASE_KEY =
            "sb_publishable_EcZUkLdUCvV3qWDD7jlvhg_OjTYu1jA"

        private const val WEBSITE_URL =
            "https://aimrelax-pubg.github.io/"

        private const val SCREEN_REQUEST =
            5001
    }


    private lateinit var webView: WebView
    private lateinit var titleInput: EditText
    private lateinit var startButton: Button
    private lateinit var stopButton: Button
    private lateinit var statusText: TextView


    private var room: Room? = null

    private var accessToken: String? = null

    private var userId: String? = null

    private var userName =
        "AIMRELAX User"

    private var streamId: String? = null

    private var serverUrl: String? = null

    private var participantToken: String? = null


    override fun onCreate(
        savedInstanceState: Bundle?
    ) {

        super.onCreate(
            savedInstanceState
        )

        createUI()

        setupWebView()

        startButton.setOnClickListener {
            startLive()
        }

        stopButton.setOnClickListener {
            stopLive()
        }
    }


    private fun createUI() {

        val root =
            LinearLayout(this)

        root.orientation =
            LinearLayout.VERTICAL

        root.gravity =
            Gravity.CENTER_HORIZONTAL

        root.setPadding(
            24,
            30,
            24,
            24
        )

        root.setBackgroundColor(
            Color.rgb(
                7,
                7,
                7
            )
        )


        val heading =
            TextView(this)

        heading.text =
            "AIMRELAX LIVE Sender"

        heading.textSize =
            25f

        heading.setTextColor(
            Color.rgb(
                255,
                122,
                0
            )
        )

        heading.gravity =
            Gravity.CENTER

        root.addView(
            heading,
            LinearLayout.LayoutParams(
                -1,
                -2
            )
        )


        val subtitle =
            TextView(this)

        subtitle.text =
            "PUBG MOBILE LIVE STREAM"

        subtitle.textSize =
            14f

        subtitle.setTextColor(
            Color.WHITE
        )

        subtitle.gravity =
            Gravity.CENTER

        val subtitleParams =
            LinearLayout.LayoutParams(
                -1,
                -2
            )

        subtitleParams.topMargin =
            8

        root.addView(
            subtitle,
            subtitleParams
        )


        titleInput =
            EditText(this)

        titleInput.hint =
            "LIVE-ի վերնագիրը"

        titleInput.setHintTextColor(
            Color.GRAY
        )

        titleInput.setTextColor(
            Color.WHITE
        )

        titleInput.setSingleLine(
            true
        )

        val inputParams =
            LinearLayout.LayoutParams(
                -1,
                -2
            )

        inputParams.topMargin =
            30

        root.addView(
            titleInput,
            inputParams
        )


        startButton =
            Button(this)

        startButton.text =
            "ՍԿՍԵԼ LIVE"

        val startParams =
            LinearLayout.LayoutParams(
                -1,
                -2
            )

        startParams.topMargin =
            18

        root.addView(
            startButton,
            startParams
        )


        stopButton =
            Button(this)

        stopButton.text =
            "ԴԱԴԱՐԵՑՆԵԼ LIVE"

        stopButton.isEnabled =
            false

        val stopParams =
            LinearLayout.LayoutParams(
                -1,
                -2
            )

        stopParams.topMargin =
            10

        root.addView(
            stopButton,
            stopParams
        )


        statusText =
            TextView(this)

        statusText.text =
            "Պատրաստ է"

        statusText.textSize =
            15f

        statusText.setTextColor(
            Color.WHITE
        )

        statusText.gravity =
            Gravity.CENTER

        val statusParams =
            LinearLayout.LayoutParams(
                -1,
                -2
            )

        statusParams.topMargin =
            20

        root.addView(
