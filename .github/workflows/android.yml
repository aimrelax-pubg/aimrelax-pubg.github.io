name: Build AIMRELAX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Clean ALL Capacitor configs
        run: |
          rm -f ./capacitor.config.ts
          rm -f ./capacitor.config.js
          rm -f ./capacitor.config.mjs
          rm -f ./capacitor.config.cjs
          rm -f ./capacitor.config.json

      - name: Prepare website
        run: |
          rm -rf www
          mkdir -p www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='www' \
            --exclude='android' \
            --exclude='capacitor.config.*' \
            ./ www/

      - name: Create JSON config
        run: |
          cat > ./capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF

      - name: Verify config BEFORE Capacitor
             - name: Verify config BEFORE Capacitor
        run: |
          echo "=== CONFIG FILES ==="
          find . -maxdepth 1 -type f -name 'capacitor.config*' -print

          echo "=== JSON CONFIG ==="
          if [ -f ./capacitor.config.json ]; then
            cat ./capacitor.config.json
          else
            echo "capacitor.config.json NOT FOUND"
          fi

          echo "=== TYPESCRIPT CONFIG ==="
          if [ -f ./capacitor.config.ts ]; then
            echo "capacitor.config.ts FOUND"
            cat ./capacitor.config.ts
          else
            echo "capacitor.config.ts NOT FOUND"
          fi

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
