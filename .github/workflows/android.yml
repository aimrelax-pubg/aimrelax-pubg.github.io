name: Build AIMRELAX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create npm project
        run: |
          npm init -y

      - name: Install TypeScript runtime
        run: |
          npm install typescript tsx

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7
          npm install @capacitor/cli@7
          npm install @capacitor/android@7

      - name: Clean old Capacitor files
        run: |
          rm -rf android
          rm -rf www
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs
          rm -f capacitor.config.cjs
          rm -f capacitor.config.json

      - name: Copy website
        run: |
          mkdir -p www

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='www' \
            --exclude='android' \
            --exclude='capacitor.config.*' \
            ./ www/

      - name: Create TypeScript Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.aimrelax.pubg',
            appName: 'AIMRELAX PUBG',
            webDir: 'www'
          };

          export default config;
          EOF

      - name: Verify environment
        run: |
          echo "===== Node ====="
          node --version

          echo "===== npm ====="
          npm --version

          echo "===== TypeScript ====="
          ./node_modules/.bin/tsc --version

          echo "===== tsx ====="
          ./node_modules/.bin/tsx --version

          echo "===== Capacitor ====="
          npx cap --version

          echo "===== Config ====="
          cat capacitor.config.ts

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
