name: Build AIMRELAX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7
          npm install @capacitor/cli@7
          npm install @capacitor/android@7

      - name: Remove old configs
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.mjs
          rm -f capacitor.config.cjs
          rm -f capacitor.config.json

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF

      - name: Verify config
        run: |
          echo "=== CONFIG FILES ==="
          find . -maxdepth 1 -type f -name 'capacitor.config*' -print

          echo "=== CONFIG CONTENT ==="
          cat capacitor.config.json

      - name: Add Android
        run: npx cap add android

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
