name: Build AIMRELAX Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Remove ALL old Capacitor configs
        run: |
          find . -type f -name 'capacitor.config.ts' -delete
          find . -type f -name 'capacitor.config.js' -delete
          find . -type f -name 'capacitor.config.mjs' -delete
          find . -type f -name 'capacitor.config.cjs' -delete
          find . -type f -name 'capacitor.config.json' -delete

          echo "Remaining Capacitor configs:"
          find . -type f -name 'capacitor.config*' -print || true

      - name: Prepare website
        run: |
          rm -rf www
          mkdir -p www

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='www' \
            --exclude='android' \
            --exclude='capacitor.config.*' \
            ./ www/

      - name: Create JSON Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF

      - name: Verify Capacitor config
        run: |
          echo "===== CONFIG FILES ====="
          find . -type f -name 'capacitor.config*' -print

          echo "===== JSON CONFIG ====="
          cat capacitor.config.json

          echo "===== CAPACITOR VERSION ====="
          npx cap --version

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
