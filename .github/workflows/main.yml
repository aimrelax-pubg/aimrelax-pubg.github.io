name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      # ============================================================
      # WEB FILES
      # ============================================================
      - name: Prepare web files
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/
          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

          echo "===== WWW FILES ====="
          find www -maxdepth 1 -type f -print

      # ============================================================
      # CAPACITOR CONFIG
      # ============================================================
      - name: Create Capacitor config
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF

      # ============================================================
      # ANDROID
      # ============================================================
      - name: Add Android
        run: |
          npx cap add android

      # ============================================================
      # JITPACK
      # ============================================================
      - name: Add JitPack repository
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          text = p.read_text()

          if "https://jitpack.io" not in text:

              if "allprojects {" in text:
                  text = text.replace(
                      "allprojects {",
                      """allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }""",
                      1
                  )
              else:
                  text += """
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          """

          p.write_text(text)
          PY

      # ============================================================
      # LIVEKIT
      # ============================================================
      - name: Add LiveKit dependency
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = 'implementation "io.livekit:livekit-android:2.29.0"'

          if dependency not in text:

              if "dependencies {" not in text:
                  raise SystemExit("dependencies block not found")

              text = text.replace(
                  "dependencies {",
                  "dependencies {\n    " + dependency,
                  1
              )

          p.write_text(text)
          PY

      # ============================================================
      # MAIN ACTIVITY
      # ============================================================
      - name: Create Native MainActivity
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/aimrelax/pubg

          rm -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.java

          cat > android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt <<'KOTLIN'
          package com.aimrelax.pubg

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.webkit.JavascriptInterface

          import com.getcapacitor.BridgeActivity

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          class MainActivity : BridgeActivity() {

              private var room: Room? = null

              private val SCREEN_CAPTURE_REQUEST = 9001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  /*
                   * Do NOT initialize LiveKit here.
                   * Capacitor must start the website normally.
                   */

                  bridge.webView.addJavascriptInterface(
                      AndroidBridge(),
                      "AIMRELAX_NATIVE"
                  )
              }

              private fun getLiveKitRoom(): Room {

                  if (room == null) {
                      room = LiveKit.create(applicationContext)
                  }

                  return room!!
              }

              inner class AndroidBridge {

                  @JavascriptInterface
                  fun isAndroidApp(): Boolean {
                      return true
                  }

                  @JavascriptInterface
                  fun startLiveKit(
                      serverUrl: String,
                      token: String
                  ) {

                      Thread {

                          try {

                              val liveRoom = getLiveKitRoom()

                              liveRoom.connect(
                                  serverUrl,
                                  token
                              )

                          } catch (e: Exception) {
                              e.printStackTrace()
                          }

                      }.start()
                  }

                  @JavascriptInterface
                  fun startScreenShare() {

                      runOnUiThread {

                          try {

                              getLiveKitRoom()

                              val manager =
                                  getSystemService(
                                      MEDIA_PROJECTION_SERVICE
                                  ) as MediaProjectionManager

                              val intent =
                                  manager.createScreenCaptureIntent()

                              startActivityForResult(
                                  intent,
                                  SCREEN_CAPTURE_REQUEST
                              )

                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun stopScreenShare() {

                      runOnUiThread {

                          try {

                              room?.localParticipant
                                  ?.setScreenShareEnabled(false)

                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun disconnectLiveKit() {

                      runOnUiThread {

                          try {
                              room?.disconnect()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }

                      }
                  }
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == SCREEN_CAPTURE_REQUEST &&
                      resultCode == Activity.RESULT_OK &&
                      data != null
                  ) {

                      try {

                          val liveRoom = getLiveKitRoom()

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData = data
                              )

                          liveRoom.localParticipant
                              .setScreenShareEnabled(
                                  true,
                                  params
                              )

                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun onDestroy() {

                  try {
                      room?.disconnect()
                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          KOTLIN

      # ============================================================
      # MANIFEST — FIXED
      # ============================================================
      - name: Configure Android Manifest
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          # --------------------------------------------------------
          # Ensure Android namespace is on the REAL manifest tag
          # --------------------------------------------------------
          if 'xmlns:android=' not in text:

              text = re.sub(
                  r'<manifest\b',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  text,
                  count=1
              )

          # --------------------------------------------------------
          # Remove previously inserted duplicate permissions
          # --------------------------------------------------------
          permission_names = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"
          ]

          for name in permission_names:
              pattern = (
                  r'\s*<uses-permission\s+'
                  r'android:name="' +
                  re.escape(name) +
                  r'"\s*/>'
              )

              text = re.sub(
                  pattern,
                  "",
                  text
              )

          # --------------------------------------------------------
          # Find REAL opening <manifest ...> tag
          # --------------------------------------------------------
          match = re.search(
              r'<manifest\b[^>]*>',
              text,
              flags=re.DOTALL
          )

          if not match:
              raise SystemExit("Manifest opening tag not found")

          manifest_tag = match.group(0)

          # --------------------------------------------------------
          # Add permissions AFTER manifest opening tag
          # --------------------------------------------------------
          permissions = """
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
          """.strip()

          text = (
              text[:match.end()]
              + "\n"
              + permissions
              + "\n"
              + text[match.end():]
          )

          p.write_text(text)

          # --------------------------------------------------------
          # XML VALIDATION
          # --------------------------------------------------------
          ET.parse(p)

          print("AndroidManifest.xml validation: OK")
          PY

          echo "===== FINAL MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml

      # ============================================================
      # CAPACITOR SYNC
      # ============================================================
      - name: Sync Android
        run: |
          npx cap sync android

      # ============================================================
      # VERIFY WEBSITE
      # ============================================================
      - name: Verify Web Assets
        run: |
          set -e

          test -f android/app/src/main/assets/public/index.html

          echo "===== WEBSITE INSIDE APK ====="
          ls -lh android/app/src/main/assets/public/

          echo "index.html exists."

      # ============================================================
      # VERIFY MAIN ACTIVITY
      # ============================================================
      - name: Verify MainActivity
        run: |
          set -e

          test -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt

          echo "MainActivity exists."

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # ============================================================
      # APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK-LIVE
          path: android/app/build/outputs/apk/debug/app-debug.apk
