name: AIMRELAX LIVE Sender APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Repository
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 21
      # ==========================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # ==========================================
      # 3. Android SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      # ==========================================
      # 4. Create project folders
      # ==========================================

      - name: Create project folders
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/aimrelax/live
          mkdir -p android/app/src/main/res/values


      # ==========================================
      # 5. settings.gradle
      # ==========================================

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven {
                      url = uri("https://jitpack.io")
                  }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://jitpack.io")
                  }
              }
          }

          rootProject.name = "AIMRELAX-LIVE-SENDER"

          include(":app")
          EOF


      # ==========================================
      # 6. Root build.gradle
      # ==========================================

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


      # ==========================================
      # 7. gradle.properties
      # ==========================================

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF


      # ==========================================
      # 8. app/build.gradle
      # ==========================================

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aimrelax.live'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimrelax.live'

                  minSdk 23
                  targetSdk 35

                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }

              kotlinOptions {
                  jvmTarget = '21'
              }
          }

          dependencies {
              implementation 'io.livekit:livekit-android:2.28.2'

              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
          }
          EOF


      # ==========================================
      # 9. AndroidManifest.xml
      # ==========================================

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="AIMRELAX LIVE Sender"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

                  <service
                      android:name="io.livekit.android.room.track.screencapture.ScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />

              </application>

          </manifest>
          EOF


      # ==========================================
      # 10. Theme
      # ==========================================

      - name: Create styles.xml
        shell: bash
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:colorAccent">#FF7A00</item>

                  <item name="android:navigationBarColor">#070707</item>

                  <item name="android:statusBarColor">#070707</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


      # ==========================================
      # 11. MainActivity.kt
      # ==========================================

      - name: Create MainActivity.kt
        shell: bash
        run: |
          cat > android/app/src/main/java/com/aimrelax/live/MainActivity.kt <<'EOF'
          package com.aimrelax.live

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          import org.json
