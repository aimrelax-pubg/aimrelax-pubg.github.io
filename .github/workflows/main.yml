package com.aimrelax.live

import android.app.Activity
import android.content.Intent
import android.graphics.Color
import android.media.projection.MediaProjectionManager
import android.os.Bundle
import android.view.ViewGroup
import android.webkit.CookieManager
import android.webkit.WebView
import android.webkit.WebViewClient
import android.widget.Button
import android.widget.LinearLayout
import android.widget.TextView
import io.livekit.android.LiveKit
import io.livekit.android.room.Room
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.SupervisorJob
import kotlinx.coroutines.cancel
import kotlinx.coroutines.launch
import kotlinx.coroutines.withContext
import org.json.JSONObject
import java.net.HttpURLConnection
import java.net.URL

class MainActivity : Activity() {

companion object {
    private const val SCREEN_CAPTURE_REQUEST = 9001

    private const val AIMRELAX_URL =
        "https://aimrelax-pubg.github.io/"

    private const val LIVE_TOKEN_URL =
        "https://hvhlrbfjloiahbqmnrly.supabase.co/functions/v1/live-token"
}

private lateinit var room: Room
private lateinit var status: TextView
private lateinit var webView: WebView

private val scope =
    CoroutineScope(
        SupervisorJob() + Dispatchers.Main
    )

private var supabaseAccessToken: String? = null
private var liveToken: String? = null
private var liveServerUrl: String? = null
private var liveRoomName: String? = null

override fun onCreate(savedInstanceState: Bundle?) {
    super.onCreate(savedInstanceState)

    LiveKit.init(applicationContext)

    room = LiveKit.create(applicationContext)

    createInterface()
}

private fun createInterface() {

    val root = LinearLayout(this)

    root.orientation =
        LinearLayout.VERTICAL

    root.setBackgroundColor(
        Color.WHITE
    )

    root.setPadding(
        24,
        30,
        24,
        24
    )

    status = TextView(this)

    status.text =
        "AIMRELAX LIVE\n\n" +
        "Մուտք գործիր AIMRELAX account-ով։"

    status.textSize = 18f

    status.setTextColor(
        Color.BLACK
    )

    root.addView(
        status,
        LinearLayout.LayoutParams(
            ViewGroup.LayoutParams.MATCH_PARENT,
            ViewGroup.LayoutParams.WRAP_CONTENT
        )
    )

    webView = WebView(this)

    webView.settings.javaScriptEnabled = true
    webView.settings.domStorageEnabled = true
    webView.settings.databaseEnabled = true
    webView.settings.mediaPlaybackRequiresUserGesture =
        false

    CookieManager
        .getInstance()
        .setAcceptCookie(true)

    CookieManager
        .getInstance()
        .setAcceptThirdPartyCookies(
            webView,
            true
        )

    webView.webViewClient =
        object : WebViewClient() {

            override fun onPageFinished(
                view: WebView?,
                url: String?
            ) {

                super.onPageFinished(
                    view,
                    url
                )

                status.text =
                    "AIMRELAX-ը բաց է։\n\n" +
                    "Մուտք գործիր account-ով։"
            }
        }

    webView.loadUrl(
        AIMRELAX_URL
    )

    root.addView(
        webView,
        LinearLayout.LayoutParams(
            ViewGroup.LayoutParams.MATCH_PARENT,
            0,
            1f
        )
    )

    val startButton =
        Button(this)

    startButton.text =
        "🔴 ՍԿՍԵԼ PUBG LIVE"

    startButton.setOnClickListener {

        readSupabaseSession()
    }

    root.addView(
        startButton,
        LinearLayout.LayoutParams(
            ViewGroup.LayoutParams.MATCH_PARENT,
            ViewGroup.LayoutParams.WRAP_CONTENT
        )
    )

    val stopButton =
        Button(this)

    stopButton.text =
        "⏹ STOP LIVE"

    stopButton.setOnClickListener {

        stopLive()
    }

    root.addView(
        stopButton,
        LinearLayout.LayoutParams(
            ViewGroup.LayoutParams.MATCH_PARENT,
            ViewGroup.LayoutParams.WRAP_CONTENT
        )
    )

    setContentView(root)
}

private fun readSupabaseSession() {

    status.text =
        "🔄 Ստուգում ենք AIMRELAX account-ը..."

    val javascript = """
        (function() {
            try {

                for (
                    var i = 0;
                    i < localStorage.length;
                    i++
                ) {

                    var key =
                        localStorage.key(i);

                    if (
                        key &&
                        key.indexOf("auth-token") !== -1
                    ) {

                        var value =
                            localStorage.getItem(key);

                        try {

                            var data =
                                JSON.parse(value);

                            if (
                                data &&
                                data.access_token
                            ) {

                                return data.access_token;
                            }

                            if (
                                data &&
                                data.currentSession &&
                                data.currentSession.access_token
                            ) {

                                return data.currentSession.access_token;
                            }

                        } catch (e) {
                        }
                    }
                }

                return "";

            } catch (e) {

                return "";
            }
        })();
    """.trimIndent()

    webView.evaluateJavascript(
        javascript
    ) { result ->

        val token =
            parseJavascriptString(
                result
            )

        if (
            token.isNullOrBlank()
        ) {

            status.text =
                "❌ AIMRELAX account-ը մուտք գործած չէ։\n\n" +
                "Նախ մուտք գործիր վերևի էջում։"

            return@evaluateJavascript
        }

        supabaseAccessToken =
            token

        status.text =
            "✅ Account գտնվեց։\n\n" +
            "Ստանում ենք LiveKit token..."

        requestLiveToken()
    }
}

private fun parseJavascriptString(
    value: String?
): String? {

    if (
        value == null ||
        value == "null"
    ) {
        return null
    }

    return try {

        val parsed =
            org.json.JSONTokener(
                value
            ).nextValue()

        parsed.toString()

    } catch (_: Exception) {

        value
            .removePrefix("\"")
            .removeSuffix("\"")
            .replace(
                "\\\"",
                "\""
            )
            .replace(
                "\\\\",
                "\\"
            )
    }
}

private fun requestLiveToken() {

    val accessToken =
        supabaseAccessToken

    if (
        accessToken.isNullOrBlank()
    ) {

        status.text =
            "❌ Supabase session չկա։"

        return
    }

    scope.launch {

        try {

            val result =
                withContext(
                    Dispatchers.IO
                ) {

                    val connection =
                        URL(
                            LIVE_TOKEN_URL
                        )
                            .openConnection()
                            as HttpURLConnection

                    connection.requestMethod =
                        "POST"

                    connection.setRequestProperty(
                        "Authorization",
                        "Bearer $accessToken"
                    )

                    connection.setRequestProperty(
                        "Content-Type",
                        "application/json"
                    )

                    connection.doOutput =
                        true

                    val body =
                        """
                        {
                          "role": "host"
                        }
                        """.trimIndent()

                    connection.outputStream.use {

                        it.write(
                            body.toByteArray(
                                Charsets.UTF_8
                            )
                        )
                    }

                    val responseCode =
                        connection.responseCode

                    val stream =
                        if (
                            responseCode in 200..299
                        ) {

                            connection.inputStream

                        } else {

                            connection.errorStream
                        }

                    val responseText =
                        stream
                            ?.bufferedReader()
                            ?.use {
                                it.readText()
                            }
                            ?: ""

                    Pair(
                        responseCode,
                        responseText
                    )
                }

            if (
                result.first !in 200..299
            ) {

                status.text =
                    "❌ live-token error\n\n" +
                    result.second

                return@launch
            }

            parseLiveToken(
                result.second
            )

        } catch (e: Exception) {

            status.text =
                "❌ Token ստանալու սխալ\n\n" +
                (
                    e.message
                        ?: "Unknown error"
                )
        }
    }
}

private fun parseLiveToken(
    response: String
) {

    try {

        val json =
            JSONObject(response)

        liveToken =
            json.optString(
                "token",
                ""
            )

        liveServerUrl =
            json.optString(
                "serverUrl",
                ""
            )

        if (
            liveServerUrl.isNullOrBlank()
        ) {

            liveServerUrl =
                json.optString(
                    "server_url",
                    ""
                )
        }

        if (
            liveServerUrl.isNullOrBlank()
        ) {

            liveServerUrl =
                json.optString(
                    "url",
                    ""
                )
        }

        liveRoomName =
            json.optString(
                "room_name",
                ""
            )

        if (
            liveRoomName.isNullOrBlank()
        ) {

            liveRoomName =
                json.optString(
                    "roomName",
                    ""
                )
        }

        if (
            liveToken.isNullOrBlank()
        ) {

            throw Exception(
                "LiveKit token չի վերադարձվել։"
            )
        }

        if (
            liveServerUrl.isNullOrBlank()
        ) {

            throw Exception(
                "LiveKit server URL չի վերադարձվել։"
            )
        }

        status.text =
            "✅ LiveKit token ստացվեց։\n\n" +
            "Հիմա թույլատրիր Screen Capture-ը։"

        requestScreenCapture()

    } catch (e: Exception) {

        status.text =
            "❌ Token response error\n\n" +
            (
                e.message
                    ?: "Unknown error"
            ) +
            "\n\n" +
            response
    }
}

private fun requestScreenCapture() {

    val manager =
        getSystemService(
            MEDIA_PROJECTION_SERVICE
        ) as MediaProjectionManager

    val intent =
        manager.createScreenCaptureIntent()

    startActivityForResult(
        intent,
        SCREEN_CAPTURE_REQUEST
    )
}

override fun onActivityResult(
    requestCode: Int,
    resultCode: Int,
    data: Intent?
) {

    super.onActivityResult(
        requestCode,
        resultCode,
        data
    )

    if (
        requestCode !=
        SCREEN_CAPTURE_REQUEST
    ) {
        return
    }

    if (
        resultCode != RESULT_OK ||
        data == null
    ) {

        status.text =
            "❌ Screen Capture-ը չեղարկվեց։"

        return
    }

    status.text =
        "Screen Capture Permission OK.\n\n" +
        "Միանում ենք LiveKit-ին..."

    startLive(
        data
    )
}

private fun startLive(
    permissionData: Intent
) {

    val token =
        liveToken

    val serverUrl =
        liveServerUrl

    if (
        token.isNullOrBlank() ||
        serverUrl.isNullOrBlank()
    ) {

        status.text =
            "❌ LiveKit token կամ URL չկա։"

        return
    }

    scope.launch {

        try {

            status.text =
                "🔄 LiveKit-ին միանում ենք..."

            room.connect(
                serverUrl,
                token
            )

            status.text =
                "✅ LiveKit-ին միացանք։\n\n" +
                "PUBG-ի էկրանը հրապարակվում է..."

            /*
             * LiveKit 2.28.2
             *
             * Screen Capture
             * MediaProjection permission data
             */

            room.localParticipant
                .setScreenShareEnabled(
                    true,
                    permissionData
                )

            status.text =
                "🔴 AIMRELAX LIVE ԱՇԽԱՏՈՒՄ Է\n\n" +
                "PUBG-ի էկրանը ուղարկվում է LiveKit։"

        } catch (e: Exception) {

            status.text =
                "❌ LIVE START ERROR\n\n" +
                (
                    e.message
                        ?: e.javaClass.simpleName
                )
        }
    }
}

private fun stopLive() {

    try {

        room.localParticipant
            .setScreenShareEnabled(
                false
            )

    } catch (_: Exception) {
    }

    try {

        room.disconnect()

    } catch (_: Exception) {
    }

    status.text =
        "LIVE-ը կանգնեցվեց։"
}

override fun onDestroy() {

    try {

        room.disconnect()

    } catch (_: Exception) {
    }

    scope.cancel()

    try {

        webView.destroy()

    } catch (_: Exception) {
    }

    super.onDestroy()
}

}
