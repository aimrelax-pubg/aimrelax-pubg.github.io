name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. DOWNLOAD WEBSITE
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. NODE
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # --------------------------------------------------
      # 3. JAVA
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # --------------------------------------------------
      # 4. CREATE NPM PROJECT
      # --------------------------------------------------
      - name: Initialize npm
        run: npm init -y


      # --------------------------------------------------
      # 5. INSTALL CAPACITOR 7
      # --------------------------------------------------
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # --------------------------------------------------
      # 6. PREPARE WEBSITE
      # --------------------------------------------------
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          cp sw.js www/ 2>/dev/null || true

          cp manifest.json www/ 2>/dev/null || true


      # --------------------------------------------------
      # 7. REMOVE OLD CAPACITOR CONFIG
      # --------------------------------------------------
      - name: Remove old Capacitor configs
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.js
          true


      # --------------------------------------------------
      # 8. CREATE CAPACITOR CONFIG
      # --------------------------------------------------
      - name: Create Capacitor config
        run: |
          printf '%s\n' \
            '{' \
            '  "appId": "com.aimrelax.pubg",' \
            '  "appName": "AIMRELAX PUBG",' \
            '  "webDir": "www"' \
            '}' > capacitor.config.json


      # --------------------------------------------------
      # 9. ADD ANDROID
      # --------------------------------------------------
      - name: Add Android
        run: |
          npx cap add android


      # --------------------------------------------------
      # 10. CONFIGURE ANDROID REPOSITORIES
      # --------------------------------------------------
      - name: Configure Android repositories
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle")
          s = p.read_text()

          if "https://jitpack.io" not in s:
              marker = "repositories {"

              if marker in s:
                  s = s.replace(
                      marker,
                      marker + '\n        maven { url = uri("https://jitpack.io") }',
                      1
                  )

          p.write_text(s)
          PY


      # --------------------------------------------------
      # 11. ADD LIVEKIT ANDROID
      # --------------------------------------------------
      - name: Configure LiveKit Android
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

          if dependency not in s:

              if "dependencies {" in s:
                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  s += """

          dependencies {
              implementation("io.livekit:livekit-android:2.29.0")
          }
          """

          p.write_text(s)
          PY


      # --------------------------------------------------
      # 12. ADD ANDROID PERMISSIONS
      # --------------------------------------------------
      - name: Configure Android permissions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      "<application",
                      permission + "\n\n    <application",
                      1
                  )

          service = """
              <service
                  android:name="io.livekit.android.room.track.screencapture.ScreenCaptureService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="mediaProjection" />
          """

          if "ScreenCaptureService" not in s:
              s = s.replace(
                  "</application>",
                  service + "\n    </application>",
                  1
              )

          p.write_text(s)
          PY


      # --------------------------------------------------
      # 13. CREATE NATIVE MAIN ACTIVITY
      # --------------------------------------------------
      - name: Configure AIMRELAX native bridge
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/aimrelax/pubg

          cat > android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt <<'EOF'
          package com.aimrelax.pubg

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.webkit.JavascriptInterface

          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope

          import com.getcapacitor.BridgeActivity

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          import kotlinx.coroutines.launch

          class MainActivity : BridgeActivity() {

              private lateinit var room: Room

              private val screenCaptureLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { result ->

                      if (result.resultCode != Activity.RESULT_OK) {

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:'Screen capture permission denied'}}));"
                          )

                          return@registerForActivityResult
                      }

                      val data = result.data

                      if (data == null) {

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:'Screen capture data missing'}}));"
                          )

                          return@registerForActivityResult
                      }

                      publishScreen(data)
                  }


              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  room = LiveKit.create(applicationContext)

                  addJavascriptBridge()

                  requestNotificationPermission()
              }


              private fun addJavascriptBridge() {

                  bridge.webView.addJavascriptInterface(
                      NativeBridge(),
                      "AIMRELAX_NATIVE"
                  )

                  bridge.webView.post {

                      sendToWebsite(
                          "window.dispatchEvent(new CustomEvent('aimrelax-native-ready'));"
                      )
                  }
              }


              private fun requestNotificationPermission() {

                  if (Build.VERSION.SDK_INT >= 33) {

                      if (
                          ContextCompat.checkSelfPermission(
                              this,
                              Manifest.permission.POST_NOTIFICATIONS
                          ) != PackageManager.PERMISSION_GRANTED
                      ) {

                          requestPermissions(
                              arrayOf(
                                  Manifest.permission.POST_NOTIFICATIONS
                              ),
                              5001
                          )
                      }
                  }
              }


              private fun connectLiveKit(
                  serverUrl: String,
                  token: String
              ) {

                  lifecycleScope.launch {

                      try {

                          room.connect(
                              serverUrl,
                              token
                          )

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-livekit-connected'));"
                          )

                      } catch (e: Exception) {

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-native-error',{detail:{message:${jsString(e.message ?: "LiveKit connection failed")}}}));"
                          )
                      }
                  }
              }


              private fun startScreenCapture() {

                  val manager =
                      getSystemService(
                          MEDIA_PROJECTION_SERVICE
                      ) as MediaProjectionManager

                  val intent =
                      manager.createScreenCaptureIntent()

                  screenCaptureLauncher.launch(intent)
              }


              private fun publishScreen(
                  data: Intent
              ) {

                  lifecycleScope.launch {

                      try {

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData = data
                              )

                          val result =
                              room.localParticipant
                                  .setScreenShareEnabled(
                                      true,
                                      params
                                  )

                          if (result) {

                              sendToWebsite(
                                  "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-started'));"
                              )

                          } else {

                              sendToWebsite(
                                  "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:'Unable to start screen sharing'}}));"
                              )
                          }

                      } catch (e: Exception) {

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:${jsString(e.message ?: "Screen sharing failed")}}}));"
                          )
                      }
                  }
              }


              private fun stopScreenCapture() {

                  lifecycleScope.launch {

                      try {

                          room.localParticipant
                              .setScreenShareEnabled(false)

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-stopped'));"
                          )

                      } catch (e: Exception) {

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:${jsString(e.message ?: "Unable to stop screen sharing")}}}));"
                          )
                      }
                  }
              }


              private fun disconnectLiveKit() {

                  lifecycleScope.launch {

                      try {

                          room.disconnect()

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-livekit-disconnected'));"
                          )

                      } catch (_: Exception) {
                      }
                  }
              }


              private fun sendToWebsite(
                  javascript: String
              ) {

                  runOnUiThread {

                      try {

                          bridge.webView.evaluateJavascript(
                              javascript,
                              null
                          )

                      } catch (_: Exception) {
                      }
                  }
              }


              private fun jsString(
                  value: String
              ): String {

                  return "'" +
                      value
                          .replace("\\", "\\\\")
                          .replace("'", "\\'")
                          .replace("\n", "\\n")
                          .replace("\r", "\\r") +
                      "'"
              }


              inner class NativeBridge {

                  @JavascriptInterface
                  fun isAndroidApp(): Boolean {

                      return true
                  }


                  @JavascriptInterface
                  fun startLiveKit(
                      serverUrl: String,
                      token: String
                  ) {

                      runOnUiThread {

                          connectLiveKit(
                              serverUrl,
                              token
                          )
                      }
                  }


                  @JavascriptInterface
                  fun startScreenShare() {

                      runOnUiThread {

                          startScreenCapture()
                      }
                  }


                  @JavascriptInterface
                  fun stopScreenShare() {

                      runOnUiThread {

                          stopScreenCapture()
                      }
                  }


                  @JavascriptInterface
                  fun disconnectLiveKit() {

                      runOnUiThread {

                          disconnectLiveKit()
                      }
                  }
              }


              override fun onDestroy() {

                  try {

                      room.disconnect()

                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          EOF

          rm -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.java


      # --------------------------------------------------
      # 14. SYNC CAPACITOR
      # --------------------------------------------------
      - name: Sync Android
        run: |
          npx cap sync android


      # --------------------------------------------------
      # 15. BUILD APK
      # --------------------------------------------------
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace


      # --------------------------------------------------
      # 16. UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK-LIVE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
