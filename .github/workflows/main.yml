name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. NODE
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # --------------------------------------------------
      # 3. JAVA
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # --------------------------------------------------
      # 4. INIT NPM
      # --------------------------------------------------
      - name: Initialize npm
        run: npm init -y


      # --------------------------------------------------
      # 5. INSTALL CAPACITOR 7
      # --------------------------------------------------
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # --------------------------------------------------
      # 6. PREPARE WEBSITE
      # --------------------------------------------------
      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/

          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

          echo "===== WWW FILES ====="
          find www -maxdepth 1 -type f -print


      # --------------------------------------------------
      # 7. REMOVE OLD CAPACITOR CONFIG
      # --------------------------------------------------
      - name: Remove old Capacitor configs
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.js


      # --------------------------------------------------
      # 8. CREATE CAPACITOR CONFIG
      # --------------------------------------------------
      - name: Create Capacitor config
        run: |
          printf '%s\n' \
            '{' \
            '  "appId": "com.aimrelax.pubg",' \
            '  "appName": "AIMRELAX PUBG",' \
            '  "webDir": "www"' \
            '}' > capacitor.config.json

          echo "===== capacitor.config.json ====="
          cat capacitor.config.json


      # --------------------------------------------------
      # 9. ADD ANDROID
      # --------------------------------------------------
      - name: Add Android
        run: npx cap add android


      # --------------------------------------------------
      # 10. ADD JITPACK CORRECTLY
      # --------------------------------------------------
      - name: Add JitPack repository
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("android/settings.gradle")
          s = p.read_text()

          jitpack = 'maven { url = uri("https://jitpack.io") }'

          if "https://jitpack.io" not in s:

              pattern = r'(dependencyResolutionManagement\s*\{\s*repositories\s*\{)'

              new_s, count = re.subn(
                  pattern,
                  r'\1\n        ' + jitpack,
                  s,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "ERROR: dependencyResolutionManagement repositories block was not found"
                  )

              s = new_s

          p.write_text(s)

          print("")
          print("========================================")
          print("FINAL android/settings.gradle")
          print("========================================")
          print(s)
          print("========================================")

          if "https://jitpack.io" not in s:
              raise SystemExit("ERROR: JitPack was NOT added")

          if "dependencyResolutionManagement" not in s:
              raise SystemExit(
                  "ERROR: dependencyResolutionManagement missing"
              )
          PY


      # --------------------------------------------------
      # 11. ADD LIVEKIT
      # --------------------------------------------------
      - name: Add LiveKit dependency
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

          if "io.livekit:livekit-android" not in s:

              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: dependencies block not found in app/build.gradle"
                  )

              s = s.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

          p.write_text(s)

          print("")
          print("========================================")
          print("LIVEKIT DEPENDENCY")
          print("========================================")
          print(dependency)
          print("========================================")
          PY


      # --------------------------------------------------
      # 12. CREATE NATIVE MAIN ACTIVITY
      # --------------------------------------------------
      - name: Create native MainActivity
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/aimrelax/pubg

          rm -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.java

          cat > android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt <<'KOTLIN'
          package com.aimrelax.pubg

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.webkit.JavascriptInterface

          import com.getcapacitor.BridgeActivity

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          class MainActivity : BridgeActivity() {

              private lateinit var room: Room

              private val SCREEN_CAPTURE_REQUEST = 9001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  room = LiveKit.create(applicationContext)

                  bridge.webView.addJavascriptInterface(
                      AndroidBridge(),
                      "AIMRELAX_NATIVE"
                  )
              }


              inner class AndroidBridge {

                  @JavascriptInterface
                  fun isAndroidApp(): Boolean {
                      return true
                  }


                  @JavascriptInterface
                  fun startLiveKit(
                      serverUrl: String,
                      token: String
                  ) {
                      runOnUiThread {

                          Thread {
                              try {

                                  room.connect(
                                      serverUrl,
                                      token
                                  )

                              } catch (e: Exception) {

                                  e.printStackTrace()
                              }
                          }.start()
                      }
                  }


                  @JavascriptInterface
                  fun startScreenShare() {

                      runOnUiThread {

                          try {

                              val manager =
                                  getSystemService(
                                      MEDIA_PROJECTION_SERVICE
                                  ) as MediaProjectionManager

                              val intent =
                                  manager.createScreenCaptureIntent()

                              startActivityForResult(
                                  intent,
                                  SCREEN_CAPTURE_REQUEST
                              )

                          } catch (e: Exception) {

                              e.printStackTrace()
                          }
                      }
                  }


                  @JavascriptInterface
                  fun stopScreenShare() {

                      runOnUiThread {

                          try {

                              room.localParticipant
                                  .setScreenShareEnabled(false)

                          } catch (e: Exception) {

                              e.printStackTrace()
                          }
                      }
                  }


                  @JavascriptInterface
                  fun disconnectLiveKit() {

                      runOnUiThread {

                          try {

                              room.disconnect()

                          } catch (e: Exception) {

                              e.printStackTrace()
                          }
                      }
                  }
              }


              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == SCREEN_CAPTURE_REQUEST &&
                      resultCode == Activity.RESULT_OK &&
                      data != null
                  ) {

                      try {

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData = data
                              )

                          room.localParticipant
                              .setScreenShareEnabled(
                                  true,
                                  params
                              )

                      } catch (e: Exception) {

                          e.printStackTrace()
                      }
                  }
              }


              override fun onDestroy() {

                  try {
                      room.disconnect()
                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          KOTLIN


      # --------------------------------------------------
      # 13. ANDROID PERMISSIONS
      # --------------------------------------------------
      - name: Add Android permissions
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.CAMERA" />'
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      "<manifest",
                      "<manifest",
                      1
                  )

                  pos = s.find(">")

                  if pos != -1:
                      s = (
                          s[:pos + 1]
                          + "\n    "
                          + permission
                          + s[pos + 1:]
                      )

          p.write_text(s)

          print("===== AndroidManifest.xml =====")
          print(s)
          PY


      # --------------------------------------------------
      # 14. SYNC CAPACITOR
      # --------------------------------------------------
      - name: Sync Android
        run: npx cap sync android


      # --------------------------------------------------
      # 15. VERIFY JITPACK
      # --------------------------------------------------
      - name: Verify Gradle repositories
        run: |
          echo "===== SEARCH JITPACK ====="
          grep -Rni "jitpack.io" android/settings.gradle android/app/build.gradle || true

          echo ""
          echo "===== SEARCH LIVEKIT ====="
          grep -Rni "io.livekit" android/app/build.gradle || true


      # --------------------------------------------------
      # 16. BUILD APK
      # --------------------------------------------------
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace


      # --------------------------------------------------
      # 17. UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK-LIVE
          path: android/app/build/outputs/apk/debug/app-debug.apk
