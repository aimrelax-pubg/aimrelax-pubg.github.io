name: AIMRELAX LIVE Sender APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create project folders
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/aimrelax/live
          mkdir -p android/app/src/main/res/values

      - name: Create settings.gradle
        shell: bash
        run: |
          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven {
                      url = uri("https://jitpack.io")
                  }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
                  maven {
                      url = uri("https://jitpack.io")
                  }
              }
          }

          rootProject.name = "AIMRELAX-LIVE-SENDER"

          include(":app")
          EOF

      - name: Create root build.gradle
        shell: bash
        run: |
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

      - name: Create gradle.properties
        shell: bash
        run: |
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Create app build.gradle
        shell: bash
        run: |
          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aimrelax.live'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimrelax.live'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }

              kotlinOptions {
                  jvmTarget = '21'
              }
          }

          dependencies {
              implementation 'io.livekit:livekit-android:2.28.2'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
          }
          EOF

      - name: Create AndroidManifest.xml
        shell: bash
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="AIMRELAX LIVE Sender"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name="io.livekit.android.room.track.screencapture.ScreenCaptureService"
                      android:foregroundServiceType="mediaProjection"
                      android:exported="false" />

              </application>

          </manifest>
          EOF

      - name: Create styles.xml
        shell: bash
        run: |
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF7A00</item>
                  <item name="android:navigationBarColor">#070707</item>
                  <item name="android:statusBarColor">#070707</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      - name: Create MainActivity.kt
        shell: bash
        run: |
          cat > android/app/src/main/java/com/aimrelax/live/MainActivity.kt <<'EOF'
          package com.aimrelax.live

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          import org.json.JSONObject
          import org.json.JSONTokener

          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {

              companion object {

                  private const val SCREEN_CAPTURE_REQUEST = 9001

                  private const val AIMRELAX_URL =
                      "https://aimrelax-pubg.github.io/"

                  private const val LIVE_TOKEN_URL =
                      "https://hvhlrbfjloiahbqmnrly.supabase.co/functions/v1/live-token"
              }

              private lateinit var room: Room
              private lateinit var status: TextView
              private lateinit var webView: WebView

              private val scope =
                  CoroutineScope(
                      SupervisorJob() + Dispatchers.Main
                  )

              private var supabaseAccessToken: String? = null
              private var liveToken: String? = null
              private var liveServerUrl: String? = null

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  LiveKit.init(applicationContext)

                  room =
                      LiveKit.create(applicationContext)

                  createInterface()
              }

              private fun createInterface() {

                  val root = LinearLayout(this)

                  root.orientation =
                      LinearLayout.VERTICAL

                  root.setBackgroundColor(Color.WHITE)

                  root.setPadding(
                      24,
                      40,
                      24,
                      24
                  )

                  status = TextView(this)

                  status.text =
                      "AIMRELAX LIVE\n\n" +
                      "Մուտք գործիր AIMRELAX account-ով։"

                  status.textSize = 18f

                  status.setTextColor(Color.BLACK)

                  root.addView(
                      status,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  webView = WebView(this)

                  webView.settings.javaScriptEnabled =
                      true

                  webView.settings.domStorageEnabled =
                      true

                  webView.settings.databaseEnabled =
                      true

                  CookieManager
                      .getInstance()
                      .setAcceptCookie(true)

                  CookieManager
                      .getInstance()
                      .setAcceptThirdPartyCookies(
                          webView,
                          true
                      )

                  webView.webViewClient =
                      object : WebViewClient() {

                          override fun onPageFinished(
                              view: WebView?,
                              url: String?
                          ) {

                              super.onPageFinished(
                                  view,
                                  url
                              )

                              status.text =
                                  "AIMRELAX-ը բաց է։\n\n" +
                                  "Մուտք գործիր account-ով։"
                          }
                      }

                  webView.loadUrl(AIMRELAX_URL)

                  root.addView(
                      webView,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  val startButton =
                      Button(this)

                  startButton.text =
                      "🔴 ՍԿՍԵԼ PUBG LIVE"

                  startButton.setOnClickListener {
                      readSupabaseSession()
                  }

                  root.addView(
                      startButton,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  val stopButton =
                      Button(this)

                  stopButton.text =
                      "⏹ STOP LIVE"

                  stopButton.setOnClickListener {
                      stopLive()
                  }

                  root.addView(
                      stopButton,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )

                  setContentView(root)
              }

              private fun readSupabaseSession() {

                  status.text =
                      "🔄 Ստուգում ենք AIMRELAX account-ը..."

                  val javascript =
                      """
                      (function() {

                          try {

                              for (
                                  var i = 0;
                                  i < localStorage.length;
                                  i++
                              ) {

                                  var key =
                                      localStorage.key(i);

                                  if (
                                      key &&
                                      key.indexOf("auth-token") !== -1
                                  ) {

                                      var value =
                                          localStorage.getItem(key);

                                      try {

                                          var data =
                                              JSON.parse(value);

                                          if (
                                              data &&
                                              data.access_token
                                          ) {
                                              return data.access_token;
                                          }

                                          if (
                                              data &&
                                              data.currentSession &&
                                              data.currentSession.access_token
                                          ) {
                                              return data.currentSession.access_token;
                                          }

                                      } catch (e) {
                                      }
                                  }
                              }

                              return "";

                          } catch (e) {

                              return "";
                          }

                      })();
                      """.trimIndent()

                  webView.evaluateJavascript(
                      javascript
                  ) { result ->

                      val token =
                          parseJavascriptString(result)

                      if (token.isNullOrBlank()) {

                          status.text =
                              "❌ AIMRELAX account-ը մուտք գործած չէ։\n\n" +
                              "Նախ մուտք գործիր AIMRELAX-ում։"

                          return@evaluateJavascript
                      }

                      supabaseAccessToken =
                          token

                      status.text =
                          "✅ Account գտնվեց։\n\n" +
                          "Ստանում ենք LiveKit token..."

                      requestLiveToken()
                  }
              }

              private fun parseJavascriptString(
                  value: String?
              ): String? {

                  if (
                      value == null ||
                      value == "null"
                  ) {
                      return null
                  }

                  return try {

                      val parsed =
                          JSONTokener(value)
                              .nextValue()

                      parsed.toString()

                  } catch (_: Exception) {

                      value
                          .removePrefix("\"")
                          .removeSuffix("\"")
                          .replace(
                              "\\\"",
                              "\""
                          )
                          .replace(
                              "\\\\",
                              "\\"
                          )
                  }
              }

              private fun requestLiveToken() {

                  val accessToken =
                      supabaseAccessToken
                          ?: return

                  scope.launch {

                      try {

                          val result =
                              withContext(
                                  Dispatchers.IO
                              ) {

                                  val connection =
                                      URL(
                                          LIVE_TOKEN_URL
                                      )
                                          .openConnection()
                                          as HttpURLConnection

                                  connection.requestMethod =
                                      "POST"

                                  connection.setRequestProperty(
                                      "Authorization",
                                      "Bearer $accessToken"
                                  )

                                  connection.setRequestProperty(
                                      "Content-Type",
                                      "application/json"
                                  )

                                  connection.doOutput =
                                      true

                                  val body =
                                      """
                                      {
                                        "role": "host"
                                      }
                                      """.trimIndent()

                                  connection.outputStream
                                      .use {
                                          it.write(
                                              body.toByteArray(
                                                  Charsets.UTF_8
                                              )
                                          )
                                      }

                                  val code =
                                      connection.responseCode

                                  val stream =
                                      if (
                                          code in 200..299
                                      ) {
                                          connection.inputStream
                                      } else {
                                          connection.errorStream
                                      }

                                  val response =
                                      stream
                                          ?.bufferedReader()
                                          ?.use {
                                              it.readText()
                                          }
                                          ?: ""

                                  Pair(
                                      code,
                                      response
                                  )
                              }

                          if (
                              result.first !in 200..299
                          ) {

                              status.text =
                                  "❌ live-token error\n\n" +
                                  result.second

                              return@launch
                          }

                          parseLiveToken(
                              result.second
                          )

                      } catch (e: Exception) {

                          status.text =
                              "❌ Token error\n\n" +
                              (
                                  e.message
                                      ?: "Unknown error"
                              )
                      }
                  }
              }

              private fun parseLiveToken(
                  response: String
              ) {

                  try {

                      val json =
                          JSONObject(response)

                      liveToken =
                          json.optString(
                              "token",
                              ""
                          )

                      liveServerUrl =
                          json.optString(
                              "serverUrl",
                              ""
                          )

                      if (
                          liveServerUrl.isNullOrBlank()
                      ) {
                          liveServerUrl =
                              json.optString(
                                  "server_url",
                                  ""
                              )
                      }

                      if (
                          liveServerUrl.isNullOrBlank()
                      ) {
                          liveServerUrl =
                              json.optString(
                                  "url",
                                  ""
                              )
                      }

                      if (
                          liveToken.isNullOrBlank()
                      ) {
                          throw Exception(
                              "LiveKit token չկա։"
                          )
                      }

                      if (
                          liveServerUrl.isNullOrBlank()
                      ) {
                          throw Exception(
                              "LiveKit server URL չկա։"
                          )
                      }

                      status.text =
                          "✅ LiveKit token ստացվեց։\n\n" +
                          "Թույլատրիր Screen Capture-ը։"

                      requestScreenCapture()

                  } catch (e: Exception) {

                      status.text =
                          "❌ Token response error\n\n" +
                          (
                              e.message
                                  ?: "Unknown error"
                          ) +
                          "\n\nResponse:\n" +
                          response
                  }
              }

              private fun requestScreenCapture() {

                  val manager =
                      getSystemService(
                          MEDIA_PROJECTION_SERVICE
                      ) as MediaProjectionManager

                  val intent =
                      manager.createScreenCaptureIntent()

                  startActivityForResult(
                      intent,
                      SCREEN_CAPTURE_REQUEST
                  )
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode !=
                      SCREEN_CAPTURE_REQUEST
                  ) {
                      return
                  }

                  if (
                      resultCode != RESULT_OK ||
                      data == null
                  ) {

                      status.text =
                          "❌ Screen Capture-ը չեղարկվեց։"

                      return
                  }

                  status.text =
                      "✅ Screen Capture OK\n\n" +
                      "Միանում ենք LiveKit-ին..."

                  startLive(data)
              }

              private fun startLive(
                  permissionData: Intent
              ) {

                  val token =
                      liveToken

                  val serverUrl =
                      liveServerUrl

                  if (
                      token.isNullOrBlank() ||
                      serverUrl.isNullOrBlank()
                  ) {

                      status.text =
                          "❌ LiveKit տվյալները բացակայում են։"

                      return
                  }

                  scope.launch {

                      try {

                          room.connect(
                              serverUrl,
                              token
                          )

                          status.text =
                              "✅ LiveKit connected\n\n" +
                              "PUBG LIVE-ը սկսվում է..."

                          val success =
                              room.localParticipant
                                  .setScreenShareEnabled(
                                      true,
                                      ScreenCaptureParams(
                                          permissionData
                                      )
                                  )

                          if (!success) {

                              status.text =
                                  "❌ Screen Share-ը չմիացավ։"

                              return@launch
                          }

                          status.text =
                              "🔴 AIMRELAX LIVE ԱՇԽԱՏՈՒՄ Է\n\n" +
                              "PUBG-ի էկրանը ուղարկվում է LiveKit։"

                      } catch (e: Exception) {

                          status.text =
                              "❌ LIVE ERROR\n\n" +
                              (
                                  e.message
                                      ?: e.javaClass.simpleName
                              )
                      }
                  }
              }

              private fun stopLive() {

                  scope.launch {

                      try {

                          room.localParticipant
                              .setScreenShareEnabled(
                                  false
                              )

                      } catch (_: Exception) {
                      }

                      try {

                          room.disconnect()

                      } catch (_: Exception) {
                      }

                      status.text =
                          "LIVE-ը կանգնեցվեց։"
                  }
              }

              override fun onDestroy() {

                  try {
                      room.disconnect()
                  } catch (_: Exception) {
                  }

                  scope.cancel()

                  try {
                      webView.destroy()
                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          cd android

          wget -q \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip

          rm gradle-8.10.2-bin.zip

      - name: Build APK
        shell: bash
        run: |
          cd android

          chmod +x gradle-8.10.2/bin/gradle

          ./gradle-8.10.2/bin/gradle \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/AIMRELAX-LIVE-Sender.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-Sender
          path: output/AIMRELAX-LIVE-Sender.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aimrelax-live-v1
          name: AIMRELAX LIVE Sender v1
          body: |
            AIMRELAX LIVE Sender APK

            Android APK for PUBG Mobile live streaming.
          files: output/AIMRELAX-LIVE-Sender.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
