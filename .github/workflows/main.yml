name: AIMRELAX APK TEST

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare test page
        run: |
          rm -rf www
          mkdir www

          cat > www/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>AIMRELAX TEST</title>
          </head>

          <body style="margin:0;background:#111;color:white;font-family:Arial;text-align:center;padding-top:100px">

            <h1>AIMRELAX APK</h1>

            <h2>WebView TEST OK</h2>

            <p>Եթե սա տեսնում ես, Android APK-ն ճիշտ է բացում HTML-ը։</p>

          </body>
          </html>
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK-TEST
          path: android/app/build/outputs/apk/debug/app-debug.apk
