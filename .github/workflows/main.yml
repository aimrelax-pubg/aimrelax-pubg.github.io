name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # 4. NPM
      # ============================================================
      - name: Initialize npm
        run: npm init -y


      # ============================================================
      # 5. CAPACITOR
      # ============================================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # ============================================================
      # 6. PREPARE WEB FILES
      # ============================================================
      - name: Prepare web files
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/

          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

          echo "===== WWW FILES ====="
          find www -maxdepth 1 -type f -print


      # ============================================================
      # 7. CAPACITOR CONFIG
      # ============================================================
      - name: Create Capacitor config
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json


      # ============================================================
      # 8. ADD ANDROID
      # ============================================================
      - name: Add Android
        run: |
          npx cap add android


      # ============================================================
      # 9. ADD JITPACK
      # ============================================================
      - name: Add JitPack repository
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          text = p.read_text()

          if "https://jitpack.io" not in text:
              text = text.replace(
                  "allprojects {",
                  "allprojects {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url 'https://jitpack.io' }\n    }"
              )

          p.write_text(text)
          PY

          echo "===== android/build.gradle ====="
          cat android/build.gradle


      # ============================================================
      # 10. ADD LIVEKIT
      # ============================================================
      - name: Add LiveKit dependency
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          dependency = 'implementation "io.livekit:livekit-android:2.29.0"'

          if dependency not in text:
              marker = "dependencies {"
              if marker not in text:
                  raise SystemExit("dependencies block not found")

              text = text.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

          p.write_text(text)
          PY

          echo "===== LIVEKIT CHECK ====="
          grep -n "livekit" android/app/build.gradle || true


      # ============================================================
      # 11. CREATE MAIN ACTIVITY
      #
      # IMPORTANT:
      # LiveKit is NOT created in onCreate().
      # Therefore the Capacitor website can start normally.
      # ============================================================
      - name: Create Native MainActivity
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/aimrelax/pubg

          rm -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.java

          cat > android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt <<'KOTLIN'
          package com.aimrelax.pubg

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.webkit.JavascriptInterface

          import com.getcapacitor.BridgeActivity

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          class MainActivity : BridgeActivity() {

              private var room: Room? = null

              private val SCREEN_CAPTURE_REQUEST = 9001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  /*
                   * IMPORTANT:
                   * Do NOT create LiveKit here.
                   *
                   * Capacitor/WebView must start normally first.
                   */

                  bridge.webView.addJavascriptInterface(
                      AndroidBridge(),
                      "AIMRELAX_NATIVE"
                  )
              }


              private fun getLiveKitRoom(): Room {

                  if (room == null) {
                      room = LiveKit.create(applicationContext)
                  }

                  return room!!
              }


              inner class AndroidBridge {

                  @JavascriptInterface
                  fun isAndroidApp(): Boolean {
                      return true
                  }


                  @JavascriptInterface
                  fun startLiveKit(
                      serverUrl: String,
                      token: String
                  ) {

                      Thread {

                          try {

                              val liveRoom = getLiveKitRoom()

                              liveRoom.connect(
                                  serverUrl,
                                  token
                              )

                          } catch (e: Exception) {

                              e.printStackTrace()

                          }

                      }.start()
                  }


                  @JavascriptInterface
                  fun startScreenShare() {

                      runOnUiThread {

                          try {

                              /*
                               * Create LiveKit Room only when
                               * screen sharing is actually requested.
                               */

                              getLiveKitRoom()

                              val manager =
                                  getSystemService(
                                      MEDIA_PROJECTION_SERVICE
                                  ) as MediaProjectionManager

                              val intent =
                                  manager.createScreenCaptureIntent()

                              startActivityForResult(
                                  intent,
                                  SCREEN_CAPTURE_REQUEST
                              )

                          } catch (e: Exception) {

                              e.printStackTrace()

                          }
                      }
                  }


                  @JavascriptInterface
                  fun stopScreenShare() {

                      runOnUiThread {

                          try {

                              room?.localParticipant
                                  ?.setScreenShareEnabled(false)

                          } catch (e: Exception) {

                              e.printStackTrace()

                          }
                      }
                  }


                  @JavascriptInterface
                  fun disconnectLiveKit() {

                      runOnUiThread {

                          try {

                              room?.disconnect()

                          } catch (e: Exception) {

                              e.printStackTrace()

                          }
                      }
                  }
              }


              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == SCREEN_CAPTURE_REQUEST &&
                      resultCode == Activity.RESULT_OK &&
                      data != null
                  ) {

                      try {

                          val liveRoom = getLiveKitRoom()

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData = data
                              )

                          liveRoom.localParticipant
                              .setScreenShareEnabled(
                                  true,
                                  params
                              )

                      } catch (e: Exception) {

                          e.printStackTrace()

                      }
                  }
              }


              override fun onDestroy() {

                  try {

                      room?.disconnect()

                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          KOTLIN


      # ============================================================
      # 12. ANDROID MANIFEST
      # ============================================================
      - name: Configure Android Manifest
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("android/app/src/main/AndroidManifest.xml")

          text = p.read_text()

          # --------------------------------------------------------
          # Android namespace
          # --------------------------------------------------------
          if 'xmlns:android=' not in text:
              text = text.replace(
                  '<manifest',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  1
              )

          # --------------------------------------------------------
          # Permissions
          # --------------------------------------------------------
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />'
          ]

          for perm in permissions:
              if perm not in text:
                  text = text.replace(
                      '>',
                      '>\n    ' + perm,
                      1
                  )

          p.write_text(text)

          # --------------------------------------------------------
          # Validate XML
          # --------------------------------------------------------
          ET.parse(p)

          print("AndroidManifest.xml XML validation: OK")
          PY

          echo "===== ANDROID MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml


      # ============================================================
      # 13. SYNC CAPACITOR
      # ============================================================
      - name: Sync Android
        run: |
          npx cap sync android


      # ============================================================
      # 14. VERIFY WEBSITE INSIDE APK
      # ============================================================
      - name: Verify Web Assets
        run: |
          set -e

          echo "===== CAPACITOR WEB ASSETS ====="

          test -f android/app/src/main/assets/public/index.html

          ls -lh android/app/src/main/assets/public/

          echo "index.html exists inside Android assets."


      # ============================================================
      # 15. VERIFY MAIN ACTIVITY
      # ============================================================
      - name: Verify MainActivity
        run: |
          set -e

          test -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt

          echo "===== MAIN ACTIVITY ====="
          sed -n '1,240p' \
            android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt


      # ============================================================
      # 16. BUILD APK
      # ============================================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      # ============================================================
      # 17. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK-LIVE
          path: android/app/build/outputs/apk/debug/app-debug.apk
