name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. NODE
      # ============================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # 3. JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ============================================================
      # 4. NPM
      # ============================================================
      - name: Initialize npm
        run: npm init -y


      # ============================================================
      # 5. CAPACITOR
      # ============================================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # ============================================================
      # 6. PREPARE REAL AIMRELAX WEBSITE
      # ============================================================
      - name: Prepare web files
        run: |
          set -e

          rm -rf www
          mkdir -p www

          # REAL AIMRELAX WEBSITE
          cp index.html www/

          # Optional files
          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

          echo "===== WWW FILES ====="
          find www -maxdepth 1 -type f -print

          echo "===== INDEX SIZE ====="
          wc -c www/index.html


      # ============================================================
      # 7. CAPACITOR CONFIG
      # ============================================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF

          cat capacitor.config.json


      # ============================================================
      # 8. ADD ANDROID
      # ============================================================
      - name: Add Android
        run: |
          npx cap add android


      # ============================================================
      # 9. CREATE SIMPLE WEBVIEW ACTIVITY
      # ============================================================
      - name: Create WebView MainActivity
        run: |
          set -e

          rm -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.java
          rm -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt

          mkdir -p android/app/src/main/java/com/aimrelax/pubg

          cat > android/app/src/main/java/com/aimrelax/pubg/MainActivity.java <<'JAVA'
          package com.aimrelax.pubg;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  settings.setDatabaseEnabled(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl(
                      "file:///android_asset/public/index.html"
                  );

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA


      # ============================================================
      # 10. MANIFEST
      # ============================================================
      - name: Configure Manifest
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          p = Path("android/app/src/main/AndroidManifest.xml")

          text = p.read_text()

          # Android namespace
          if "xmlns:android=" not in text:
              text = re.sub(
                  r"<manifest\b",
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"',
                  text,
                  count=1
              )

          # Internet permission
          if "android.permission.INTERNET" not in text:

              m = re.search(
                  r"<manifest\b[^>]*>",
                  text,
                  flags=re.DOTALL
              )

              if not m:
                  raise SystemExit("Manifest opening tag not found")

              text = (
                  text[:m.end()]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + text[m.end():]
              )

          p.write_text(text)

          # Validate XML
          ET.parse(p)

          print("Manifest XML: OK")
          PY

          echo "===== MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml


      # ============================================================
      # 11. SYNC
      # ============================================================
      - name: Sync Android
        run: |
          npx cap sync android


      # ============================================================
      # 12. VERIFY REAL WEBSITE
      # ============================================================
      - name: Verify real website
        run: |
          set -e

          echo "===== ANDROID WEB ASSETS ====="

          test -f android/app/src/main/assets/public/index.html

          echo "index.html found."

          wc -c android/app/src/main/assets/public/index.html

          echo "===== FIRST LINES ====="

          head -n 10 \
            android/app/src/main/assets/public/index.html


      # ============================================================
      # 13. VERIFY MAIN ACTIVITY
      # ============================================================
      - name: Verify MainActivity
        run: |
          set -e

          test -f \
            android/app/src/main/java/com/aimrelax/pubg/MainActivity.java

          echo "MainActivity.java found."


      # ============================================================
      # 14. BUILD APK
      # ============================================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      # ============================================================
      # 15. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
