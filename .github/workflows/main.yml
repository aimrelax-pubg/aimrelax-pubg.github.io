name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. NODE
      # ==================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==================================================
      # 3. JAVA
      # ==================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ==================================================
      # 4. NPM
      # ==================================================
      - name: Initialize npm
        run: npm init -y


      # ==================================================
      # 5. CAPACITOR 7
      # ==================================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # ==================================================
      # 6. WEBSITE
      # ==================================================
      - name: Prepare web files
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/

          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

          echo "===== WWW FILES ====="
          find www -maxdepth 1 -type f -print


      # ==================================================
      # 7. CAPACITOR CONFIG
      # ==================================================
      - name: Remove old Capacitor configs
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.js


      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF


      # ==================================================
      # 8. CREATE ANDROID
      # ==================================================
      - name: Add Android
        run: |
          npx cap add android


      # ==================================================
      # 9. JITPACK
      # ==================================================
      - name: Configure JitPack
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          s = p.read_text()

          jitpack = 'maven { url "https://jitpack.io" }'

          if "jitpack.io" not in s:

              allprojects_pos = s.find("allprojects")

              if allprojects_pos == -1:
                  raise SystemExit(
                      "ERROR: allprojects block not found"
                  )

              repositories_pos = s.find(
                  "repositories {",
                  allprojects_pos
              )

              if repositories_pos == -1:
                  raise SystemExit(
                      "ERROR: repositories block not found"
                  )

              insert_pos = repositories_pos + len(
                  "repositories {"
              )

              s = (
                  s[:insert_pos]
                  + "\n        "
                  + jitpack
                  + s[insert_pos:]
              )

          p.write_text(s)

          print("===== android/build.gradle =====")
          print(s)

          if "jitpack.io" not in s:
              raise SystemExit(
                  "ERROR: JitPack was not added"
              )
          PY


      # ==================================================
      # 10. LIVEKIT
      # ==================================================
      - name: Add LiveKit dependency
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dependency = (
              'implementation("io.livekit:livekit-android:2.29.0")'
          )

          if "io.livekit:livekit-android" not in s:

              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: dependencies block not found"
                  )

              s = s.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

          p.write_text(s)

          print("===== LIVEKIT =====")
          print(dependency)
          PY


      # ==================================================
      # 11. MAIN ACTIVITY
      # ==================================================
      - name: Create native MainActivity
        shell: bash
        run: |
          set -e

          mkdir -p \
            android/app/src/main/java/com/aimrelax/pubg

          rm -f \
            android/app/src/main/java/com/aimrelax/pubg/MainActivity.java

          cat > \
            android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt \
            <<'KOTLIN'
          package com.aimrelax.pubg

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.webkit.JavascriptInterface

          import com.getcapacitor.BridgeActivity

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          class MainActivity : BridgeActivity() {

              private lateinit var room: Room

              private val SCREEN_CAPTURE_REQUEST = 9001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  room = LiveKit.create(applicationContext)

                  bridge.webView.addJavascriptInterface(
                      AndroidBridge(),
                      "AIMRELAX_NATIVE"
                  )
              }

              inner class AndroidBridge {

                  @JavascriptInterface
                  fun isAndroidApp(): Boolean {
                      return true
                  }

                  @JavascriptInterface
                  fun startLiveKit(
                      serverUrl: String,
                      token: String
                  ) {
                      Thread {
                          try {
                              room.connect(
                                  serverUrl,
                                  token
                              )
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }.start()
                  }

                  @JavascriptInterface
                  fun startScreenShare() {
                      runOnUiThread {

                          try {

                              val manager =
                                  getSystemService(
                                      MEDIA_PROJECTION_SERVICE
                                  ) as MediaProjectionManager

                              val intent =
                                  manager.createScreenCaptureIntent()

                              startActivityForResult(
                                  intent,
                                  SCREEN_CAPTURE_REQUEST
                              )

                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun stopScreenShare() {
                      runOnUiThread {
                          try {
                              room.localParticipant
                                  .setScreenShareEnabled(false)
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun disconnectLiveKit() {
                      runOnUiThread {
                          try {
                              room.disconnect()
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == SCREEN_CAPTURE_REQUEST &&
                      resultCode == Activity.RESULT_OK &&
                      data != null
                  ) {

                      try {

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData = data
                              )

                          room.localParticipant
                              .setScreenShareEnabled(
                                  true,
                                  params
                              )

                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              override fun onDestroy() {

                  try {
                      room.disconnect()
                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          KOTLIN


      # ==================================================
      # 12. SAFE MANIFEST EDIT
      # ==================================================
      - name: Configure Android Manifest
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          print("===== ORIGINAL MANIFEST =====")
          print(s)
          print("=============================")

          # ------------------------------------------------
          # Find the complete opening <manifest ...> tag.
          # This handles attributes spread over multiple lines.
          # ------------------------------------------------
          match = re.search(
              r'<manifest\b[^>]*>',
              s,
              re.DOTALL
          )

          if not match:
              raise SystemExit(
                  "ERROR: <manifest> opening tag not found"
              )

          manifest_tag = match.group(0)

          # ------------------------------------------------
          # Guarantee Android namespace.
          # ------------------------------------------------
          if "xmlns:android=" not in manifest_tag:

              manifest_tag = manifest_tag[:-1]

              manifest_tag += (
                  ' xmlns:android='
                  '"http://schemas.android.com/apk/res/android">'
              )

          # ------------------------------------------------
          # Remove our permissions if they somehow exist.
          # ------------------------------------------------
          permission_lines = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.CAMERA" />'
          ]

          for line in permission_lines:
              s = s.replace(line, "")

          # ------------------------------------------------
          # Replace only the opening manifest tag.
          # ------------------------------------------------
          s = (
              s[:match.start()]
              + manifest_tag
              + s[match.end():]
          )

          # ------------------------------------------------
          # Insert permissions AFTER the manifest opening tag.
          # ------------------------------------------------
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
          """.strip()

          new_match = re.search(
              r'<manifest\b[^>]*>',
              s,
              re.DOTALL
          )

          insert_position = new_match.end()

          s = (
              s[:insert_position]
              + "\n"
              + permissions
              + "\n"
              + s[insert_position:]
          )

          p.write_text(s)

          print("")
          print("===== FINAL MANIFEST =====")
          print(s)
          print("==========================")

          # ------------------------------------------------
          # Basic required checks
          # ------------------------------------------------
          if "xmlns:android=" not in s:
              raise SystemExit(
                  "ERROR: android namespace missing"
              )

          if "android.permission.INTERNET" not in s:
              raise SystemExit(
                  "ERROR: INTERNET permission missing"
              )

          if "android.permission.RECORD_AUDIO" not in s:
              raise SystemExit(
                  "ERROR: RECORD_AUDIO permission missing"
              )

          if "android.permission.CAMERA" not in s:
              raise SystemExit(
                  "ERROR: CAMERA permission missing"
              )
          PY


      # ==================================================
      # 13. VALIDATE MANIFEST XML
      # ==================================================
      - name: Validate AndroidManifest XML
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import xml.etree.ElementTree as ET

          path = (
              "android/app/src/main/AndroidManifest.xml"
          )

          ET.parse(path)

          print(
              "SUCCESS: AndroidManifest.xml is valid XML"
          )
          PY


      # ==================================================
      # 14. CAPACITOR SYNC
      # ==================================================
      - name: Sync Android
        run: |
          npx cap sync android


      # ==================================================
      # 15. VERIFY
      # ==================================================
      - name: Verify configuration
        shell: bash
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "JITPACK"
          echo "======================================"

          grep -Rni "jitpack.io" \
            android/build.gradle \
            android/settings.gradle \
            android/capacitor.settings.gradle \
            2>/dev/null || true


          echo ""
          echo "======================================"
          echo "LIVEKIT"
          echo "======================================"

          grep -Rni "io.livekit" \
            android/app/build.gradle \
            2>/dev/null || true


          echo ""
          echo "======================================"
          echo "MAIN ACTIVITY"
          echo "======================================"

          test -f \
            android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt

          echo "MainActivity.kt OK"


          echo ""
          echo "======================================"
          echo "MANIFEST"
          echo "======================================"

          grep -n "uses-permission" \
            android/app/src/main/AndroidManifest.xml

          grep -n "xmlns:android" \
            android/app/src/main/AndroidManifest.xml


      # ==================================================
      # 16. BUILD
      # ==================================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace


      # ==================================================
      # 17. UPLOAD
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK-LIVE
          path: android/app/build/outputs/apk/debug/app-debug.apk
