name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

      - name: Remove old Capacitor configs
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.js
          true

      - name: Create Capacitor config
        run: |
          printf '%s\n' \
            '{' \
            '  "appId": "com.aimrelax.pubg",' \
            '  "appName": "AIMRELAX PUBG",' \
            '  "webDir": "www"' \
            '}' > capacitor.config.json

      - name: Verify config
        run: |
          echo "Capacitor config:"
          find . -maxdepth 1 -type f -name 'capacitor.config.*' -print
          cat capacitor.config.json

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
