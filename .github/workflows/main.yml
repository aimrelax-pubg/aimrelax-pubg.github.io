name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Initialize npm
        run: npm init -y

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

      - name: Remove old Capacitor configs
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.js
          true

      - name: Create Capacitor config
        run: |
          printf '%s\n' \
            '{' \
            '  "appId": "com.aimrelax.pubg",' \
            '  "appName": "AIMRELAX PUBG",' \
            '  "webDir": "www"' \
            '}' > capacitor.config.json

      - name: Add Android
        run: |
          npx cap add android

      # --------------------------------------------------
      # ADD JITPACK WITHOUT REPLACING CAPACITOR BUILD FILES
      # --------------------------------------------------

      - name: Add JitPack repository
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle")
          s = p.read_text()

          if "jitpack.io" not in s:

              if "repositories {" in s:
                  first = s.find("repositories {")

                  position = first + len("repositories {")

                  s = (
                      s[:position]
                      + '\n        maven { url = uri("https://jitpack.io") }'
                      + s[position:]
                  )

          p.write_text(s)

          print("===== settings.gradle =====")
          print(p.read_text())
          PY

      # --------------------------------------------------
      # ADD LIVEKIT DEPENDENCY
      # --------------------------------------------------

      - name: Add LiveKit dependency
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

          if dependency not in s:

              if "dependencies {" in s:

                  s = s.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )

              else:

                  s += """

          dependencies {
              implementation("io.livekit:livekit-android:2.29.0")
          }
          """

          p.write_text(s)

          print("===== app/build.gradle LiveKit check =====")

          for line in p.read_text().splitlines():
              if "livekit" in line.lower():
                  print(line)
          PY

      # --------------------------------------------------
      # ANDROID MANIFEST
      # --------------------------------------------------

      - name: Add LiveKit permissions
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]

          for permission in permissions:

              if permission not in s:

                  s = s.replace(
                      "<application",
                      "    " + permission + "\n\n    <application",
                      1
                  )

          service = """
              <service
                  android:name="io.livekit.android.room.track.screencapture.ScreenCaptureService"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="mediaProjection" />
          """

          if "ScreenCaptureService" not in s:

              s = s.replace(
                  "</application>",
                  service + "\n    </application>",
                  1
              )

          p.write_text(s)
          PY

      # --------------------------------------------------
      # NATIVE CAPACITOR ACTIVITY
      # --------------------------------------------------

      - name: Add AIMRELAX LiveKit native bridge
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/aimrelax/pubg

          cat > android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt <<'EOF'
          package com.aimrelax.pubg

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.webkit.JavascriptInterface

          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.lifecycle.lifecycleScope

          import com.getcapacitor.BridgeActivity

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          import kotlinx.coroutines.launch

          class MainActivity : BridgeActivity() {

              private lateinit var room: Room

              private val screenCaptureLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { result ->

                      if (result.resultCode != Activity.RESULT_OK) {
                          return@registerForActivityResult
                      }

                      val data = result.data ?: return@registerForActivityResult

                      publishScreen(data)
                  }

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  room = LiveKit.create(applicationContext)

                  bridge.webView.addJavascriptInterface(
                      NativeBridge(),
                      "AIMRELAX_NATIVE"
                  )
              }

              private fun connectLiveKit(
                  serverUrl: String,
                  token: String
              ) {

                  lifecycleScope.launch {

                      try {

                          room.connect(
                              serverUrl,
                              token
                          )

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-livekit-connected'));"
                          )

                      } catch (e: Exception) {

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-native-error',{detail:{message:${jsString(e.message ?: "LiveKit connection failed")}}}));"
                          )
                      }
                  }
              }

              private fun startScreenCapture() {

                  val manager =
                      getSystemService(
                          MEDIA_PROJECTION_SERVICE
                      ) as MediaProjectionManager

                  screenCaptureLauncher.launch(
                      manager.createScreenCaptureIntent()
                  )
              }

              private fun publishScreen(
                  data: Intent
              ) {

                  lifecycleScope.launch {

                      try {

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData = data
                              )

                          val success =
                              room.localParticipant
                                  .setScreenShareEnabled(
                                      true,
                                      params
                                  )

                          if (success) {

                              sendToWebsite(
                                  "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-started'));"
                              )
                          }

                      } catch (e: Exception) {

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:${jsString(e.message ?: "Screen share failed")}}}));"
                          )
                      }
                  }
              }

              private fun stopScreenCapture() {

                  lifecycleScope.launch {

                      try {

                          room.localParticipant
                              .setScreenShareEnabled(false)

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-stopped'));"
                          )

                      } catch (_: Exception) {
                      }
                  }
              }

              private fun disconnectLiveKit() {

                  lifecycleScope.launch {

                      try {

                          room.disconnect()

                      } catch (_: Exception) {
                      }
                  }
              }

              private fun sendToWebsite(
                  javascript: String
              ) {

                  runOnUiThread {

                      try {

                          bridge.webView.evaluateJavascript(
                              javascript,
                              null
                          )

                      } catch (_: Exception) {
                      }
                  }
              }

              private fun jsString(
                  value: String
              ): String {

                  return "'" +
                      value
                          .replace("\\", "\\\\")
                          .replace("'", "\\'")
                          .replace("\n", "\\n")
                          .replace("\r", "\\r") +
                      "'"
              }

              inner class NativeBridge {

                  @JavascriptInterface
                  fun isAndroidApp(): Boolean {
                      return true
                  }

                  @JavascriptInterface
                  fun startLiveKit(
                      serverUrl: String,
                      token: String
                  ) {

                      runOnUiThread {

                          connectLiveKit(
                              serverUrl,
                              token
                          )
                      }
                  }

                  @JavascriptInterface
                  fun startScreenShare() {

                      runOnUiThread {

                          startScreenCapture()
                      }
                  }

                  @JavascriptInterface
                  fun stopScreenShare() {

                      runOnUiThread {

                          stopScreenCapture()
                      }
                  }

                  @JavascriptInterface
                  fun disconnectLiveKit() {

                      runOnUiThread {

                          disconnectLiveKit()
                      }
                  }
              }

              override fun onDestroy() {

                  try {
                      room.disconnect()
                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          EOF

          rm -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.java

      # --------------------------------------------------
      # SYNC
      # --------------------------------------------------

      - name: Sync Android
        run: |
          npx cap sync android

      # --------------------------------------------------
      # BUILD
      # --------------------------------------------------

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      # --------------------------------------------------
      # UPLOAD
      # --------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK-LIVE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
