name: AIMRELAX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # 2. NODE
      # ==================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==================================================
      # 3. JAVA
      # ==================================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # ==================================================
      # 4. NPM
      # ==================================================
      - name: Initialize npm
        run: npm init -y


      # ==================================================
      # 5. CAPACITOR 7
      # ==================================================
      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7


      # ==================================================
      # 6. WEBSITE FILES
      # ==================================================
      - name: Prepare web files
        shell: bash
        run: |
          set -e

          rm -rf www
          mkdir -p www

          cp index.html www/

          cp sw.js www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true

          echo "===== WWW ====="
          find www -maxdepth 1 -type f -print


      # ==================================================
      # 7. CAPACITOR CONFIG
      # ==================================================
      - name: Remove old Capacitor configs
        run: |
          rm -f capacitor.config.json
          rm -f capacitor.config.js


      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.aimrelax.pubg",
            "appName": "AIMRELAX PUBG",
            "webDir": "www"
          }
          EOF

          echo "===== capacitor.config.json ====="
          cat capacitor.config.json


      # ==================================================
      # 8. CREATE ANDROID
      # ==================================================
      - name: Add Android
        run: |
          npx cap add android


      # ==================================================
      # 9. ADD JITPACK TO THE REAL CAPACITOR
      #    android/build.gradle
      # ==================================================
      - name: Configure JitPack
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          s = p.read_text()

          jitpack = 'maven { url "https://jitpack.io" }'

          print("")
          print("===== ORIGINAL android/build.gradle =====")
          print(s)
          print("==========================================")

          # ------------------------------------------
          # If JitPack already exists, don't duplicate
          # ------------------------------------------
          if "jitpack.io" not in s:

              # --------------------------------------
              # Find allprojects { repositories {
              # --------------------------------------
              allprojects_pos = s.find("allprojects")

              if allprojects_pos == -1:
                  raise SystemExit(
                      "ERROR: allprojects block not found in android/build.gradle"
                  )

              repositories_pos = s.find(
                  "repositories {",
                  allprojects_pos
              )

              if repositories_pos == -1:
                  raise SystemExit(
                      "ERROR: allprojects repositories block not found"
                  )

              insert_pos = repositories_pos + len("repositories {")

              s = (
                  s[:insert_pos]
                  + "\n        "
                  + jitpack
                  + s[insert_pos:]
              )

          p.write_text(s)

          print("")
          print("===== FINAL android/build.gradle =====")
          print(s)
          print("======================================")

          if "jitpack.io" not in s:
              raise SystemExit(
                  "ERROR: JitPack was NOT added"
              )
          PY


      # ==================================================
      # 10. ADD LIVEKIT
      # ==================================================
      - name: Add LiveKit dependency
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          dependency = 'implementation("io.livekit:livekit-android:2.29.0")'

          if "io.livekit:livekit-android" not in s:

              marker = "dependencies {"

              if marker not in s:
                  raise SystemExit(
                      "ERROR: dependencies block not found in android/app/build.gradle"
                  )

              s = s.replace(
                  marker,
                  marker + "\n    " + dependency,
                  1
              )

          p.write_text(s)

          print("")
          print("===== LIVEKIT DEPENDENCY =====")
          print(dependency)
          print("==============================")
          PY


      # ==================================================
      # 11. NATIVE MAIN ACTIVITY
      # ==================================================
      - name: Create native MainActivity
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/aimrelax/pubg

          rm -f android/app/src/main/java/com/aimrelax/pubg/MainActivity.java

          cat > android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt <<'KOTLIN'
          package com.aimrelax.pubg

          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.webkit.JavascriptInterface

          import com.getcapacitor.BridgeActivity

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          class MainActivity : BridgeActivity() {

              private lateinit var room: Room

              private val SCREEN_CAPTURE_REQUEST = 9001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  room = LiveKit.create(applicationContext)

                  bridge.webView.addJavascriptInterface(
                      AndroidBridge(),
                      "AIMRELAX_NATIVE"
                  )
              }


              inner class AndroidBridge {

                  @JavascriptInterface
                  fun isAndroidApp(): Boolean {
                      return true
                  }


                  @JavascriptInterface
                  fun startLiveKit(
                      serverUrl: String,
                      token: String
                  ) {
                      runOnUiThread {

                          Thread {
                              try {

                                  room.connect(
                                      serverUrl,
                                      token
                                  )

                              } catch (e: Exception) {

                                  e.printStackTrace()
                              }
                          }.start()
                      }
                  }


                  @JavascriptInterface
                  fun startScreenShare() {

                      runOnUiThread {

                          try {

                              val manager =
                                  getSystemService(
                                      MEDIA_PROJECTION_SERVICE
                                  ) as MediaProjectionManager

                              val intent =
                                  manager.createScreenCaptureIntent()

                              startActivityForResult(
                                  intent,
                                  SCREEN_CAPTURE_REQUEST
                              )

                          } catch (e: Exception) {

                              e.printStackTrace()
                          }
                      }
                  }


                  @JavascriptInterface
                  fun stopScreenShare() {

                      runOnUiThread {

                          try {

                              room.localParticipant
                                  .setScreenShareEnabled(false)

                          } catch (e: Exception) {

                              e.printStackTrace()
                          }
                      }
                  }


                  @JavascriptInterface
                  fun disconnectLiveKit() {

                      runOnUiThread {

                          try {

                              room.disconnect()

                          } catch (e: Exception) {

                              e.printStackTrace()
                          }
                      }
                  }
              }


              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode == SCREEN_CAPTURE_REQUEST &&
                      resultCode == Activity.RESULT_OK &&
                      data != null
                  ) {

                      try {

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData = data
                              )

                          room.localParticipant
                              .setScreenShareEnabled(
                                  true,
                                  params
                              )

                      } catch (e: Exception) {

                          e.printStackTrace()
                      }
                  }
              }


              override fun onDestroy() {

                  try {
                      room.disconnect()
                  } catch (_: Exception) {
                  }

                  super.onDestroy()
              }
          }
          KOTLIN


      # ==================================================
      # 12. ANDROID PERMISSIONS
      # ==================================================
      - name: Add Android permissions
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.CAMERA" />'
          ]

          manifest_end = s.find(">")

          if manifest_end == -1:
              raise SystemExit(
                  "ERROR: AndroidManifest.xml is invalid"
              )

          for permission in permissions:

              if permission not in s:

                  s = (
                      s[:manifest_end + 1]
                      + "\n    "
                      + permission
                      + s[manifest_end + 1:]
                  )

                  manifest_end += (
                      len(permission) + 5
                  )

          p.write_text(s)

          print("")
          print("===== AndroidManifest.xml =====")
          print(s)
          print("===============================")
          PY


      # ==================================================
      # 13. CAPACITOR SYNC
      # ==================================================
      - name: Sync Android
        run: |
          npx cap sync android


      # ==================================================
      # 14. VERIFY EVERYTHING
      # ==================================================
      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "JITPACK"
          echo "=========================================="

          grep -Rni "jitpack.io" \
            android/build.gradle \
            android/settings.gradle \
            android/capacitor.settings.gradle \
            2>/dev/null || true


          echo ""
          echo "=========================================="
          echo "LIVEKIT"
          echo "=========================================="

          grep -Rni "io.livekit" \
            android/app/build.gradle \
            2>/dev/null || true


          echo ""
          echo "=========================================="
          echo "MAIN ACTIVITY"
          echo "=========================================="

          test -f \
            android/app/src/main/java/com/aimrelax/pubg/MainActivity.kt

          echo "MainActivity.kt exists"


          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          ls -la android


      # ==================================================
      # 15. BUILD APK
      # ==================================================
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace


      # ==================================================
      # 16. UPLOAD APK
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-APK-LIVE
          path: android/app/build/outputs/apk/debug/app-debug.apk
