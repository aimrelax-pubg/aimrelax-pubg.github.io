name: Build AIMRELAX LIVE APK

on:
workflow_dispatch:
push:
paths:
- ".github/workflows/build-live-apk.yml"

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup JDK 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Create Android project
    shell: bash
    run: |
      set -e

      mkdir -p app/src/main/java/com/aimrelax/live
      mkdir -p app/src/main/res/values

      cat > settings.gradle <<'EOF'

pluginManagement {
repositories {
google()
mavenCentral()
gradlePluginPortal()
}
}

dependencyResolutionManagement {
repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
repositories {
google()
mavenCentral()
maven { url = uri("https://jitpack.io") }
}
}

rootProject.name = "AIMRELAX-LIVE"
include(":app")
EOF

      cat > build.gradle <<'EOF'

plugins {
id 'com.android.application' version '8.7.3' apply false
id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
EOF

      cat > gradle.properties <<'EOF'

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
EOF

      cat > app/build.gradle <<'EOF'

plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}

android {
namespace 'com.aimrelax.live'
compileSdk 35

defaultConfig {
    applicationId 'com.aimrelax.live'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '1.0'
}

}

dependencies {
implementation 'androidx.core:core-ktx:1.15.0'
implementation 'androidx.activity:activity-ktx:1.10.1'
implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

implementation 'io.livekit:livekit-android:2.29.0'

}
EOF

      cat > app/src/main/res/values/strings.xml <<'EOF'

<resources>
    <string name="app_name">AIMRELAX LIVE</string>
</resources>
EOF      cat > app/src/main/res/values/colors.xml <<'EOF'

<resources>
    <color name="black">#070707</color>
    <color name="orange">#FF7200</color>
    <color name="white">#FFFFFF</color>
</resources>
EOF      cat > app/src/main/res/values/themes.xml <<'EOF'

<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#FF7200</item>
        <item name="android:navigationBarColor">#070707</item>
        <item name="android:statusBarColor">#070707</item>
        <item name="android:windowLightStatusBar">false</item>
    </style>
</resources>
EOF      cat > app/src/main/AndroidManifest.xml <<'EOF'

<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET" />
<uses-permission android:name="android.permission.RECORD_AUDIO" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

<application
    android:allowBackup="false"
    android:label="@string/app_name"
    android:theme="@style/AppTheme"
    android:usesCleartextTraffic="false">

    <activity
        android:name=".MainActivity"
        android:exported="true">

        <intent-filter>
            <action android:name="android.intent.action.MAIN" />
            <category android:name="android.intent.category.LAUNCHER" />
        </intent-filter>

    </activity>

    <service
        android:name="io.livekit.android.room.track.screencapture.ScreenCaptureService"
