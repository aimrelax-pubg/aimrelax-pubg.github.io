name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android-app/app/src/main/java/com/aimrelax/live
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/xml

          cat > android-app/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }

          rootProject.name = "AIMRELAX-LIVE"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aimrelax.live'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimrelax.live'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles(
                          getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
                      )
                  }

                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity-ktx:1.10.0'

              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

              implementation 'io.livekit:livekit-android:2.29.0'
          }
          EOF

          cat > android-app/app/proguard-rules.pro <<'EOF'
          # AIMRELAX LIVE
          EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AIMRELAX</string>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.AIMRELAX" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#050505</item>
                  <item name="android:navigationBarColor">#050505</item>
                  <item name="android:colorAccent">#ff7200</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="false"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AIMRELAX"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/aimrelax/live/MainActivity.kt <<'EOF'
          package com.aimrelax.live

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.ScreenCaptureParams
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.launch

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var room: Room? = null

              private val scope =
                  CoroutineScope(SupervisorJob() + Dispatchers.Main)

              private val permissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) {
                      // Permissions are requested before native LIVE use.
                  }

              private val screenCaptureLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { result ->

                      if (result.resultCode != Activity.RESULT_OK) {
                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-cancelled'));"
                          )
                          return@registerForActivityResult
                      }

                      val data = result.data ?: return@registerForActivityResult

                      startNativeScreenShare(data)
                  }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK

                  val root = FrameLayout(this)

                  webView = WebView(this)

                  root.addView(
                      webView,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  setContentView(root)

                  setupWebView()

                  requestMediaPermissions()

                  webView.loadUrl(
                      "https://aimrelax-pubg.github.io/"
                  )
              }

              private fun setupWebView() {

                  webView.setBackgroundColor(Color.BLACK)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true

                      mediaPlaybackRequiresUserGesture = false

                      allowFileAccess = false
                      allowContentAccess = true

                      mixedContentMode =
                          WebSettings.MIXED_CONTENT_NEVER_ALLOW

                      userAgentString =
                          "$userAgentString AIMRELAX-Android"
                  }

                  CookieManager
                      .getInstance()
                      .setAcceptCookie(true)

                  CookieManager
                      .getInstance()
                      .setAcceptThirdPartyCookies(
                          webView,
                          true
                      )

                  webView.webChromeClient =
                      object : WebChromeClient() {

                          override fun onPermissionRequest(
                              request: android.webkit.PermissionRequest
                          ) {
                              runOnUiThread {
                                  request.grant(
                                      request.resources
                                  )
                              }
                          }
                      }

                  webView.webViewClient =
                      object : WebViewClient() {

                          override fun shouldOverrideUrlLoading(
                              view: WebView,
                              request: WebResourceRequest
                          ): Boolean {

                              val url =
                                  request.url.toString()

                              return if (
                                  url.startsWith(
                                      "https://aimrelax-pubg.github.io/"
                                  ) ||
                                  url.startsWith(
                                      "https://hvhlrbfjloiahbqmnrly.supabase.co/"
                                  )
                              ) {
                                  false
                              } else {
                                  false
                              }
                          }

                          override fun onPageFinished(
                              view: WebView,
                              url: String
                          ) {
                              super.onPageFinished(
                                  view,
                                  url
                              )

                              injectNativeBridge()
                          }
                      }
              }

              private fun injectNativeBridge() {

                  val js = """
                      (function(){
                          window.AIMRELAX_NATIVE = {
                              isAndroid: true,

                              startScreenShare: function(){
                                  window.location.href =
                                      'aimrelax-native://start-screen-share';
                              },

                              stopScreenShare: function(){
                                  window.location.href =
                                      'aimrelax-native://stop-screen-share';
                              }
                          };

                          window.dispatchEvent(
                              new CustomEvent(
                                  'aimrelax-native-ready'
                              )
                          );
                      })();
                  """.trimIndent()

                  webView.evaluateJavascript(
                      js,
                      null
                  )
              }

              private fun requestMediaPermissions() {

                  val permissions =
                      mutableListOf<String>()

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      permissions.add(
                          Manifest.permission.RECORD_AUDIO
                      )
                  }

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      permissions.add(
                          Manifest.permission.CAMERA
                      )
                  }

                  if (permissions.isNotEmpty()) {
                      permissionLauncher.launch(
                          permissions.toTypedArray()
                      )
                  }
              }

              private fun startNativeScreenShare() {

                  val manager =
                      getSystemService(
                          MEDIA_PROJECTION_SERVICE
                      ) as android.media.projection.MediaProjectionManager

                  screenCaptureLauncher.launch(
                      manager.createScreenCaptureIntent()
                  )
              }

              private fun startNativeScreenShare(
                  permissionData: Intent
              ) {

                  if (room == null) {
                      sendToWebsite(
                          "window.dispatchEvent(new CustomEvent('aimrelax-live-error',{detail:'LiveKit room is not connected'}));"
                      )
                      return
                  }

                  scope.launch {

                      try {

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData =
                                      permissionData
                              )

                          val success =
                              room!!
                                  .localParticipant
                                  .setScreenShareEnabled(
                                      true,
                                      params
                                  )

                          if (success) {

                              sendToWebsite(
                                  "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-started'));"
                              )

                          } else {

                              sendToWebsite(
                                  "window.dispatchEvent(new CustomEvent('aimrelax-live-error',{detail:'Screen share failed'}));"
                              )
                          }

                      } catch (e: Exception) {

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-live-error',{detail:${org.json.JSONObject.quote(e.message ?: "Screen share error")}}));"
                          )
                      }
                  }
              }

              private fun stopNativeScreenShare() {

                  scope.launch {

                      try {

                          room
                              ?.localParticipant
                              ?.setScreenShareEnabled(
                                  false
                              )

                          sendToWebsite(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-stopped'));"
                          )

                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }
              }

              private fun sendToWebsite(
                  javascript: String
              ) {

                  runOnUiThread {

                      webView.evaluateJavascript(
                          javascript,
                          null
                      )
                  }
              }

              override fun onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {

                  try {
                      room?.disconnect()
                  } catch (_: Exception) {
                  }

                  scope.cancel()

                  webView.destroy()

                  super.onDestroy()
              }

              private fun handleNativeUrl(
                  url: String
              ): Boolean {

                  return when {

                      url ==
                          "aimrelax-native://start-screen-share" -> {

                          startNativeScreenShare()

                          webView.loadUrl(
                              "javascript:void(0)"
                          )

                          true
                      }

                      url ==
                          "aimrelax-native://stop-screen-share" -> {

                          stopNativeScreenShare()

                          webView.loadUrl(
                              "javascript:void(0)"
                          )

                          true
                      }

                      else -> false
                  }
              }
          }
          EOF

      - name: Fix native URL bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android-app/app/src/main/java/com/aimrelax/live/MainActivity.kt"
          )

          s = p.read_text()

          old = """override fun shouldOverrideUrlLoading(
                              view: WebView,
                              request: WebResourceRequest
                          ): Boolean {

                              val url =
                                  request.url.toString()

                              return if (
                                  url.startsWith(
                                      "https://aimrelax-pubg.github.io/"
                                  ) ||
                                  url.startsWith(
                                      "https://hvhlrbfjloiahbqmnrly.supabase.co/"
                                  )
                              ) {
                                  false
                              } else {
                                  false
                              }
                          }"""

          new = """override fun shouldOverrideUrlLoading(
                              view: WebView,
                              request: WebResourceRequest
                          ): Boolean {

                              val url =
                                  request.url.toString()

                              if (handleNativeUrl(url)) {
                                  return true
                              }

                              return false
                          }"""

          if old not in s:
              raise SystemExit(
                  "WebView URL bridge block not found"
              )

          p.write_text(
              s.replace(old, new)
          )
          PY

      - name: Add missing coroutine import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android-app/app/src/main/java/com/aimrelax/live/MainActivity.kt"
          )

          s = p.read_text()

          if "import kotlinx.coroutines.cancel" not in s:
              s = s.replace(
                  "import kotlinx.coroutines.launch",
                  "import kotlinx.coroutines.launch\nimport kotlinx.coroutines.cancel"
              )

          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.10.2
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
