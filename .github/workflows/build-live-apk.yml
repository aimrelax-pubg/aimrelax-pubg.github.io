name: Build AIMRELAX LIVE APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AIMRELAX LIVE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android-app/app/src/main/java/com/aimrelax/live
          mkdir -p android-app/app/src/main/res/values

          cat > android-app/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }

          rootProject.name = "AIMRELAX-LIVE"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
              id "org.jetbrains.kotlin.android" version "2.0.21" apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
              namespace "com.aimrelax.live"
              compileSdk 35

              defaultConfig {
                  applicationId "com.aimrelax.live"
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName "1.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation "io.livekit:livekit-android:2.29.0"

              implementation "androidx.core:core-ktx:1.15.0"

              implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
          }
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#ff6600</item>
                  <item name="android:navigationBarColor">#080808</item>
                  <item name="android:statusBarColor">#080808</item>

              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="AIMRELAX LIVE"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/aimrelax/live/MainActivity.kt <<'EOF'
          package com.aimrelax.live

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext

          import org.json.JSONObject

          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.UUID

          class MainActivity : Activity() {

              companion object {

                  private const val SUPABASE_URL =
                      "https://hvhlrbfjloiahbqmnrly.supabase.co"

                  private const val SUPABASE_ANON_KEY =
                      "sb_publishable_EcZUkLdUCVv3qWDD7jlvhg_OjTYu1jA"

                  private const val TOKEN_URL =
                      "$SUPABASE_URL/functions/v1/live-token"

                  private const val REQUEST_SCREEN_CAPTURE = 5001
                  private const val REQUEST_MIC = 5002
                  private const val REQUEST_NOTIFICATION = 5003
              }

              private val scope =
                  CoroutineScope(
                      SupervisorJob() + Dispatchers.Main
                  )

              private lateinit var emailInput: EditText
              private lateinit var passwordInput: EditText
              private lateinit var titleInput: EditText
              private lateinit var statusText: TextView

              private lateinit var loginButton: Button
              private lateinit var startButton: Button
              private lateinit var stopButton: Button

              private var accessToken: String? = null
              private var room: Room? = null
              private var roomName: String? = null

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  buildUi()

                  if (
                      android.os.Build.VERSION.SDK_INT >= 33 &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(
                              Manifest.permission.POST_NOTIFICATIONS
                          ),
                          REQUEST_NOTIFICATION
                      )
                  }
              }

              private fun buildUi() {

                  val root = LinearLayout(this)

                  root.orientation =
                      LinearLayout.VERTICAL

                  root.setPadding(
                      35,
                      45,
                      35,
                      35
                  )

                  root.setBackgroundColor(
                      android.graphics.Color.rgb(
                          8,
                          8,
                          8
                      )
                  )

                  val scroll = ScrollView(this)

                  scroll.addView(root)

                  val title = TextView(this)

                  title.text =
                      "AIMRELAX LIVE"

                  title.textSize = 30f

                  title.setTextColor(
                      android.graphics.Color.rgb(
                          255,
                          102,
                          0
                      )
                  )

                  title.gravity =
                      Gravity.CENTER

                  title.setPadding(
                      0,
                      0,
                      0,
                      35
                  )

                  root.addView(title)

                  emailInput =
                      EditText(this)

                  emailInput.hint =
                      "Email"

                  emailInput.setTextColor(
                      android.graphics.Color.WHITE
                  )

                  emailInput.setHintTextColor(
                      android.graphics.Color.GRAY
                  )

                  emailInput.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_VARIATION_EMAIL_ADDRESS

                  root.addView(emailInput)

                  passwordInput =
                      EditText(this)

                  passwordInput.hint =
                      "Password"

                  passwordInput.setTextColor(
                      android.graphics.Color.WHITE
                  )

                  passwordInput.setHintTextColor(
                      android.graphics.Color.GRAY
                  )

                  passwordInput.inputType =
                      android.text.InputType.TYPE_CLASS_TEXT or
                      android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD

                  root.addView(passwordInput)

                  loginButton =
                      Button(this)

                  loginButton.text =
                      "LOGIN"

                  root.addView(loginButton)

                  titleInput =
                      EditText(this)

                  titleInput.hint =
                      "LIVE title"

                  titleInput.setText(
                      "AIMRELAX PUBG LIVE"
                  )

                  titleInput.setTextColor(
                      android.graphics.Color.WHITE
                  )

                  titleInput.setHintTextColor(
                      android.graphics.Color.GRAY
                  )

                  titleInput.visibility =
                      View.GONE

                  root.addView(titleInput)

                  startButton =
                      Button(this)

                  startButton.text =
                      "🟢 START LIVE"

                  startButton.visibility =
                      View.GONE

                  root.addView(startButton)

                  stopButton =
                      Button(this)

                  stopButton.text =
                      "⛔ STOP LIVE"

                  stopButton.visibility =
                      View.GONE

                  root.addView(stopButton)

                  statusText =
                      TextView(this)

                  statusText.text =
                      "Մուտք գործիր AIMRELAX account-ով"

                  statusText.textSize =
                      17f

                  statusText.setTextColor(
                      android.graphics.Color.WHITE
                  )

                  statusText.setPadding(
                      0,
                      30,
                      0,
                      10
                  )

                  root.addView(statusText)

                  setContentView(scroll)

                  loginButton.setOnClickListener {
                      login()
                  }

                  startButton.setOnClickListener {
                      startLive()
                  }

                  stopButton.setOnClickListener {
                      stopLive()
                  }
              }

              private fun login() {

                  val email =
                      emailInput.text
                          .toString()
                          .trim()

                  val password =
                      passwordInput.text
                          .toString()

                  if (
                      email.isEmpty() ||
                      password.isEmpty()
                  ) {

                      statusText.text =
                          "Մուտքագրիր email-ը և password-ը"

                      return
                  }

                  loginButton.isEnabled =
                      false

                  statusText.text =
                      "Մուտք..."

                  scope.launch {

                      try {

                          val token =
                              supabaseLogin(
                                  email,
                                  password
                              )

                          accessToken =
                              token

                          loginButton.visibility =
                              View.GONE

                          emailInput.visibility =
                              View.GONE

                          passwordInput.visibility =
                              View.GONE

                          titleInput.visibility =
                              View.VISIBLE

                          startButton.visibility =
                              View.VISIBLE

                          statusText.text =
                              "✅ Մուտքը հաջող է։ Կարող ես սկսել LIVE-ը։"

                      } catch (e: Exception) {

                          statusText.text =
                              "❌ Մուտքի սխալ: ${e.message}"

                          loginButton.isEnabled =
                              true
                      }
                  }
              }

              private suspend fun supabaseLogin(
                  email: String,
                  password: String
              ): String =
                  withContext(Dispatchers.IO) {

                      val url =
                          URL(
                              "$SUPABASE_URL/auth/v1/token?grant_type=password"
                          )

                      val connection =
                          url.openConnection()
                              as HttpURLConnection

                      connection.requestMethod =
                          "POST"

                      connection.doOutput =
                          true

                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json"
                      )

                      connection.setRequestProperty(
                          "apikey",
                          SUPABASE_ANON_KEY
                      )

                      val body =
                          JSONObject()
                              .put(
                                  "email",
                                  email
                              )
                              .put(
                                  "password",
                                  password
                              )
                              .toString()

                      connection.outputStream.use {
                          it.write(
                              body.toByteArray()
                          )
                      }

                      val code =
                          connection.responseCode

                      val stream =
                          if (code in 200..299)
                              connection.inputStream
                          else
                              connection.errorStream

                      val response =
                          stream.bufferedReader()
                              .use {
                                  it.readText()
                              }

                      if (code !in 200..299) {

                          throw Exception(
                              JSONObject(response)
                                  .optString(
                                      "error_description",
                                      "Login failed"
                                  )
                          )
                      }

                      JSONObject(response)
                          .getString(
                              "access_token"
                          )
                  }

              private fun startLive() {

                  val token =
                      accessToken

                  if (token == null) {

                      statusText.text =
                          "Նախ մուտք գործիր"

                      return
                  }

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {

                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(
                              Manifest.permission.RECORD_AUDIO
                          ),
                          REQUEST_MIC
                      )

                      statusText.text =
                          "Թույլ տուր microphone-ը և նորից սեղմիր START LIVE"

                      return
                  }

                  roomName =
                      "aimrelax-${UUID.randomUUID()}"

                  statusText.text =
                      "LIVE room-ի ստեղծում..."

                  scope.launch {

                      try {

                          createLiveRow(
                              token
                          )

                          val tokenData =
                              requestLiveKitToken(
                                  token,
                                  roomName!!
                              )

                          room =
                              LiveKit.create(
                                  applicationContext
                              )

                          room!!.connect(
                              tokenData.first,
                              tokenData.second
                          )

                          room!!
                              .localParticipant
                              .setMicrophoneEnabled(
                                  true
                              )

                          startButton.visibility =
                              View.GONE

                          stopButton.visibility =
                              View.VISIBLE

                          statusText.text =
                              "🟢 LIVE պատրաստ է։ Ընտրիր Share Screen-ը։"

                          requestScreenCapture()

                      } catch (e: Exception) {

                          statusText.text =
                              "❌ LIVE error: ${e.message}"

                          deleteLiveRow(
                              token
                          )
                      }
                  }
              }

              private fun requestScreenCapture() {

                  val manager =
                      getSystemService(
                          Context.MEDIA_PROJECTION_SERVICE
                      ) as MediaProjectionManager

                  val intent =
                      manager.createScreenCaptureIntent()

                  startActivityForResult(
                      intent,
                      REQUEST_SCREEN_CAPTURE
                  )
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  )

                  if (
                      requestCode !=
                      REQUEST_SCREEN_CAPTURE
                  ) {
                      return
                  }

                  if (
                      resultCode != RESULT_OK ||
                      data == null
                  ) {

                      statusText.text =
                          "❌ Screen sharing-ը չեղարկվեց"

                      return
                  }

                  val permissionData =
                      data

                  scope.launch {

                      try {

                          val params =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData =
                                      permissionData
                              )

                          val success =
                              room!!
                                  .localParticipant
                                  .setScreenShareEnabled(
                                      true,
                                      params
                                  )

                          if (success) {

                              statusText.text =
                                  "🔴 LIVE — PUBG-ի էկրանը հեռարձակվում է"

                          } else {

                              statusText.text =
                                  "❌ Screen share-ը չհաջողվեց սկսել"
                          }

                      } catch (e: Exception) {

                          statusText.text =
                              "❌ Screen share error: ${e.message}"
                      }
                  }
              }

              private suspend fun createLiveRow(
                  token: String
              ) = withContext(Dispatchers.IO) {

                  val roomValue =
                      roomName
                          ?: throw Exception(
                              "Room name missing"
                          )

                  val url =
                      URL(
                          "$SUPABASE_URL/rest/v1/live_streams"
                      )

                  val connection =
                      url.openConnection()
                          as HttpURLConnection

                  connection.requestMethod =
                      "POST"

                  connection.doOutput =
                      true

                  connection.setRequestProperty(
                      "Content-Type",
                      "application/json"
                  )

                  connection.setRequestProperty(
                      "apikey",
                      SUPABASE_ANON_KEY
                  )

                  connection.setRequestProperty(
                      "Authorization",
                      "Bearer $token"
                  )

                  connection.setRequestProperty(
                      "Prefer",
                      "return=representation"
                  )

                  val body =
                      JSONObject()
                          .put(
                              "title",
                              titleInput.text
                                  .toString()
                                  .trim()
                                  .ifEmpty {
                                      "AIMRELAX PUBG LIVE"
                                  }
                          )
                          .put(
                              "room_name",
                              roomValue
                          )
                          .put(
                              "status",
                              "live"
                          )
                          .toString()

                  connection.outputStream.use {
                      it.write(
                          body.toByteArray()
                      )
                  }

                  val code =
                      connection.responseCode

                  val stream =
                      if (code in 200..299)
                          connection.inputStream
                      else
                          connection.errorStream

                  val response =
                      stream.bufferedReader()
                          .use {
                              it.readText()
                          }

                  if (code !in 200..299) {
                      throw Exception(response)
                  }
              }

              private suspend fun requestLiveKitToken(
                  authToken: String,
                  room: String
              ): Pair<String, String> =
                  withContext(Dispatchers.IO) {

                      val url =
                          URL(TOKEN_URL)

                      val connection =
                          url.openConnection()
                              as HttpURLConnection

                      connection.requestMethod =
                          "POST"

                      connection.doOutput =
                          true

                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json"
                      )

                      connection.setRequestProperty(
                          "Authorization",
                          "Bearer $authToken"
                      )

                      connection.setRequestProperty(
                          "apikey",
                          SUPABASE_ANON_KEY
                      )

                      val body =
                          JSONObject()
                              .put(
                                  "room_name",
                                  room
                              )
                              .put(
                                  "participant_name",
                                  "AIMRELAX LIVE"
                              )
                              .put(
                                  "role",
                                  "host"
                              )
                              .toString()

                      connection.outputStream.use {
                          it.write(
                              body.toByteArray()
                          )
                      }

                      val code =
                          connection.responseCode

                      val stream =
                          if (code in 200..299)
                              connection.inputStream
                          else
                              connection.errorStream

                      val response =
                          stream.bufferedReader()
                              .use {
                                  it.readText()
                              }

                      if (code !in 200..299) {
                          throw Exception(response)
                      }

                      val json =
                          JSONObject(response)

                      Pair(
                          json.getString(
                              "server_url"
                          ),
                          json.getString(
                              "participant_token"
                          )
                      )
                  }

              private fun stopLive() {

                  val token =
                      accessToken

                  scope.launch {

                      try {

                          room
                              ?.localParticipant
                              ?.setScreenShareEnabled(
                                  false
                              )

                      } catch (_: Exception) {
                      }

                      try {
                          room?.disconnect()
                      } catch (_: Exception) {
                      }

                      room = null

                      if (token != null) {
                          updateLiveRow(token)
                      }

                      stopButton.visibility =
                          View.GONE

                      startButton.visibility =
                          View.VISIBLE

                      titleInput.isEnabled =
                          true

                      statusText.text =
                          "⛔ LIVE ավարտվեց"
                  }
              }

              private suspend fun updateLiveRow(
                  token: String
              ) = withContext(Dispatchers.IO) {

                  val roomValue =
                      roomName
                          ?: return@withContext

                  val url =
                      URL(
                          "$SUPABASE_URL/rest/v1/live_streams" +
                              "?room_name=eq.$roomValue"
                      )

                  val connection =
                      url.openConnection()
                          as HttpURLConnection

                  connection.requestMethod =
                      "PATCH"

                  connection.doOutput =
                      true

                  connection.setRequestProperty(
                      "Content-Type",
                      "application/json"
                  )

                  connection.setRequestProperty(
                      "apikey",
                      SUPABASE_ANON_KEY
                  )

                  connection.setRequestProperty(
                      "Authorization",
                      "Bearer $token"
                  )

                  val body =
                      JSONObject()
                          .put(
                              "status",
                              "ended"
                          )
                          .put(
                              "ended_at",
                              java.time.Instant
                                  .now()
                                  .toString()
                          )
                          .toString()

                  connection.outputStream.use {
                      it.write(
                          body.toByteArray()
                      )
                  }

                  connection.responseCode
              }

              private suspend fun deleteLiveRow(
                  token: String
              ) = withContext(Dispatchers.IO) {

                  val roomValue =
                      roomName
                          ?: return@withContext

                  try {

                      val url =
                          URL(
                              "$SUPABASE_URL/rest/v1/live_streams" +
                                  "?room_name=eq.$roomValue"
                      )

                      val connection =
                          url.openConnection()
                              as HttpURLConnection

                      connection.requestMethod =
                          "DELETE"

                      connection.setRequestProperty(
                          "apikey",
                          SUPABASE_ANON_KEY
                      )

                      connection.setRequestProperty(
                          "Authorization",
                          "Bearer $token"
                      )

                      connection.responseCode

                  } catch (_: Exception) {
                  }
              }

              override fun onDestroy() {

                  try {
                      room?.disconnect()
                      room?.release()
                  } catch (_: Exception) {
                  }

                  scope.cancel()

                  super.onDestroy()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.9

      - name: Build APK
        working-directory: android-app
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-LIVE-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
