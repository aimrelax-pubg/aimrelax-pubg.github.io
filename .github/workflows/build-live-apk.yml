name: Build AIMRELAX LIVE Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android-app/app/src/main/java/com/aimrelax/live
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/xml

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          EOF

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = uri("https://jitpack.io") }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }

          rootProject.name = "AIMRELAX-LIVE"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aimrelax.live'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimrelax.live'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles(
                          getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity:1.10.1")
              implementation("androidx.activity:activity-ktx:1.10.1")
              implementation("androidx.appcompat:appcompat:1.7.0")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")

              implementation("io.livekit:livekit-android:2.29.0")
          }
          EOF

          cat > android-app/app/proguard-rules.pro <<'EOF'
          # AIMRELAX LIVE
          EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AIMRELAX LIVE</string>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.AIMRELAX" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF6600</item>
                  <item name="android:navigationBarColor">@color/black</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AIMRELAX"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name="io.livekit.android.room.track.screencapture.ScreenCaptureService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

              </application>

          </manifest>
          EOF

          cat > android-app/app/src/main/java/com/aimrelax/live/MainActivity.kt <<'EOF'
          package com.aimrelax.live

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          import io.livekit.android.LiveKit
          import io.livekit.android.room.Room
          import io.livekit.android.room.track.screencapture.ScreenCaptureParams

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private lateinit var room: Room

              private var pendingServerUrl: String? = null
              private var pendingToken: String? = null

              private val mediaProjectionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) { result ->

                      if (result.resultCode != Activity.RESULT_OK) {
                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:'Screen capture permission denied'}}));"
                          )
                          return@registerForActivityResult
                      }

                      val data = result.data

                      if (data == null) {
                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:'Screen capture data missing'}}));"
                          )
                          return@registerForActivityResult
                      }

                      publishScreen(data)
                  }

              private val permissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) { permissions ->

                      val cameraGranted =
                          permissions[Manifest.permission.CAMERA] == true

                      val audioGranted =
                          permissions[Manifest.permission.RECORD_AUDIO] == true

                      if (!cameraGranted || !audioGranted) {
                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-native-error',{detail:{message:'Camera and microphone permissions are required'}}));"
                          )
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  room = LiveKit.create(applicationContext)

                  setupWebView()
                  requestPermissionsIfNeeded()
              }

              private fun setupWebView() {
                  webView = WebView(this)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      mediaPlaybackRequiresUserGesture = false
                      allowFileAccess = false
                      allowContentAccess = false
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }

                  webView.webViewClient = WebViewClient()
                  webView.webChromeClient = WebChromeClient()

                  webView.addJavascriptInterface(
                      NativeBridge(),
                      "AIMRELAX_NATIVE"
                  )

                  setContentView(webView)

                  webView.loadUrl(
                      "https://aimrelax-pubg.github.io/"
                  )
              }

              private fun requestPermissionsIfNeeded() {
                  val permissions = mutableListOf<String>()

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      permissions.add(Manifest.permission.CAMERA)
                  }

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      permissions.add(Manifest.permission.RECORD_AUDIO)
                  }

                  if (
                      Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  if (permissions.isNotEmpty()) {
                      permissionLauncher.launch(
                          permissions.toTypedArray()
                      )
                  }
              }

              private fun connectLiveKit(
                  serverUrl: String,
                  token: String
              ) {
                  pendingServerUrl = serverUrl
                  pendingToken = token

                  lifecycleScope.launchWhenStarted {
                      try {
                          room.connect(
                              serverUrl,
                              token
                          )

                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-livekit-connected'));"
                          )

                      } catch (e: Exception) {

                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-native-error',{detail:{message:${jsString(e.message ?: "LiveKit connection failed")}}}));"
                          )
                      }
                  }
              }

              private fun startScreenShare() {
                  val manager =
                      getSystemService(
                          MEDIA_PROJECTION_SERVICE
                      ) as MediaProjectionManager

                  mediaProjectionLauncher.launch(
                      manager.createScreenCaptureIntent()
                  )
              }

              private fun publishScreen(
                  data: Intent
              ) {
                  lifecycleScope.launchWhenStarted {
                      try {

                          val screenCaptureParams =
                              ScreenCaptureParams(
                                  mediaProjectionPermissionResultData = data
                              )

                          val success =
                              room.localParticipant
                                  .setScreenShareEnabled(
                                      true,
                                      screenCaptureParams
                                  )

                          if (success) {
                              sendToWeb(
                                  "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-started'));"
                              )
                          } else {
                              sendToWeb(
                                  "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:'Unable to start screen sharing'}}));"
                              )
                          }

                      } catch (e: Exception) {

                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:${jsString(e.message ?: "Screen share failed")}}}));"
                          )
                      }
                  }
              }

              private fun stopScreenShare() {
                  lifecycleScope.launchWhenStarted {
                      try {

                          room.localParticipant
                              .setScreenShareEnabled(false)

                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-stopped'));"
                          )

                      } catch (e: Exception) {

                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-screen-share-error',{detail:{message:${jsString(e.message ?: "Unable to stop screen sharing")}}}));"
                          )
                      }
                  }
              }

              private fun disconnectLiveKit() {
                  lifecycleScope.launchWhenStarted {
                      try {
                          room.disconnect()

                          sendToWeb(
                              "window.dispatchEvent(new CustomEvent('aimrelax-livekit-disconnected'));"
                          )

                      } catch (_: Exception) {
                      }
                  }
              }

              private fun sendToWeb(script: String) {
                  runOnUiThread {
                      if (::webView.isInitialized) {
                          webView.evaluateJavascript(
                              script,
                              null
                          )
                      }
                  }
              }

              private fun jsString(value: String): String {
                  return "'" +
                      value
                          .replace("\\", "\\\\")
                          .replace("'", "\\'")
                          .replace("\n", "\\n")
                          .replace("\r", "\\r") +
                      "'"
              }

              inner class NativeBridge {

                  @JavascriptInterface
                  fun isAndroidApp(): Boolean {
                      return true
                  }

                  @JavascriptInterface
                  fun startLiveKit(
                      serverUrl: String,
                      token: String
                  ) {
                      runOnUiThread {
                          connectLiveKit(
                              serverUrl,
                              token
                          )
                      }
                  }

                  @JavascriptInterface
                  fun startScreenShare() {
                      runOnUiThread {
                          MainActivity@this.startScreenShare()
                      }
                  }

                  @JavascriptInterface
                  fun stopScreenShare() {
                      runOnUiThread {
                          MainActivity@this.stopScreenShare()
                      }
                  }

                  @JavascriptInterface
                  fun disconnectLiveKit() {
                      runOnUiThread {
                          MainActivity@this.disconnectLiveKit()
                      }
                  }
              }

              override fun onDestroy() {
                  try {
                      room.disconnect()
                  } catch (_: Exception) {
                  }

                  webView.destroy()

                  super.onDestroy()
              }
          }
          EOF

          cd android-app

          gradle wrapper --gradle-version 8.10.2

      - name: Build Debug APK
        working-directory: android-app
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMRELAX-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
